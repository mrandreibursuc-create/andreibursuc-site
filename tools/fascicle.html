      spared:{en:"All hamstrings, including the short head of biceps femoris — their branches have already left. That is what separates this from a lesion in the thigh.",fr:"Tous les ischio-jambiers, chef court du biceps inclus — leurs branches sont déjà sorties. C'est ce qui la distingue d'une lésion à la cuisse."},
      edx:{en:"A normal short head of biceps femoris with abnormal fibular and tibial muscles below the knee places the lesion at or below the bifurcation. Imaging the popliteal fossa is the next step.",fr:"Un chef court du biceps normal avec des muscles fibulaires et tibiaux anormaux sous le genou place la lésion à la bifurcation ou en aval. L'imagerie du creux poplité est l'étape suivante."},
      why:{en:"A space-occupying lesion in a confined fossa. Selectivity here follows what has already branched, exactly as at the wrist and elbow in the arm.",fr:"Une lésion expansive dans une fosse close. La sélectivité suit ici ce qui a déjà donné ses branches, exactement comme au poignet et au coude au membre supérieur."}}
  },
  evidence:[
    {conf:"high", claim:{en:"The fibular division runs lateral to the tibial division and the two physically separate in the mid-thigh; all sciatic-innervated thigh muscles derive from the tibial division except the short head of biceps femoris, the only fibular-innervated muscle above the fibular neck.",fr:"La division fibulaire chemine en dehors de la tibiale et les deux se séparent physiquement à mi-cuisse ; tous les muscles de cuisse innervés par le sciatique dérivent de la division tibiale, sauf le chef court du biceps, seul muscle fibulaire au-dessus du col de la fibula."},
      src:"Preston & Shapiro, Ch 33; Ch 22 Fig 22–2"},
    {conf:"high", claim:{en:"Fibular fibres are preferentially affected in most sciatic lesions and in lumbosacral plexopathies; at plexus level the stated reason is that they lie posteriorly, closest to the bone, and are more vulnerable to compression than the tibial division fibres.",fr:"Les fibres fibulaires sont préférentiellement atteintes dans la plupart des lésions sciatiques et des plexopathies lombo-sacrées ; au niveau du plexus, la raison avancée est qu'elles sont postérieures, au contact de l'os, et plus vulnérables à la compression que les fibres tibiales."},
      src:"Preston & Shapiro, Ch 33 and Ch 32"},
    {conf:"high", claim:{en:"Fascicles to certain muscles can be preferentially affected whereas others are preferentially spared — so EMG can be used only to identify a lesion at or proximal to the most proximal muscle involved.",fr:"Les fascicules de certains muscles peuvent être préférentiellement atteints tandis que d'autres sont préférentiellement épargnés — l'EMG ne permet donc d'identifier qu'une lésion au niveau ou en amont du muscle atteint le plus proximal."},
      src:"Preston & Shapiro, Ch 33"},
    {conf:"mod", claim:{en:"The lateral-versus-medial arrangement of the two divisions is stated by the book; the finer positions of the hamstring and posterior cutaneous groups drawn here are schematic.",fr:"L'agencement latéral/médial des deux divisions est énoncé par le livre ; les positions plus fines des groupes ischio-jambiers et cutané postérieur dessinées ici sont schématiques."},
      src:"Preston & Shapiro, Ch 33; Sunderland 1978"}
  ]
},

fibular:{
  name:{en:"Common fibular",fr:"Fibulaire commun"}, roots:"L4–S1", limb:"lower", axes:"leg",
  blurb:{en:"Still called the peroneal nerve in almost every electrodiagnostic text and on most EMG machines — this tool uses the current term. It is also the one nerve in the limb where the book actually draws the fascicular cross-section: at the fibular neck the deep fibular fibres lie medial, adjacent to the fibula, and the superficial fibular fibres lie lateral, which is why the deep branch fails first.",
         fr:"Encore appelé nerf péronier dans presque tous les textes d'électrodiagnostic et sur la plupart des appareils d'EMG — cet outil emploie le terme actuel. C'est aussi le seul nerf du membre dont le livre dessine réellement la coupe fasciculaire : au col de la fibula, les fibres du fibulaire profond sont médiales, au contact de la fibula, et celles du fibulaire superficiel latérales, d'où la défaillance première de la branche profonde."},
  trunks:[
    {id:"main", label:{en:"Common fibular",fr:"Fibulaire commun"}, until:4, key:[[0,0,0,1]]},
    {id:"deep", label:{en:"Deep fibular",fr:"Fibulaire profond"}, from:4, key:[[4,-0.46,0.08,0.48],[8,-0.48,0.06,0.48],[9,-0.36,0.06,0.30]]},
    {id:"sup", label:{en:"Superficial fibular",fr:"Fibulaire superficiel"}, from:4, key:[[4,0.48,-0.06,0.46],[9,0.50,-0.06,0.46]]}
  ],
  levels:[
    {code:"L0", name:{en:"From the sciatic bifurcation",fr:"Issu de la bifurcation sciatique"}, dist:{en:"Above the popliteal fossa",fr:"Au-dessus du creux poplité"}, kind:"plain"},
    {code:"L1", name:{en:"Lateral popliteal fossa",fr:"Creux poplité, versant latéral"}, dist:{en:"Descending along the lateral border",fr:"Descente le long du bord latéral"}, kind:"plain"},
    {code:"L2", name:{en:"Lateral cutaneous nerve of the knee",fr:"Nerf cutané latéral du genou"}, dist:{en:"The first branch — arises before the nerve winds around the fibular neck",fr:"Première branche — naît avant que le nerf ne contourne le col de la fibula"}, kind:"branch"},
    {code:"L3", name:{en:"Fibular neck",fr:"Col de la fibula"}, dist:{en:"Through the fibular tunnel, between the fibularis longus and the fibula",fr:"Dans le tunnel fibulaire, entre le long fibulaire et la fibula"}, kind:"entrap", sites:["fibular_neck"]},
    {code:"L4", name:{en:"Division",fr:"Division"}, dist:{en:"Into deep and superficial fibular nerves",fr:"En nerfs fibulaires profond et superficiel"}, kind:"branch"},
    {code:"L5", name:{en:"Anterior and lateral compartments",fr:"Loges antérieure et latérale"}, dist:{en:"Superficial branch to fibularis longus and brevis; the deep branch gives its tibialis anterior branch",fr:"Branche superficielle pour les long et court fibulaires ; la branche profonde donne son rameau pour le tibial antérieur"}, kind:"branch"},
    {code:"L6", name:{en:"Mid leg",fr:"Jambe moyenne"}, dist:{en:"Deep branch on the interosseous membrane — extensor digitorum longus branches; the superficial branch pierces the fascia and gives the lateral calf skin",fr:"Branche profonde sur la membrane interosseuse — rameaux du long extenseur des orteils ; la branche superficielle traverse le fascia et donne la peau latérale du mollet"}, kind:"branch"},
    {code:"L7", name:{en:"Ankle",fr:"Cheville"}, dist:{en:"Deep branch under the inferior extensor retinaculum; superficial sensory branches become subcutaneous",fr:"Branche profonde sous le rétinaculum inférieur des extenseurs ; branches sensitives superficielles devenues sous-cutanées"}, kind:"entrap", sites:["ant_tarsal","ski_boot"]},
    {code:"L8", name:{en:"Dorsum of the foot",fr:"Dos du pied"}, dist:{en:"Lateral terminal branch to extensor digitorum brevis; the superficial branch has divided into the medial and intermediate dorsal cutaneous nerves",fr:"Branche terminale latérale pour le court extenseur des orteils ; la branche superficielle s'est divisée en nerfs cutanés dorsaux médial et intermédiaire"}, kind:"branch"},
    {code:"L9", name:{en:"Toes",fr:"Orteils"}, dist:{en:"Deep fibular to the first web space; superficial fibular to the dorsal toes as far as the interphalangeal joints",fr:"Fibulaire profond pour le premier espace ; fibulaire superficiel pour le dos des orteils jusqu'aux interphalangiennes"}, kind:"branch"}
  ],
  groups:[
    { id:"lckn", abbr:{en:"Lat. cut. knee",fr:"Cut. lat. genou"}, kind:"s", color:C.s3, from:0, exit:2,
      label:{en:"Lateral cutaneous nerve of the knee",fr:"Nerf cutané latéral du genou"},
      supplies:{en:"Skin over the lateral knee",fr:"Peau de la face latérale du genou"},
      note:{en:"Small, and the single most useful sensory branch in the lower limb for localisation. Because it arises above the fibular neck, sensation over the lateral knee is preserved in a fibular palsy at the neck. Sensory loss there means the lesion is sciatic, plexus or L5 — never fibular at the fibular neck. The common fibular nerve also gives off the lateral sural cutaneous nerve and the sural communicating branch at about this level — the second parent of the sural nerve, which is why a fibular lesion at the neck leaves the sural response intact but a sciatic lesion does not.",
            fr:"Petite, et la branche sensitive la plus utile du membre inférieur pour la localisation. Naissant au-dessus du col de la fibula, la sensibilité de la face latérale du genou est conservée dans une paralysie fibulaire au col. Une hypoesthésie à ce niveau signifie une atteinte sciatique, plexique ou L5 — jamais fibulaire au col. Le fibulaire commun donne aussi à ce niveau le nerf cutané sural latéral et le rameau communicant sural — le second parent du nerf sural, ce qui explique qu'une lésion fibulaire au col laisse la réponse surale intacte alors qu'une lésion sciatique non."},
      key:[[0,0.36,0.18,0.19],[2,0.48,0.26,0.17]]},
    { id:"dpn", abbr:{en:"Deep fibular",fr:"Fibulaire profond"}, kind:"m", color:C.m2, from:0, exit:9,
      trunk:[[0,"main"],[4,"deep"]],
      label:{en:"Deep fibular",fr:"Fibulaire profond"},
      supplies:{en:"Tibialis anterior, extensor digitorum longus, extensor hallucis longus, fibularis tertius, extensor digitorum brevis; sensation in the first web space",fr:"Tibial antérieur, long extenseur des orteils, long extenseur de l'hallux, troisième fibulaire, court extenseur des orteils ; sensibilité du premier espace interdigital"},
      note:{en:"The small dashed fascicle without a muscle name is the branch's own cutaneous component, to the first web space — Sunderland's figure names fascicles by muscle content only. At the fibular neck these fibres lie medial, adjacent to the fibula. That position is the book's stated reason why most fibular lesions affect the deep branch more than the superficial, and why occasionally only the deep branch is involved. Note that tibialis anterior is itself a mild foot inverter, inserting on the medial cuneiform and first metatarsal — so weak inversion must be tested with the ankle passively dorsiflexed.",
            fr:"Le petit fascicule pointillé sans nom de muscle est la composante cutanée propre de la branche, pour le premier espace interdigital — la figure de Sunderland ne nomme les fascicules que par leur contenu musculaire. Au col de la fibula ces fibres sont médiales, au contact de la fibula. Cette position est la raison avancée par le livre pour laquelle la plupart des lésions fibulaires touchent la branche profonde plus que la superficielle, et pour laquelle seule la profonde est parfois atteinte. À noter que le tibial antérieur est lui-même un léger inverseur du pied, s'insérant sur le cunéiforme médial et le premier métatarsien — une inversion faible doit donc être testée cheville passivement en dorsiflexion."},
      quote:{text:{en:"selective fascicular vulnerability of the deep fibers, which lie the closest to the fibula, and are more prone to compression",fr:"vulnérabilité fasciculaire sélective des fibres profondes, les plus proches de la fibula et les plus exposées à la compression"}, src:"Preston & Shapiro, Ch 22"},
      key:[[0,-0.14,0.10,0.32],[3,-0.30,0.02,0.34],[4,0.00,0.00,0.64],[9,0.00,0.00,0.68]]},
    { id:"spn_m", abbr:{en:"Fibularis L/B",fr:"Fibulaires"}, kind:"m", color:C.m3, from:0, exit:5,
      trunk:[[0,"main"],[4,"sup"]],
      label:{en:"Superficial fibular motor",fr:"Fibulaire superficiel, moteur"},
      supplies:{en:"Fibularis longus and fibularis brevis — the ankle evertors",fr:"Long et court fibulaires — les éverseurs de la cheville"},
      note:{en:"Weak eversion with weak dorsiflexion is a common fibular lesion; weak dorsiflexion with normal eversion points to the deep branch alone. Eversion is the sign that separates the two, and it is the one most often not tested.",
            fr:"Éversion faible avec dorsiflexion faible : lésion du fibulaire commun ; dorsiflexion faible avec éversion normale : branche profonde seule. L'éversion est le signe qui les sépare, et celui qu'on omet le plus souvent de tester."},
      key:[[0,0.28,-0.10,0.26],[3,0.40,-0.06,0.26],[4,0.10,-0.34,0.36],[5,0.22,-0.44,0.30]]},
    { id:"spn_s", abbr:{en:"Sup. sensory",fr:"Sens. superf."}, kind:"s", color:C.s1, from:0, exit:9,
      trunk:[[0,"main"],[4,"sup"]],
      label:{en:"Superficial fibular sensory",fr:"Fibulaire superficiel, sensitif"},
      supplies:{en:"Mid and lower lateral calf, then the dorsum of the foot via the medial and intermediate dorsal cutaneous nerves, to the level of the interphalangeal joints",fr:"Tiers moyen et inférieur de la face latérale de la jambe, puis dos du pied par les nerfs cutanés dorsaux médial et intermédiaire, jusqu'aux interphalangiennes"},
      note:{en:"Lateral at the fibular neck and therefore comparatively protected. In a purely demyelinating lesion at the neck the distal sensory response stays normal, which is what tells you the lesion is a block and predicts recovery in one to two months rather than a year.",
            fr:"Latérale au col de la fibula, donc comparativement protégée. Dans une lésion purement démyélinisante au col, la réponse sensitive distale reste normale, ce qui signe un bloc et prédit une récupération en un à deux mois plutôt qu'en un an."},
      key:[[0,0.16,0.30,0.28],[3,0.34,0.24,0.28],[4,-0.08,0.20,0.52],[9,-0.04,0.16,0.58]]}
  ],
  sites:{
    fibular_neck:{ name:{en:"Fibular neck",fr:"Col de la fibula"}, hit:["dpn","spn_m","spn_s"],
      deficit:{en:"Foot and toe drop with weak eversion, a steppage gait, foot slap, tripping on curbs and recurrent ankle sprains. Sensory loss over the mid and lower lateral calf and the dorsum of the foot. Tinel's sign over the lateral fibular neck.",fr:"Pied et orteils tombants avec éversion faible, steppage, claquement du pied, faux pas sur les trottoirs et entorses à répétition. Hypoesthésie de la face latérale de la jambe en tiers moyen et inférieur et du dos du pied. Signe de Tinel au col de la fibula."},
      spared:{en:"Ankle inversion (tibialis posterior, tibial-innervated), sensation over the lateral knee (its nerve left above the neck), the sole and lateral foot, medial calf and foot, plantar flexion, knee flexion, hip abduction and extension — and all reflexes, including the ankle jerk, are normal.",fr:"L'inversion de cheville (tibial postérieur, innervation tibiale), la sensibilité de la face latérale du genou (son nerf est sorti au-dessus du col), la plante et le bord latéral du pied, le mollet et le pied en médial, la flexion plantaire, la flexion du genou, l'abduction et l'extension de hanche — et tous les réflexes, achilléen inclus, sont normaux."},
      edx:{en:"Record the extensor digitorum brevis first, but if there is no block or slowing, repeat recording tibialis anterior — block is sometimes seen recording TA and not EDB. Slowing over 10 m/s is significant; an amplitude or area drop over 20% across a short segment suggests block. Needle at least two deep fibular muscles, one superficial fibular muscle, tibialis posterior, and the short head of biceps femoris.",fr:"Enregistrer d'abord le court extenseur des orteils, mais en l'absence de bloc ou de ralentissement, recommencer en enregistrant le tibial antérieur — le bloc est parfois visible sur le TA et non sur le CEO. Un ralentissement supérieur à 10 m/s est significatif ; une chute d'amplitude ou de surface supérieure à 20 % sur un segment court évoque un bloc. Piquer au moins deux muscles fibulaires profonds, un superficiel, le tibial postérieur et le chef court du biceps."},
      why:{en:"The deep fibres lie closest to the fibula and take the compression first, so the deep branch is commonly affected more than the superficial and occasionally alone. Thin patients and those with recent weight loss are at risk from the lack of protective adipose tissue at the neck.",fr:"Les fibres profondes, les plus proches de la fibula, encaissent la compression en premier : la branche profonde est donc souvent plus atteinte que la superficielle, et parfois seule. Les sujets minces ou ayant récemment maigri sont exposés, faute de tissu adipeux protecteur au col."}},
    ant_tarsal:{ name:{en:"Anterior tarsal tunnel syndrome",fr:"Syndrome du tunnel tarsien antérieur"}, hit:["dpn"],
      deficit:{en:"Foot pain and paresthesias between the great and second toes, with atrophy and weakness of extensor digitorum brevis and decreased sensation in the first web space. Plantar flexion increases symptoms, dorsiflexion relieves them.",fr:"Douleur du pied et paresthésies entre le premier et le deuxième orteils, avec amyotrophie et faiblesse du court extenseur des orteils et hypoesthésie du premier espace. La flexion plantaire aggrave, la dorsiflexion soulage."},
      spared:{en:"Everything proximal — tibialis anterior and the long extensors, all eversion, and all superficial fibular sensation over the lateral calf.",fr:"Tout ce qui est proximal — tibial antérieur et longs extenseurs, toute l'éversion, et toute la sensibilité fibulaire superficielle de la face latérale de la jambe."},
      edx:{en:"The only abnormality will be denervation or reinnervation limited to extensor digitorum brevis — but many normal people show reinnervation in EDB from everyday shoe compression, so routine sampling of EDB is not recommended and the diagnosis is clinical. Always compare with the contralateral EDB.",fr:"La seule anomalie sera une dénervation ou réinnervation limitée au court extenseur des orteils — mais beaucoup de sujets normaux montrent une réinnervation du CEO du fait de la compression quotidienne par la chaussure : l'échantillonnage de routine du CEO n'est pas recommandé et le diagnostic reste clinique. Toujours comparer au CEO controlatéral."},
      why:{en:"Compression under the inferior extensor retinaculum, from trauma, tight shoes — especially in dancers — bony ankle abnormalities, ganglion cysts or pes cavus. An abnormal EDB is far more often due to a polyneuropathy, a fibular lesion at the neck, or an L5 radiculopathy.",fr:"Compression sous le rétinaculum inférieur des extenseurs, par traumatisme, chaussures serrées — surtout chez les danseurs —, anomalies osseuses de cheville, kystes synoviaux ou pied creux. Un CEO anormal relève bien plus souvent d'une polyneuropathie, d'une lésion fibulaire au col ou d'une radiculopathie L5."}},
    ski_boot:{ name:{en:"Ski boot neuropathy",fr:"Neuropathie de la chaussure de ski"}, hit:["spn_s"],
      deficit:{en:"External compression of the distal superficial fibular sensory branches by tight boots or shoes, mapping onto the medial and intermediate dorsal cutaneous territories over the dorsum of the foot.",fr:"Compression externe des branches sensitives distales du fibulaire superficiel par des chaussures serrées, dessinant les territoires cutanés dorsaux médial et intermédiaire sur le dos du pied."},
      spared:{en:"All motor function, and the first web space, which is deep fibular.",fr:"Toute la fonction motrice, et le premier espace interdigital, qui dépend du fibulaire profond."},
      edx:{en:"A reduced or absent superficial fibular sensory response with normal motor studies, best interpreted against the other side.",fr:"Réponse sensitive fibulaire superficielle réduite ou abolie, études motrices normales, à interpréter par comparaison au côté opposé."},
      why:{en:"Purely sensory branches lying subcutaneously with nothing between them and the boot shell.",fr:"Branches purement sensitives, sous-cutanées, sans rien entre elles et la coque de la chaussure."}}
  },
  evidence:[
    {conf:"mod", claim:{en:"Nomenclature: this tool uses the Terminologia Anatomica terms — common, deep and superficial fibular nerve, fibularis longus, brevis and tertius, fibular division of the sciatic, accessory fibular nerve. Preston & Shapiro and most electrodiagnostic sources still use peroneal and peroneus throughout; the structures are identical.",fr:"Nomenclature : cet outil emploie les termes de la Terminologia Anatomica — nerfs fibulaires commun, profond et superficiel, long, court et troisième fibulaires, division fibulaire du sciatique, nerf fibulaire accessoire. Preston & Shapiro et la plupart des sources électrodiagnostiques emploient encore péronier ; les structures sont identiques."},
      src:{en:"Terminologia Anatomica; source text uses the older terms",fr:"Terminologia Anatomica ; le texte source emploie les termes anciens"}},
    {conf:"high", claim:{en:"At the fibular neck, fibres destined for the deep fibular nerve lie more medial, adjacent to the fibula, and fibres destined for the superficial fibular nerve are more lateral. The deep branch is commonly more affected, attributed to selective fascicular vulnerability of the deep fibres, which lie closest to the fibula.",fr:"Au col de la fibula, les fibres destinées au fibulaire profond sont plus médiales, au contact de la fibula, et celles destinées au fibulaire superficiel plus latérales. La branche profonde est plus souvent atteinte, du fait d'une vulnérabilité fasciculaire sélective des fibres profondes, les plus proches de la fibula."},
      src:"Preston & Shapiro, Ch 22, Fig 22–3 (after Sunderland)"},
    {conf:"high", claim:{en:"The lateral cutaneous nerve of the knee is the common fibular nerve's first branch and arises above the fibular neck, so lateral knee sensation is preserved in a fibular palsy at the neck — sensory loss there occurs only in sciatic, plexus or L5 lesions.",fr:"Le nerf cutané latéral du genou est la première branche du fibulaire commun et naît au-dessus du col, si bien que la sensibilité latérale du genou est conservée dans une paralysie au col — une hypoesthésie à ce niveau ne s'observe que dans les lésions sciatiques, plexiques ou L5."},
      src:"Preston & Shapiro, Ch 22, Tables 22–1 and 22–2"},
    {conf:"high", claim:{en:"In 15 to 20% of patients an accessory fibular nerve leaves the main superficial fibular nerve and runs posterior to the lateral malleolus to supply the lateral part of extensor digitorum brevis — an important normal variant encountered during routine studies.",fr:"Chez 15 à 20 % des patients, un nerf fibulaire accessoire quitte le fibulaire superficiel et passe en arrière de la malléole latérale pour innerver la partie latérale du court extenseur des orteils — variante normale importante, rencontrée en routine."},
      src:"Preston & Shapiro, Ch 22"},
    {conf:"high", claim:{en:"Preferential weakness of EHL out of proportion to tibialis anterior suggests L5 rather than fibular — in a fibular neuropathy the two are usually equally affected.",fr:"Une faiblesse du LEH disproportionnée par rapport au tibial antérieur oriente vers L5 plutôt que vers le fibulaire — dans une neuropathie fibulaire les deux sont en général également atteints."},
      src:"Preston & Shapiro, Ch 22"}
  ]
},

tibial:{
  name:{en:"Tibial",fr:"Tibial"}, roots:"L4–S3", limb:"lower", axes:"leg",
  blurb:{en:"A long nerve with a very short list of entrapments. The book is unusually direct here: unlike carpal tunnel syndrome, tarsal tunnel syndrome is exceptionally rare, and nearly impossible to diagnose in the presence of a polyneuropathy.",
         fr:"Un long nerf avec une très courte liste de compressions. Le livre est ici inhabituellement direct : à la différence du canal carpien, le syndrome du tunnel tarsien est exceptionnellement rare, et quasi impossible à diagnostiquer en présence d'une polyneuropathie."},
  trunks:[
    {id:"main", label:{en:"Tibial nerve",fr:"Nerf tibial"}, until:7, key:[[0,0,0,1]]},

  ],
  levels:[

    {code:"L2", name:{en:"Popliteal fossa branches",fr:"Branches du creux poplité"}, dist:{en:"Gastrocnemius, plantaris, soleus and popliteus — and the medial sural cutaneous nerve, which leaves here",fr:"Gastrocnémiens, plantaire, soléaire et poplité — et le nerf cutané sural médial, qui sort ici"}, kind:"branch"},
    {code:"L3", name:{en:"Soleal arch",fr:"Arcade du soléaire"}, dist:{en:"Deep branches, below the arch: tibialis posterior, flexor digitorum longus, flexor hallucis longus",fr:"Branches profondes, sous l'arcade : tibial postérieur, long fléchisseur des orteils, long fléchisseur de l'hallux"}, kind:"branch"},
    {code:"L4", name:{en:"Mid calf — sural nerve formed",fr:"Mi-mollet — constitution du nerf sural"}, dist:{en:"The medial sural cutaneous nerve is joined by the sural communicating branch of the common fibular nerve; the sural proper begins here",fr:"Le nerf cutané sural médial est rejoint par le rameau communicant sural du fibulaire commun ; le sural proprement dit commence ici"}, kind:"plain"},
    {code:"L5", name:{en:"Distal leg",fr:"Jambe distale"}, dist:{en:"Descending behind the medial malleolus",fr:"Descente en arrière de la malléole médiale"}, kind:"plain"},
    {code:"L6", name:{en:"Tarsal tunnel",fr:"Tunnel tarsien"}, dist:{en:"Fibro-osseous tunnel below the medial malleolus; bony floor, roof formed by the flexor retinaculum",fr:"Tunnel fibro-osseux sous la malléole médiale ; plancher osseux, toit formé par le rétinaculum des fléchisseurs"}, kind:"entrap", sites:["tarsal"]},
    {code:"L7", name:{en:"Terminal division",fr:"Division terminale"}, dist:{en:"Into three or four branches — calcaneal, medial plantar, lateral plantar",fr:"En trois ou quatre branches — calcanéenne, plantaire médiale, plantaire latérale"}, kind:"branch"},
    {code:"L8", name:{en:"Sole of the foot",fr:"Plante du pied"}, dist:{en:"Plantar digital nerves and the foot intrinsics",fr:"Nerfs digitaux plantaires et muscles intrinsèques du pied"}, kind:"entrap", sites:["baxter"]},
    {code:"L9", name:{en:"Plantar digital nerves",fr:"Nerfs digitaux plantaires"}, dist:{en:"Medial plantar to the first three and a half toes; lateral plantar to the little toe and the lateral fourth",fr:"Plantaire médial pour les trois orteils et demi médiaux ; plantaire latéral pour le cinquième et le bord latéral du quatrième"}, kind:"branch"}
  ],
  groups:[
    { id:"calf", abbr:{en:"Triceps surae",fr:"Triceps sural"}, kind:"m", color:C.m1, from:0, exit:2,

      supplies:{en:"Gastrocnemius, soleus, plantaris, popliteus",fr:"Gastrocnémiens, soléaire, plantaire, poplité"},
      note:{en:"The ankle reflex is mediated here, proximal to the tarsal tunnel — which is exactly why a normal ankle reflex is expected in tarsal tunnel syndrome and an abnormal one sends you looking above the ankle.",
            fr:"Le réflexe achilléen dépend de ce niveau, en amont du tunnel tarsien — d'où un réflexe achilléen normal attendu dans le syndrome du tunnel tarsien, une anomalie devant faire chercher plus haut."},
      key:[[0,-0.06,0.34,0.28],[2,-0.14,0.46,0.24]]},
    { id:"deepcalf", abbr:{en:"Tib. post.",fr:"Tib. post."}, kind:"m", color:C.m4, from:0, exit:3,
      label:{en:"Deep posterior compartment",fr:"Loge postérieure profonde"},
      supplies:{en:"Tibialis posterior, flexor digitorum longus, flexor hallucis longus",fr:"Tibial postérieur, long fléchisseur des orteils, long fléchisseur de l'hallux"},
      note:{en:"Tibialis posterior is the workhorse of foot-drop localisation. It is abnormal in sciatic, plexus and L5 lesions but never in a fibular lesion at the fibular neck, so its state is what turns a foot drop into a localised diagnosis.",
            fr:"Le tibial postérieur est le muscle-clé de la localisation d'un pied tombant. Il est anormal dans les lésions sciatiques, plexiques et L5, jamais dans une lésion fibulaire au col : son état transforme un pied tombant en diagnostic localisé."},
      key:[[0,0.18,0.18,0.24],[3,0.28,0.26,0.22]]},
    { id:"msc", abbr:{en:"Med. sural cut.",fr:"Cut. sural méd."}, kind:"s", color:C.s3, from:0, exit:2,
      label:{en:"Medial sural cutaneous",fr:"Cutané sural médial"},
      supplies:{en:"The tibial contribution to the sural nerve — posterior calf, and eventually the lateral foot",fr:"La contribution tibiale au nerf sural — face postérieure du mollet, et à terme le bord latéral du pied"},
      note:{en:"It leaves the back of the tibial nerve in the popliteal fossa and runs down between the two heads of gastrocnemius — so it goes at the same level as the calf branches, well above tibialis posterior, flexor digitorum longus and flexor hallucis longus. The sural you record in the lab is not purely tibial: this branch only becomes the sural proper in the mid-calf, where the sural communicating branch from the common fibular nerve joins it. That two-parent origin is why an abnormal sural implicates S1 or the sacral plexus, and why the sural is normal in a tarsal tunnel — the whole nerve is already formed far above the ankle.",
            fr:"Il quitte la face postérieure du tibial dans le creux poplité et descend entre les deux chefs du gastrocnémien — il sort donc au même niveau que les branches du mollet, bien au-dessus du tibial postérieur, du long fléchisseur des orteils et du long fléchisseur de l'hallux. Le sural enregistré au laboratoire n'est pas purement tibial : cette branche ne devient le sural proprement dit qu'à mi-mollet, où la rejoint le rameau communicant sural issu du fibulaire commun. Cette double origine explique qu'un sural anormal implique S1 ou le plexus sacré, et qu'il reste normal dans un tunnel tarsien — le nerf est entièrement constitué bien au-dessus de la cheville."},
      key:[[0,0.02,0.42,0.20],[2,0.16,0.52,0.18]]},
    { id:"calcaneal", abbr:{en:"Calcaneal",fr:"Calcanéenne"}, kind:"s", color:C.s2, from:0, exit:7,
      label:{en:"Medial calcaneal branches",fr:"Branches calcanéennes médiales"},
      supplies:{en:"Heel of the sole — one or two purely sensory branches",fr:"Talon plantaire — une ou deux branches purement sensitives"},
      note:{en:"Purely sensory, and one of the three or four terminal branches that may be involved singly. Heel pain with a normal sole and normal intrinsics is a calcaneal branch pattern, not a plantar one.",
            fr:"Purement sensitives, et parmi les trois ou quatre branches terminales pouvant être atteintes isolément. Une talalgie avec plante et intrinsèques normaux relève des branches calcanéennes, non des plantaires."},
      key:[[0,-0.24,-0.02,0.18],[6,-0.32,0.12,0.18],[7,-0.42,0.20,0.16]]},
    { id:"medplantar", abbr:{en:"Med. plantar",fr:"Plant. médial"}, kind:"x", color:C.m3, from:0, exit:9,
      trunk:[[0,"main"],[7,"medp"]],
      label:{en:"Medial plantar nerve",fr:"Nerf plantaire médial"},
      supplies:{en:"Medial sole and the first three and a half toes; abductor hallucis brevis, flexor hallucis brevis, flexor digitorum brevis",fr:"Plante médiale et les trois orteils et demi médiaux ; court abducteur de l'hallux, court fléchisseur de l'hallux, court fléchisseur des orteils"},
      note:{en:"The trap the book flags explicitly: a routine tibial motor study recording abductor hallucis checks only the medial plantar nerve. To catch a lateral plantar lesion you must also record abductor digiti quinti pedis, and compare both with the other side.",
            fr:"Le piège explicitement signalé par le livre : une étude motrice tibiale de routine enregistrant l'abducteur de l'hallux n'explore que le nerf plantaire médial. Pour détecter une atteinte plantaire latérale, il faut aussi enregistrer l'abducteur du cinquième orteil, et comparer les deux au côté opposé."},
      key:[[0,-0.16,-0.24,0.28],[6,-0.24,-0.22,0.30],[6.99,-0.24,-0.22,0.30],[7,0.00,0.00,0.66],[9,0.00,0.00,0.70]]},
    { id:"latplantar", abbr:{en:"Lat. plantar",fr:"Plant. latéral"}, kind:"x", color:C.m6, from:0, exit:9,
      trunk:[[0,"main"],[7,"latp"]],
      label:{en:"Lateral plantar nerve",fr:"Nerf plantaire latéral"},
      supplies:{en:"Lateral sole, the little toe and the lateral fourth toe; abductor digiti quinti pedis",fr:"Plante latérale, le cinquième orteil et le bord latéral du quatrième ; abducteur du cinquième orteil"},
      note:{en:"Foot intrinsic strength is nearly impossible to assess clinically, because the important toe and ankle functions are done by the long flexors and extensors in the leg. That is why this branch is diagnosed electrically or not at all.",
            fr:"La force des intrinsèques du pied est quasi impossible à évaluer cliniquement, les fonctions importantes des orteils et de la cheville étant assurées par les longs fléchisseurs et extenseurs de la jambe. D'où un diagnostic électrique ou pas de diagnostic du tout."},
      key:[[0,0.14,-0.26,0.26],[6,0.22,-0.24,0.28],[6.99,0.22,-0.24,0.28],[7,0.00,0.00,0.64],[9,0.00,0.00,0.68]]}
  ],
  sites:{
    tarsal:{ name:{en:"Tarsal tunnel syndrome",fr:"Syndrome du tunnel tarsien"}, hit:["calcaneal","medplantar","latplantar"],
      deficit:{en:"Perimalleolar pain is the most frequent symptom, with burning ankle and sole pain worse on weight bearing or at night, and sensory loss over the sole. One or more of the three branches — calcaneal, medial plantar, lateral plantar — may be involved, and which ones is the whole variable.",fr:"La douleur péri-malléolaire est le symptôme le plus fréquent, avec des douleurs à type de brûlure de la cheville et de la plante, aggravées à l'appui ou la nuit, et une hypoesthésie plantaire. Une ou plusieurs des trois branches — calcanéenne, plantaire médiale, plantaire latérale — peuvent être atteintes, et lesquelles constitue toute la variable."},
      spared:{en:"The ankle reflex, which is mediated by the tibial nerve proximal to the tunnel, is normal. Sensation over the lateral foot (sural) and the dorsum (superficial fibular) is normal. All calf muscles are normal.",fr:"Le réflexe achilléen, dépendant du tibial en amont du tunnel, est normal. La sensibilité du bord latéral du pied (sural) et du dos du pied (fibulaire superficiel) est normale. Tous les muscles du mollet sont normaux."},
      edx:{en:"Record distal tibial motor to both abductor hallucis and abductor digiti quinti pedis, plus medial and lateral plantar mixed and sensory studies — with identical distances on the two sides, and comparison with the contralateral side required throughout. Bilaterally absent plantar responses carry no diagnostic significance in middle-aged or older people.",fr:"Enregistrer la conduction motrice tibiale distale sur l'abducteur de l'hallux ET sur l'abducteur du cinquième orteil, plus les études mixtes et sensitives plantaires médiale et latérale — avec des distances identiques des deux côtés et comparaison controlatérale systématique. Des réponses plantaires bilatéralement abolies n'ont aucune valeur diagnostique chez le sujet d'âge moyen ou âgé."},
      why:{en:"An unyielding fibro-osseous tunnel — but the book's real warning is interpretive, not anatomical. Increased insertional activity and even fibrillation potentials with large, long-duration motor units are frequently found in normal feet, from everyday wear and tear. Calling an intrinsic foot muscle abnormal requires either marked changes or a distinctly different contralateral muscle.",fr:"Un tunnel fibro-osseux inextensible — mais l'avertissement réel du livre est interprétatif, non anatomique. Une activité d'insertion augmentée, voire des potentiels de fibrillation avec de grands potentiels d'unité motrice de longue durée, se rencontrent fréquemment sur des pieds normaux, par usure quotidienne. Conclure à l'anomalie d'un intrinsèque exige soit des modifications marquées, soit un muscle controlatéral nettement différent."}},
    baxter:{ name:{en:"Inferior calcaneal (Baxter's) nerve",fr:"Nerf calcanéen inférieur (de Baxter)"}, hit:["latplantar"],
      deficit:{en:"Chronic medial heel pain, often mistaken for plantar fasciitis, from entrapment of the first branch of the lateral plantar nerve between abductor hallucis and quadratus plantae. Weakness of abductor digiti quinti pedis without sensory loss.",fr:"Talalgie médiale chronique, souvent prise pour une fasciite plantaire, par compression de la première branche du nerf plantaire latéral entre l'abducteur de l'hallux et le carré plantaire. Faiblesse de l'abducteur du cinquième orteil sans déficit sensitif."},
      spared:{en:"All sensation — this branch is motor to abductor digiti quinti pedis and sensory only to periosteum and the long plantar ligament, so the sole is normal to testing.",fr:"Toute la sensibilité — cette branche est motrice pour l'abducteur du cinquième orteil et sensitive seulement pour le périoste et le ligament plantaire long : la plante est normale à l'examen."},
      edx:{en:"Denervation confined to abductor digiti quinti pedis with a normal abductor hallucis — but read that against the caveat above about normal feet, and always against the other side.",fr:"Dénervation limitée à l'abducteur du cinquième orteil avec abducteur de l'hallux normal — mais à interpréter avec la réserve ci-dessus sur les pieds normaux, et toujours par comparaison au côté opposé."},
      why:{en:"Included here because it is standard in the foot and ankle literature and in your own lower-limb explorer. Flagged deliberately: Preston & Shapiro do not mention the inferior calcaneal or Baxter's nerve anywhere in the tarsal tunnel or sciatic chapters, so unlike everything else on this nerve it does not carry the book's authority.",fr:"Inclus ici parce qu'il est classique dans la littérature du pied et de la cheville et dans votre propre explorateur du membre inférieur. Signalé délibérément : Preston & Shapiro ne mentionnent nulle part le nerf calcanéen inférieur ou de Baxter dans les chapitres du tunnel tarsien ou du sciatique — contrairement à tout le reste de ce nerf, il n'a donc pas l'autorité du livre."}}
  },
  evidence:[
    {conf:"high", claim:{en:"The distal tibial nerve divides into three or four branches: one or two purely sensory calcaneal nerves to the heel of the sole, and the medial and lateral plantar nerves, which are mixed. One or more of the three may be involved in tarsal tunnel syndrome.",fr:"Le tibial distal se divise en trois ou quatre branches : une ou deux branches calcanéennes purement sensitives pour le talon plantaire, et les nerfs plantaires médial et latéral, mixtes. Une ou plusieurs des trois peuvent être atteintes dans le syndrome du tunnel tarsien."},
      src:"Preston & Shapiro, Ch 24"},
    {conf:"high", claim:{en:"The ankle reflex is mediated by the tibial nerve proximal to the tarsal tunnel and is normal in tarsal tunnel syndrome; routine tibial motor studies recording abductor hallucis check only the medial plantar nerve.",fr:"Le réflexe achilléen dépend du tibial en amont du tunnel tarsien et reste normal dans le syndrome du tunnel tarsien ; les études motrices de routine sur l'abducteur de l'hallux n'explorent que le nerf plantaire médial."},
      src:"Preston & Shapiro, Ch 24"},
    {conf:"high", claim:{en:"Fibrillation potentials with large, long-duration motor unit potentials are frequently found in the intrinsic foot muscles of normal asymptomatic subjects, so abnormality requires either marked changes or a distinctly different contralateral muscle.",fr:"Des potentiels de fibrillation avec de grands potentiels d'unité motrice de longue durée se rencontrent fréquemment dans les intrinsèques du pied de sujets normaux asymptomatiques : conclure à l'anomalie exige soit des modifications marquées, soit un muscle controlatéral nettement différent."},
      src:"Preston & Shapiro, Ch 24"},
    {conf:"mod", claim:{en:"The medial sural cutaneous nerve arises from the posterior tibial nerve in the popliteal fossa and descends between the two heads of gastrocnemius, uniting in the mid-calf with the sural communicating branch of the common fibular nerve to form the sural nerve. Preston & Shapiro's Fig 33–1 lists the sural after the deep calf muscles, but that is a label sequence in a schematic, not a statement about the level of origin — standard anatomy places it in the popliteal fossa.",fr:"Le nerf cutané sural médial naît de la face postérieure du tibial dans le creux poplité et descend entre les deux chefs du gastrocnémien, s'unissant à mi-mollet au rameau communicant sural du fibulaire commun pour former le nerf sural. La figure 33–1 de Preston & Shapiro place le sural après les muscles profonds du mollet, mais il s'agit d'une séquence d'étiquettes dans un schéma, non d'un énoncé sur le niveau de naissance — l'anatomie classique le situe dans le creux poplité."},
      src:{en:"Standard anatomy (Terminologia Anatomica nomenclature); Preston & Shapiro Fig 33–1 label order is not evidence of branch level",fr:"Anatomie classique (nomenclature Terminologia Anatomica) ; l'ordre des étiquettes de la Fig 33–1 de Preston & Shapiro ne renseigne pas sur le niveau de naissance"}},
    {conf:"low", claim:{en:"The inferior calcaneal (Baxter's) nerve is NOT described anywhere in the tarsal tunnel or sciatic chapters, and the book makes no proximal-versus-distal tarsal tunnel distinction. That entry comes from the foot and ankle literature, not from this text.",fr:"Le nerf calcanéen inférieur (de Baxter) n'est décrit nulle part dans les chapitres du tunnel tarsien ou du sciatique, et le livre ne fait aucune distinction tunnel tarsien proximal versus distal. Cette entrée provient de la littérature du pied et de la cheville, non de cet ouvrage."},
      src:{en:"Explicit absence in Preston & Shapiro, Ch 24 and Ch 33",fr:"Absence explicite dans Preston & Shapiro, Ch 24 et Ch 33"}}
  ]
},

femoral:{

         fr:"Un nerf où un seul signe clinique fait presque toute la localisation : une flexion de hanche faible signifie que les branches de l'ilio-psoas sont touchées, ce qui place la lésion en amont du ligament inguinal."},

  groups:[
    { id:"psoas", abbr:{en:"Psoas",fr:"Psoas"}, kind:"m", color:C.m1, from:0, exit:2,
      label:{en:"Psoas branches",fr:"Branches du psoas"},
      supplies:{en:"Psoas major",fr:"Grand psoas"},
      note:{en:"Leaves first, and inside the muscle it is destined for. This is why a retroperitoneal haematoma within the psoas produces a femoral picture — the nerve is compressed in the very muscle it supplies.",
            fr:"Sort en premier, et à l'intérieur même du muscle qu'elle innerve. D'où le tableau fémoral d'un hématome rétropéritonéal intra-psoas — le nerf est comprimé dans le muscle qu'il innerve."},
      key:[[0,-0.30,0.24,0.22],[2,-0.44,0.30,0.19]]},
    { id:"iliacus", abbr:{en:"Iliacus",fr:"Iliaque"}, kind:"m", color:C.m4, from:0, exit:3,
      label:{en:"Iliacus branch",fr:"Branche de l'iliaque"},
      supplies:{en:"Iliacus",fr:"Muscle iliaque"},
      note:{en:"The localising branch of this nerve. Because it leaves above the inguinal ligament, weak hip flexion places the lesion proximal to the ligament, and an abnormal iliacus on needle EMG does the same thing electrically.",
            fr:"La branche localisatrice de ce nerf. Naissant au-dessus du ligament inguinal, une flexion de hanche faible place la lésion en amont du ligament, et un muscle iliaque anormal en détection fait de même sur le plan électrique."},
      key:[[0,-0.10,0.30,0.22],[3,-0.20,0.42,0.19]]},
    { id:"antdiv", abbr:{en:"Sartorius",fr:"Sartorius"}, kind:"x", color:C.m3, from:0, exit:6,
      trunk:[[0,"main"],[5,"ant"]],
      label:{en:"Anterior division",fr:"Division antérieure"},
      supplies:{en:"Sartorius and pectineus; medial and intermediate cutaneous nerves of the thigh",fr:"Sartorius et pectiné ; nerfs cutanés médial et intermédiaire de la cuisse"},
      note:{en:"Mixed motor and sensory. Sensory loss over the anterior thigh belongs here; loss over the lateral thigh does not — that is the lateral femoral cutaneous nerve, straight off the lumbar plexus, and its involvement implicates plexus or root.",
            fr:"Mixte, motrice et sensitive. Une hypoesthésie de la face antérieure de la cuisse relève de cette division ; une hypoesthésie latérale non — c'est le nerf cutané latéral de la cuisse, issu directement du plexus lombaire, dont l'atteinte implique le plexus ou la racine."},
      key:[[0,0.28,-0.10,0.26],[4,0.34,-0.06,0.26],[5,0.00,0.00,0.62],[6,0.00,0.00,0.62]]},
    { id:"quads", abbr:{en:"Quadriceps",fr:"Quadriceps"}, kind:"m", color:C.m2, from:0, exit:7,
      trunk:[[0,"main"],[5,"post"]],
      label:{en:"Posterior division — quadriceps",fr:"Division postérieure — quadriceps"},
      supplies:{en:"Rectus femoris, vastus lateralis, vastus medialis, vastus intermedius",fr:"Droit fémoral, vaste latéral, vaste médial, vaste intermédiaire"},
      note:{en:"Test at mechanical disadvantage — ask the patient to rise from a kneeling position — because mild quadriceps weakness hides easily. On needle EMG, vastus lateralis, vastus medialis and rectus femoris are the superficial three; vastus intermedius is much deeper and less accessible. Rectus femoris activates best by flexing the hip with the leg extended.",
            fr:"Tester en désavantage mécanique — demander au patient de se relever de la position à genoux — car une faiblesse quadricipitale discrète se dissimule aisément. En détection, vaste latéral, vaste médial et droit fémoral sont les trois superficiels ; le vaste intermédiaire est bien plus profond et moins accessible. Le droit fémoral s'active le mieux en fléchissant la hanche jambe tendue."},
      key:[[0,-0.02,-0.22,0.30],[4,0.02,-0.24,0.32],[5,0.10,-0.30,0.44],[7,0.16,-0.36,0.40]]},
    { id:"saph", abbr:{en:"Saphenous",fr:"Saphène"}, kind:"s", color:C.s1, from:0, exit:9,
      trunk:[[0,"main"],[5,"post"]],
      label:{en:"Saphenous nerve",fr:"Nerf saphène"},
      supplies:{en:"Medial calf, with an infrapatellar branch and a terminal branch reaching just below the medial malleolus",fr:"Face médiale de la jambe, avec une branche infra-patellaire et une branche terminale atteignant juste sous la malléole médiale"},
      note:{en:"The terminal extension of the femoral nerve, and the key discriminator between a femoral or plexus lesion and an L2–L4 radiculopathy: it is abnormal in any postganglionic lesion with axonal loss and normal in a root lesion. But it is only 5–10 µV even in normals, so it should never be called abnormal without a clear side-to-side asymmetry, and bilaterally absent responses over the age of 40 mean nothing.",
            fr:"Prolongement terminal du nerf fémoral, et discriminant clé entre une lésion fémorale ou plexique et une radiculopathie L2–L4 : anormal dans toute lésion post-ganglionnaire avec perte axonale, normal dans une atteinte radiculaire. Mais il ne mesure que 5–10 µV même chez le sujet normal : ne jamais le déclarer anormal sans asymétrie franche, et des réponses bilatéralement abolies après 40 ans n'ont aucune signification."},
      key:[[0,0.10,0.14,0.28],[4,0.06,0.10,0.32],[5,-0.16,0.24,0.46],[7,-0.10,0.18,0.54],[9,0.00,0.00,0.70]]}
  ],
  sites:{
    retroperitoneal:{ name:{en:"Retroperitoneal haematoma",fr:"Hématome rétropéritonéal"}, hit:["psoas","iliacus","antdiv","quads","saph"],
      deficit:{en:"The patient holds the hip flexed and slightly externally rotated. Weak knee extension and hip flexion, with the knee jerk depressed or absent. Classically from low-molecular-weight or unfractionated heparin, warfarin, haemophilia, or a ruptured aortic aneurysm.",fr:"Le patient maintient la hanche en flexion et légère rotation externe. Extension du genou et flexion de hanche faibles, réflexe rotulien diminué ou aboli. Classiquement sous héparine de bas poids moléculaire ou non fractionnée, warfarine, hémophilie, ou rupture d'anévrisme aortique."},
      spared:{en:"Although the entire lumbar plexus is compressed, the major deficit is usually in the femoral territory — but close examination reveals obturator or lateral femoral cutaneous involvement, which is what tells you it is a plexus lesion and not an isolated femoral one.",fr:"Bien que tout le plexus lombaire soit comprimé, le déficit principal siège en général dans le territoire fémoral — mais un examen attentif révèle une atteinte obturatrice ou du cutané latéral, ce qui signe une lésion plexique et non fémorale isolée."},
      edx:{en:"Test the thigh adductors: they are obturator and their involvement separates a lumbar plexopathy from a femoral neuropathy. Add tibialis anterior, which carries partial L4 innervation, and the L2–L4 paraspinals to exclude a root lesion.",fr:"Tester les adducteurs de cuisse : obturateurs, leur atteinte sépare une plexopathie lombaire d'une neuropathie fémorale. Ajouter le tibial antérieur, à innervation L4 partielle, et les paravertébraux L2–L4 pour éliminer une atteinte radiculaire."},
      why:{en:"The haematoma sits within the psoas muscle itself, compressing the plexus where it has no room to move.",fr:"L'hématome siège dans le psoas lui-même, comprimant le plexus là où il n'a aucune marge de déplacement."}},
    inguinal:{ name:{en:"Compression at the inguinal ligament",fr:"Compression au ligament inguinal"}, hit:["antdiv","quads","saph"],
      deficit:{en:"Knee buckling from quadriceps weakness, with sensory loss over the anterior and medial thigh extending down the medial calf. Classically from prolonged lithotomy positioning, or from self-retaining surgical retractors compressing the nerve against the pelvis.",fr:"Dérobement du genou par faiblesse quadricipitale, avec hypoesthésie des faces antérieure et médiale de la cuisse s'étendant à la face médiale de la jambe. Classiquement par position gynécologique prolongée, ou par écarteurs autostatiques comprimant le nerf contre le bassin."},
      spared:{en:"Hip flexion — iliopsoas branches left above the ligament. This is the sign that localises: preserved hip flexion puts the lesion at or below the inguinal ligament, weak hip flexion puts it above. Thigh adductors and tibialis anterior are also spared, which excludes plexus and root.",fr:"La flexion de hanche — les branches de l'ilio-psoas sont sorties au-dessus du ligament. C'est le signe localisateur : une flexion de hanche conservée place la lésion au niveau ou sous le ligament, une flexion faible au-dessus. Adducteurs et tibial antérieur sont également épargnés, ce qui écarte plexus et racine."},
      edx:{en:"Femoral motor recording rectus femoris, stimulating below the inguinal ligament, bilaterally. A purely demyelinating lesion at or above the ligament gives a normal CMAP when stimulating below it, despite obvious weakness — the trap to know. Saphenous asymmetry over 50% places the lesion at or distal to the dorsal root ganglion.",fr:"Conduction motrice fémorale sur le droit fémoral, stimulation sous le ligament inguinal, bilatéralement. Une lésion purement démyélinisante au niveau ou au-dessus du ligament donne un CMAP normal en stimulant en dessous, malgré une faiblesse évidente — le piège à connaître. Une asymétrie saphène supérieure à 50 % place la lésion au niveau ou en aval du ganglion spinal."},
      why:{en:"The nerve is pressed against the pelvic brim when the hip is flexed and externally rotated. In hip arthroplasty, sciatic neuropathy remains the commonest perioperative nerve injury, but femoral neuropathy now follows it.",fr:"Le nerf est plaqué contre le détroit supérieur, hanche fléchie et en rotation externe. En arthroplastie de hanche, la neuropathie sciatique reste la plus fréquente en périopératoire, mais la neuropathie fémorale vient désormais juste après."}}
  },
  evidence:[
    {conf:"high", claim:{en:"Muscular branches go first to psoas, then iliacus, before the nerve passes beneath the inguinal ligament and divides approximately 4 cm below it into anterior and posterior divisions; the posterior division continues as the saphenous nerve.",fr:"Les branches musculaires vont d'abord au psoas, puis à l'iliaque, avant le passage sous le ligament inguinal et la division, environ 4 cm en dessous, en divisions antérieure et postérieure ; la postérieure se poursuit comme nerf saphène."},
      src:"Preston & Shapiro, Ch 23"},
    {conf:"high", claim:{en:"Weakness of hip flexion indicates iliopsoas involvement, localising the lesion proximal to the inguinal ligament. Thigh adductors and tibialis anterior are the two key non-femoral L2–L4 muscles — abnormality there implicates plexus or roots.",fr:"Une faiblesse de la flexion de hanche traduit une atteinte de l'ilio-psoas et localise la lésion en amont du ligament inguinal. Les adducteurs de cuisse et le tibial antérieur sont les deux muscles L2–L4 non fémoraux clés — leur anomalie implique le plexus ou les racines."},

    {conf:"high", claim:{en:"The saphenous SNAP is 5–10 µV even in normal subjects; it should not be called abnormal without a clear side-to-side asymmetry, and no diagnostic significance should be given to bilaterally absent responses, especially over age 40.",fr:"Le SNAP saphène ne mesure que 5–10 µV même chez le sujet normal ; ne pas le déclarer anormal sans asymétrie franche, et n'accorder aucune valeur diagnostique à des réponses bilatéralement abolies, surtout après 40 ans."},

  fibular:{ 3:{conf:"high",

    note:{en:"The one cross-section in the limb a textbook draws fascicle by fascicle. Dorsiflexor fascicles occupy the medial half against the fibula, evertors the lateral, cutaneous sensory the centre and lateral. The dashed outlines are Sunderland's own: fascicles sharing a destination and exchanging fibres, not separate compartments. A six-leg ChAT/CGRP study found the same three-group order lateral to medial, and added that motor fascicles migrate anteriorly and sensory posteriorly through the fibular tunnel, with branches leaving anteriorly and no crossover in any specimen.",
          fr:"La seule coupe du membre qu'un manuel dessine fascicule par fascicule. Les dorsifléchisseurs occupent la moitié médiale contre la fibula, les éverseurs la latérale, les sensitifs cutanés le centre et le versant latéral. Les pointillés sont ceux de Sunderland : des fascicules de destination commune échangeant des fibres, non des compartiments. Une étude ChAT/CGRP sur six jambes retrouve le même ordre en trois groupes de dehors en dedans, et ajoute que les fascicules moteurs migrent en avant et les sensitifs en arrière dans le tunnel fibulaire, les branches sortant en avant, sans croisement."}}},

    note:{en:"Proximal to the pisiform the fascicles lie in a fixed radial-to-ulnar order — volar sensory, flexor pollicis brevis, FDI and intrinsics, abductor digiti minimi, dorsal cutaneous — consistent in every specimen and independently reproduced at ten times the sample size. From the hook of the hamate the FDI branch leaves 22.8 mm radial and 32.1 mm distal, the ADM branch 7.7 mm ulnar and 5.2 mm proximal.",

  median:{ 3:{conf:"mod",
    src:{en:"Paulin et al., J Hand Surg Glob Online 2024 (narrative review, schematic figures); AIN position from Winston et al.; counts from Brill & Tyler, Muscle Nerve 2017",

    note:{en:"In the arm the motor fascicles keep a medial orientation and the sensory component stays lateral — and the recurrent thenar motor fascicle travels inside that sensory component, which is the counterintuitive part. The AIN group sits dorsocaudally in a position reported as consistent, which is what makes an isolated AIN palsy from an arm lesion anatomically possible. Counts average about 14 here, rising toward the elbow, with a standard deviation up to 10 between subjects.",
          fr:"Au bras les fascicules moteurs conservent une orientation médiale et la composante sensitive reste latérale — et le fascicule moteur thénarien récurrent chemine à l'intérieur de cette composante sensitive, ce qui est contre-intuitif. Le groupe AIN siège en dorso-caudal, position rapportée comme constante, ce qui rend possible une paralysie AIN isolée par lésion brachiale. Environ 14 fascicules ici, davantage vers le coude, avec un écart-type atteignant 10 entre sujets."}},
    10:{conf:"mod",

    note:{en:"The median is the most flattened of the three nerves at this level, in every specimen of the series that measured it. The thenar motor fascicle is drawn radial-volar, its position in 60% of 50 dissected hands; central-volar in 22%, intermediate in 18%, and in its own fascial tunnel in 56%. Fascicles destined for the hand occupy central positions with forearm-muscle fascicles peripheral — and by this level the forearm groups have all gone.",
          fr:"Le médian est le plus aplati des trois à ce niveau, dans toutes les pièces de la série qui l'a mesuré. Le fascicule moteur thénarien est dessiné radio-volaire, sa position dans 60 % de 50 mains ; centro-volaire dans 22 %, intermédiaire dans 18 %, et dans un tunnel fibreux propre dans 56 %. Les fascicules de la main occupent le centre, ceux de l'avant-bras la périphérie — et à ce niveau les groupes de l'avant-bras sont tous sortis."}}},

  radial:{ 2:{conf:"mod",

    note:{en:"The review's text is more directional than its own figures, so this follows the text: PIN fascicles and the medial-head triceps fascicle posteromedial, the lateral-head triceps fascicle anterolateral, the superficial radial sensory fascicles medial to it, ECRL, ECRB and brachioradialis through the centre. The branch to the long head of triceps is the most medial fascicle and leaves earliest. The radial nerve loses fascicles fast going distally — about 23 in the axilla falling to 3 by the forearm — so here the count itself is a localising clue.",

  sciatic:{ 2:{conf:"high",
    src:{en:"Bäumer et al., Neurology 2015 (MR neurography, 12 root lesions vs 20 controls); component areas from Fenzl & Zinnecker, Anat Anz 1987 (72 nerves); count and ellipse from an 11.4 µm microCT study, 2025 preprint (n=1)",
         fr:"Bäumer et al., Neurology 2015 (neurographie IRM, 12 atteintes radiculaires vs 20 témoins) ; surfaces d'après Fenzl & Zinnecker, Anat Anz 1987 (72 nerfs) ; décompte et forme d'après une étude microCT à 11,4 µm, prépublication 2025 (n=1)"},
    note:{en:"The best-evidenced somatotopy in the lower limb, and it is radicular rather than by branch: L5-derived fascicles anterolateral, S1-derived posteromedial, with little spatial overlap. Blinded readers classified all twelve root lesions correctly from the cross-section alone. The fibular component takes almost a third of a mean 72 mm² section. Hamstring bundles are about 13% of the tibial component, slightly anterior to the medial margin; short head of biceps about 11% of the fibular component, slightly anterior to the lateral margin. Real nerves hold about 83 fascicles here — this is a representative sample, not a count.",
          fr:"La somatotopie la mieux étayée du membre inférieur, et elle est radiculaire plutôt que par branche : fascicules issus de L5 en antéro-latéral, de S1 en postéro-médial, avec peu de recouvrement. Des lecteurs en aveugle ont classé correctement les douze atteintes sur la seule coupe. La composante fibulaire occupe près du tiers d'une section moyenne de 72 mm². Les faisceaux des ischio-jambiers font environ 13 % de la composante tibiale, un peu en avant du bord médial ; le chef court du biceps environ 11 % de la composante fibulaire, un peu en avant du bord latéral. Un nerf réel compte ici environ 83 fascicules — ceci est un échantillon représentatif."}}},

          fr:"Le résultat contre-intuitif, constant sur les dix pièces : le groupe plantaire médial est ANTÉRIEUR au groupe plantaire latéral, non médial. La coupe est elliptique et s'aplatit vers l'axe, environ 6,8 × 2,8 mm avec le tissu conjonctif. Groupe plantaire médial environ 3,6 × 2,1 mm, latéral 3,1 × 2,2 mm, calcanéen bien plus petit à 1,3 × 0,9 mm. Les deux groupes plantaires ne deviennent séparables qu'à 18,7 mm en moyenne au-dessus de l'axe, extrêmes 0 à 41 mm."}}},

    note:{en:"Not a nerve in cross-section so much as a flat ribbon: width to height 4.8 to 1 in cadavers, 7.5 to 1 in living subjects. The vasti fascicles sit centrally and usually dorsally in all four mapped specimens; saphenous, medial cutaneous and rectus femoris are always peripheral; sartorius is the least constant and was found laterally, medially or centrally. Branch order medial to lateral was consistent: pectineus, sartorius, medial cutaneous, saphenous, vastus medialis, intermedius, lateralis, rectus femoris. The rule the authors state is that fascicles leading to a distal nerve lie on the same side of the parent that the branch leaves from, and hold it from the inguinal ligament onward. Counts range 24 to 53 across four nerves.",

   key:[[0,-0.14,0.28,0.085],[4,-0.16,0.30,0.08],[5,-0.22,0.40,0.22],[7,-0.22,0.42,0.22]]},

  {id:"vi", g:"quads", lab:"VI", from:0, exit:7, trunk:[[0,"main"],[5,"post"]],
