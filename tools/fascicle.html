<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive explorer of peripheral nerve fascicular topography with named fascicle maps, lesion-pattern simulation and per-claim sourcing, upper and lower limb. Bilingual EN/FR.">
<style>
  :root{color-scheme:light dark}
  html,body{margin:0}
  body{font:14px system-ui,-apple-system,sans-serif;background:#faf9f7}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<title>Fascicle Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{
  --ground:#F2F4F3; --surface:#FFFFFF; --surface-2:#E9EDEB;
  --ink:#16211F; --ink-2:#3C4B48; --muted:#5E6B68; --faint:#8B9895;
  --rule:#D3DAD7; --rule-strong:#B9C3C0;
  --accent:#0F6B63; --accent-soft:#DCEBE8; --accent-ink:#0A4F49;
  --crit:#A3231F; --warn:#96600C; --ok:#2F6B3A;
  --crit-soft:#F6E3E2; --warn-soft:#F7EDDC; --ok-soft:#E2EFE4;
  --shadow:0 1px 2px rgba(22,33,31,.06), 0 8px 24px rgba(22,33,31,.06);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101614; --surface:#17201E; --surface-2:#1E2826;
    --ink:#E6EDEA; --ink-2:#C3CFCB; --muted:#93A29E; --faint:#6E7C79;
    --rule:#2A3634; --rule-strong:#3B4846;
    --accent:#3FB3A6; --accent-soft:#12302D; --accent-ink:#7FD3C9;
    --crit:#E4756F; --warn:#D9A452; --ok:#78BE86;
    --crit-soft:#2E1917; --warn-soft:#2C2416; --ok-soft:#16281B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#101614; --surface:#17201E; --surface-2:#1E2826;
  --ink:#E6EDEA; --ink-2:#C3CFCB; --muted:#93A29E; --faint:#6E7C79;
  --rule:#2A3634; --rule-strong:#3B4846;
  --accent:#3FB3A6; --accent-soft:#12302D; --accent-ink:#7FD3C9;
  --crit:#E4756F; --warn:#D9A452; --ok:#78BE86;
  --crit-soft:#2E1917; --warn-soft:#2C2416; --ok-soft:#16281B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
.wrap{max-width:1280px; margin:0 auto; padding-inline:20px; padding-block:24px 56px}
h1,h2,h3{text-wrap:balance; margin:0}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

.mast{display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; justify-content:space-between; padding-bottom:16px; border-bottom:1px solid var(--rule-strong)}
.mast-title h1{font-size:26px; font-weight:600; letter-spacing:-.015em}
.eyebrow{font:500 11px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:8px}
.mast-title p{margin:6px 0 0; font-family:var(--serif); color:var(--muted); max-width:64ch; font-size:15px}
.mast-tools{display:flex; gap:8px; align-items:center}
.seg{display:inline-flex; border:1px solid var(--rule-strong); border-radius:7px; overflow:hidden; background:var(--surface)}
.seg button{background:transparent; border:0; padding:7px 13px; font-size:13px; font-weight:500; color:var(--muted); border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}
.icon-btn{background:var(--surface); border:1px solid var(--rule-strong); border-radius:7px; padding:7px 11px; font-size:13px; font-weight:500; color:var(--muted)}
.icon-btn:hover{color:var(--ink); border-color:var(--accent)}

.limbs{margin-top:20px; display:flex; flex-direction:column; gap:10px}
.limb-row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.limb-lab{font:500 10px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--faint); width:86px; flex:none}
@media (max-width:620px){ .limb-lab{width:100%} }
.nerve-tab{background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:8px 14px; display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; color:var(--ink-2)}
.nerve-tab:hover{border-color:var(--rule-strong)}
.nerve-tab[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); box-shadow:inset 0 0 0 1px var(--accent)}
.nerve-tab .roots{font:400 11px/1 var(--mono); color:var(--faint)}
.nerve-tab[aria-pressed="true"] .roots{color:var(--accent-ink); opacity:.75}

.track-panel{background:var(--surface); border:1px solid var(--rule); border-radius:12px; margin-top:16px; padding:18px 22px 12px; box-shadow:var(--shadow)}
.track-head{display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:baseline; margin-bottom:16px}
.track-head .lvl-name{font-size:17px; font-weight:600}
.track-head .lvl-code{font:500 12px/1 var(--mono); color:var(--accent); letter-spacing:.06em; text-transform:uppercase}
.track-head .lvl-dist{font:400 12px/1.4 var(--mono); color:var(--muted); text-align:right; max-width:46ch}
.track{position:relative; height:70px; margin:0 8px}
.track-line{position:absolute; left:0; right:0; top:22px; height:4px; border-radius:2px; background:linear-gradient(90deg,var(--rule-strong),var(--rule))}
.track-fill{position:absolute; left:0; top:22px; height:4px; border-radius:2px; background:var(--accent)}
.tick{position:absolute; top:0; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:0; padding:0 3px}
.tick .glyph{width:13px; height:13px; margin-top:16px; border:2px solid var(--rule-strong); background:var(--surface); border-radius:50%}
.tick[data-kind="entrap"] .glyph{border-radius:2px; transform:rotate(45deg); border-color:var(--warn)}
.tick[data-kind="branch"] .glyph{border-color:var(--accent)}
.tick[data-map="1"] .glyph{border-radius:2px; border-width:3px; border-color:var(--ink-2)}
.tick[data-map="1"] .tlabel{color:var(--ink-2); font-weight:500}
.tick .tlabel{font:400 10px/1.25 var(--mono); color:var(--faint); letter-spacing:.01em}
.tick:hover .tlabel{color:var(--ink-2)}
.tick[aria-current="true"] .glyph{background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
.tick[aria-current="true"] .tlabel{color:var(--ink); font-weight:500}
input[type="range"].scrub{width:100%; margin:8px 0 0; accent-color:var(--accent); height:22px}
.track-legend{display:flex; flex-wrap:wrap; gap:16px; padding-top:8px; border-top:1px dashed var(--rule); margin-top:6px; font:400 11px/1.4 var(--mono); color:var(--faint)}
.track-legend span{display:inline-flex; align-items:center; gap:6px}
.mk{width:9px; height:9px; border:2px solid var(--accent); border-radius:50%}
.mk.ent{border-radius:1px; transform:rotate(45deg); border-color:var(--warn)}
.mk.map{border-radius:1px; border-width:3px; border-color:var(--ink-2)}

.grid{display:grid; grid-template-columns:minmax(0,1.02fr) minmax(0,1fr); gap:16px; margin-top:16px; align-items:start}
@media (max-width:900px){ .grid{grid-template-columns:1fr} }
.card{background:var(--surface); border:1px solid var(--rule); border-radius:12px; box-shadow:var(--shadow)}
.card-head{padding:14px 18px; border-bottom:1px solid var(--rule); display:flex; justify-content:space-between; align-items:center; gap:12px}
.card-head h2{font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.stage{position:relative; padding:10px 10px 0}
#body{position:absolute; left:8px; top:16px; width:108px; height:auto; pointer-events:none; overflow:visible}
#body .torso{fill:var(--rule-strong); stroke:none; opacity:.45}
#body .sil{fill:none; stroke:var(--rule-strong); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; opacity:.7}
#body .head{fill:var(--rule-strong); stroke:none; opacity:.7}
#body .nv{fill:none; stroke:var(--accent); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
#body .nv.behind{stroke-dasharray:3 2.4}
#body .dot{fill:var(--crit); stroke:var(--surface); stroke-width:1.6}
#body .halo{fill:var(--crit); opacity:.22; transform-origin:center; transform-box:fill-box; animation:bodypulse 1.8s ease-in-out infinite}
@keyframes bodypulse{ 0%,100%{transform:scale(1); opacity:.22} 50%{transform:scale(1.5); opacity:.08} }
@media (prefers-reduced-motion:reduce){ #body .halo{animation:none} }
@media (max-width:520px){ #body{width:64px} }
canvas#section{width:100%; height:auto; display:block; touch-action:none}
.stage-note{font:400 11px/1.5 var(--mono); color:var(--faint); padding:2px 8px 12px; text-align:center}
.legend{display:flex; flex-direction:column; gap:2px; padding:4px 12px 14px}
.legend-row{display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:6px; background:none; border:0; width:100%; text-align:left; font-size:13.5px}
.legend-row:hover{background:var(--surface-2)}
.legend-row[aria-pressed="true"]{background:var(--accent-soft)}
.legend-row.gone{opacity:.45}
.swatch{width:12px; height:12px; border-radius:3px; flex:none; border:1.5px solid rgba(0,0,0,.25)}
.legend-row .lname{font-weight:500; flex:1; min-width:0}
.legend-row .lmeta{font:400 11px/1 var(--mono); color:var(--faint); flex:none}
.kind-tag{font:400 9.5px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; padding:3px 5px; border-radius:3px; flex:none}
.kind-m{background:var(--warn-soft); color:var(--warn)}
.kind-s{background:var(--accent-soft); color:var(--accent-ink)}
.kind-x{background:var(--surface-2); color:var(--muted)}

.panel-body{padding:18px; display:flex; flex-direction:column; gap:18px}
.sect h3{font:600 11px/1 var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:9px}
.prose{font-family:var(--serif); font-size:15px; line-height:1.62; color:var(--ink-2)}
.prose em{color:var(--muted)}
blockquote.bq{margin:10px 0 0; padding:10px 0 10px 14px; border-left:2px solid var(--accent); font-family:var(--serif); font-style:italic; color:var(--ink-2); font-size:14.5px; line-height:1.55}
blockquote.bq cite{display:block; margin-top:6px; font:400 11px/1.4 var(--mono); font-style:normal; color:var(--faint)}
ol.chain{margin:0; padding-left:0; list-style:none; counter-reset:c; display:flex; flex-direction:column; gap:0}
ol.chain li{counter-increment:c; display:grid; grid-template-columns:22px 1fr; gap:10px; padding:7px 0; border-top:1px solid var(--rule); font-size:13.5px; color:var(--ink-2)}
ol.chain li:first-child{border-top:0}
ol.chain li::before{content:counter(c); font:500 10px/22px var(--mono); color:var(--accent); background:var(--accent-soft); border-radius:4px; text-align:center; height:22px}
.pillrow{display:flex; flex-wrap:wrap; gap:6px}
.pill{font:400 12px/1 var(--mono); padding:6px 9px; border-radius:5px; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--rule)}
.pill.gone{color:var(--faint); text-decoration:line-through; text-decoration-color:var(--rule-strong)}
.status{display:flex; gap:10px; padding:11px 13px; border-radius:8px; font-size:13.5px; line-height:1.5}
.status .s-lab{font:500 10px/1.5 var(--mono); letter-spacing:.08em; text-transform:uppercase; flex:none}
.status.crit{background:var(--crit-soft); color:var(--crit)}
.status.ok{background:var(--ok-soft); color:var(--ok)}
.rule{height:1px; background:var(--rule)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13.5px}
.kv dt{font:400 12px/1.55 var(--mono); color:var(--faint)}
.kv dd{margin:0; color:var(--ink-2)}
.ev-item{display:grid; grid-template-columns:auto 1fr; gap:10px 12px; padding:12px 0; border-top:1px solid var(--rule)}
.ev-item:first-of-type{border-top:0}
.conf{font:500 9.5px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; padding:4px 6px; border-radius:3px; height:fit-content; white-space:nowrap}
.conf.high{background:var(--ok-soft); color:var(--ok)}
.conf.mod{background:var(--warn-soft); color:var(--warn)}
.conf.low{background:var(--surface-2); color:var(--muted)}
.ev-claim{font-size:14px; color:var(--ink-2); line-height:1.5}
.ev-src{font:400 11.5px/1.5 var(--mono); color:var(--faint); margin-top:3px}
details.disclose{margin-top:16px; border:1px solid var(--rule); border-radius:10px; background:var(--surface)}
details.disclose>summary{padding:13px 18px; cursor:pointer; font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); list-style:none}
details.disclose>summary::-webkit-details-marker{display:none}
details.disclose>summary::after{content:"+"; float:right; font-family:var(--mono); color:var(--faint)}
details.disclose[open]>summary::after{content:"\2212"}
details.disclose .dbody{padding:0 18px 18px}
footer.foot{margin-top:24px; padding-top:18px; border-top:1px solid var(--rule); font-family:var(--serif); font-size:13.5px; line-height:1.6; color:var(--muted); max-width:80ch}
footer.foot strong{color:var(--ink-2); font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

<div class="wrap">
  <header class="mast">
    <div class="mast-title">
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
      <p data-i18n="standfirst"></p>
    </div>
    <div class="mast-tools">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="lang-en" data-lang="en">EN</button>
        <button type="button" id="lang-fr" data-lang="fr">FR</button>
      </div>
      <button type="button" class="icon-btn" id="theme-btn" aria-label="Theme">&#9686;</button>
    </div>
  </header>

  <nav class="limbs" id="limbs" aria-label="Nerve"></nav>

  <section class="track-panel">
    <div class="track-head">
      <div>
        <div class="lvl-code" id="lvl-code"></div>
        <div class="lvl-name" id="lvl-name"></div>
      </div>
      <div class="lvl-dist" id="lvl-dist"></div>
    </div>
    <div class="track" id="track">
      <div class="track-line"></div>
      <div class="track-fill" id="track-fill"></div>
    </div>
    <input type="range" class="scrub" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Level along nerve">
    <div class="track-legend">
      <span><i class="mk"></i> <span data-i18n="legBranch"></span></span>
      <span><i class="mk ent"></i> <span data-i18n="legEntrap"></span></span>
      <span><i class="mk map"></i> <span data-i18n="legMap"></span></span>
      <span data-i18n="legDrag"></span>
    </div>
  </section>

  <div class="grid">
    <section class="card">
      <div class="card-head">
        <h2 data-i18n="sectionHead"></h2>
        <div class="seg" role="group" aria-label="Mode">
          <button type="button" id="mode-explore" data-mode="explore"></button>
          <button type="button" id="mode-lesion" data-mode="lesion"></button>
        </div>
      </div>
      <div class="stage"><canvas id="section" width="720" height="560"></canvas>
        <svg id="body" viewBox="0 0 100 222" aria-hidden="true">
          <circle class="head" cx="50" cy="14" r="9"/>
          <path class="torso" d="M38 30 Q50 25 62 30 L65 70 Q65 106 60 108 L40 108 Q35 106 35 70 Z"/>
          <path class="sil" d="M35 33 L25 72 L19 112 L17 124 M65 33 L75 72 L81 112 L83 124 M43 108 L41 160 L39 206 L32 210 M57 108 L59 160 L61 206 L68 210"/>
          <path class="nv" id="body-path" d=""/>
          <path class="nv behind" id="body-path-behind" d=""/>
          <circle class="halo" id="body-halo" cx="0" cy="0" r="7"/>
          <circle class="dot" id="body-dot" cx="0" cy="0" r="4"/>
        </svg></div>
      <div class="stage-note" id="stage-note"></div>
      <div class="legend" id="legend"></div>
    </section>
    <section class="card">
      <div class="card-head"><h2 id="panel-head"></h2></div>
      <div class="panel-body" id="panel"></div>
    </section>
  </div>

  <details class="disclose" id="ev-disclose">
    <summary data-i18n="evHead"></summary>
    <div class="dbody"><div id="evidence"></div></div>
  </details>

  <footer class="foot" id="foot"></footer>
</div>

<script>
"use strict";
/* ============================================================
   i18n
   ============================================================ */
const UI = {
  eyebrow:{en:"Internal topography of the peripheral nerves",fr:"Topographie interne des nerfs périphériques"},

  standfirst:{
    en:"Drag along a nerve to watch its fascicular groups sort, migrate and leave the trunk. Then place a lesion and read the pattern it should produce — including what gets spared, and why. Anatomy and lesion patterns follow Preston & Shapiro.",

  modeExplore:{en:"Explore",fr:"Explorer"},

  supplies:{en:"Supplies",fr:"Innerve"},
  exitsAt:{en:"Leaves at",fr:"Sort au niveau"},
  travelsIn:{en:"Travels in",fr:"Chemine dans"},
  fascicleMap:{en:"Sourced cross-section",fr:"Coupe sourcée"},
  mapSource:{en:"Source",fr:"Source"},
  mapCount:{en:"Fascicles here",fr:"Fascicules ici"},
  legMap:{en:"sourced cross-section",fr:"coupe sourcée"},

  expectDeficit:{en:"Expected deficit",fr:"Déficit attendu"},
  expectSpared:{en:"Expected to be spared",fr:"Attendu épargné"},
  expectEdx:{en:"Electrodiagnostic correlate",fr:"Corrélat électrodiagnostique"},
  pickSite:{en:"Lesion patterns described at this level",fr:"Tableaux lésionnels décrits à ce niveau"},
  motor:{en:"motor",fr:"moteur"},
  sensory:{en:"sensory",fr:"sensitif"},
  mixed:{en:"mixed",fr:"mixte"},
  evHead:{en:"Evidence and confidence",fr:"Sources et niveau de preuve"},
  confHigh:{en:"from the book",fr:"tiré du livre"},
  confMod:{en:"generalisation",fr:"généralisation"},
  confLow:{en:"schematic",fr:"schématique"},
  noLesion:{en:"No named entrapment site at this level. Drag to a diamond marker, or read the section as anatomy.",fr:"Aucun site de compression identifié à ce niveau. Déplacez-vous vers un losange, ou lisez la coupe comme anatomie."},
  pickFascicle:{en:"Click a fascicular group in the section or the legend to follow it.",fr:"Cliquez un groupe fasciculaire dans la coupe ou la légende pour le suivre."},
  volar:{en:"VOLAR",fr:"VOLAIRE"}, dorsal:{en:"DORSAL",fr:"DORSAL"},
  radial:{en:"RADIAL",fr:"RADIAL"}, ulnar:{en:"ULNAR",fr:"ULNAIRE"},
  ant:{en:"ANTERIOR",fr:"ANTÉRIEUR"}, post:{en:"POSTERIOR",fr:"POSTÉRIEUR"},
  lat:{en:"LATERAL",fr:"LATÉRAL"}, med:{en:"MEDIAL",fr:"MÉDIAL"},

      deficit:{en:"Volar forearm pain and median paresthesias, made worse by supinating the forearm and extending the elbow. Weakness across the whole median territory including pronator teres, with sensory loss that includes the thenar eminence.",fr:"Douleur volaire de l'avant-bras et paresthésies médianes, aggravées par la supination et l'extension du coude. Faiblesse de tout le territoire médian, rond pronateur inclus, avec hypoesthésie incluant l'éminence thénar."},
      spared:{en:"Nothing median. The radial pulse may attenuate with the provocative manoeuvre, because the brachial artery passes under the ligament with the nerve — a useful bedside tell.",fr:"Rien en territoire médian. Le pouls radial peut s'atténuer lors de la manœuvre, l'artère brachiale passant sous le ligament avec le nerf — signe utile au lit du malade."},
      edx:{en:"Abnormalities in all median muscles including the pronator teres. Stimulate at the axilla as well as the antecubital fossa. The spur is visible on a plain bone film.",fr:"Anomalies dans tous les muscles médians, rond pronateur inclus. Stimuler à l'aisselle en plus du pli du coude. L'éperon est visible sur une radiographie osseuse simple."},
      why:{en:"An unyielding fibro-osseous roof compressing the whole trunk against bone. Nothing is selective here because no sorting advantage exists yet.",fr:"Un toit fibro-osseux inextensible comprimant tout le tronc contre l'os. Rien n'est sélectif ici, aucun avantage de tri n'existant encore."}},
    ain_constriction:{ name:{en:"Fascicular constriction of the AIN group",fr:"Constriction fasciculaire du groupe AIN"}, hit:["ain"],
      deficit:{en:"Weak flexion of the thumb IP and index DIP — the OK sign collapses, with compensatory hyperextension at both joints. Pronator quadratus weak on resisted pronation with the elbow flexed. No sensory loss at all.",fr:"Faiblesse de la flexion IP du pouce et DIP de l'index — le signe du OK s'effondre, avec hyperextension compensatrice des deux articulations. Carré pronateur faible en pronation contrariée coude fléchi. Aucun déficit sensitif."},
      spared:{en:"Everything else in the median trunk, and the pronator teres in particular — with the elbow extended the PT is the primary pronator and it is not involved, which is why pronation must be tested with the elbow flexed.",fr:"Tout le reste du tronc médian, et le rond pronateur en particulier — coude en extension le RP est le pronateur principal et il n'est pas atteint, d'où la nécessité de tester la pronation coude fléchi."},
      edx:{en:"Denervation confined to FPL, FDP II–III and pronator quadratus, with normal median conduction to the hand. The FDP slip to digits 2–3 is deep and hard to localise; the pronator quadratus sits beneath the thumb and index extensors.",fr:"Dénervation limitée au LFP, FPD II–III et carré pronateur, conductions médianes normales à la main. Le faisceau du FPD 2–3 est profond et difficile à localiser ; le carré pronateur siège sous les extenseurs du pouce et de l'index."},
      why:{en:"Usually torsion of a fascicle that already runs as a discrete bundle, not compression. Discreteness is the prerequisite — a group that has not yet sorted out cannot be picked off alone.",fr:"Le plus souvent une torsion d'un fascicule déjà individualisé, non une compression. L'individualisation est la condition — un groupe non encore trié ne peut être atteint seul."}},
    lacertus:{ name:{en:"Lacertus fibrosus",fr:"Lacertus fibrosus"}, hit:["pt","ain","thenar","lumb","pcb","digital"],
      deficit:{en:"One of the three sites grouped clinically as pronator syndrome. Forearm pain reproduced by resisted elbow flexion with the forearm supinated, with mild median weakness and subtle sensory blunting.",fr:"L'un des trois sites regroupés cliniquement sous le terme de syndrome du rond pronateur. Douleur de l'avant-bras reproduite par la flexion contrariée du coude avant-bras en supination, avec faiblesse médiane discrète et hypoesthésie subtile."},
      spared:{en:"Usually everything measurable — significant weakness or wasting is rare at any of the pronator-syndrome sites.",fr:"En général tout ce qui est mesurable — une faiblesse ou une amyotrophie significative est rare à ces sites."},
      edx:{en:"Frequently normal. The book warns that increased pain on the provocative manoeuvre is unreliable unless accompanied by median paresthesias.",fr:"Souvent normal. Le livre prévient qu'une majoration de la douleur à la manœuvre n'est fiable que si elle s'accompagne de paresthésies médianes."},
      why:{en:"A superficial fibrous band. Which fascicles it loads depends on posture more than on topography, which is part of why the syndrome is so inconsistent.",fr:"Une bande fibreuse superficielle. Les fascicules sollicités dépendent plus de la posture que de la topographie, ce qui explique en partie l'inconstance du syndrome."}},
    pronator:{ name:{en:"Pronator teres syndrome",fr:"Syndrome du rond pronateur"}, hit:["ain","thenar","lumb","pcb","digital"],
      deficit:{en:"Forearm pain aggravated by repeated pronation and supination, reproduced by resisted pronation with the elbow extended. Mild weakness of FPL and APB is the commonest finding, occasionally FDP II–III and opponens.",fr:"Douleur de l'avant-bras aggravée par les pronosupinations répétées, reproduite par la pronation contrariée coude en extension. Une faiblesse discrète du LFP et du CAP est la plus fréquente, parfois FPD II–III et opposant."},
      spared:{en:"The pronator teres itself is usually spared, because the compression site lies distal to its innervation. Note this is the opposite of the ulnar FCU story, where the equivalent explanation does not hold.",fr:"Le rond pronateur lui-même est en général épargné, le site de compression étant distal à son innervation. À noter : c'est l'inverse de l'histoire du FUC ulnaire, où l'explication équivalente ne tient pas."},
      edx:{en:"Abnormalities reported most often in FPL and FDP II–III, less often FDS and APB, and only rarely the pronator teres. Exclude carpal tunnel first with median and ulnar palm-to-wrist mixed studies over identical 8 cm distances.",fr:"Anomalies surtout au LFP et au FPD II–III, moins souvent FSD et CAP, et rarement le rond pronateur. Éliminer d'abord un canal carpien par des études mixtes paume-poignet médiane et ulnaire sur des distances identiques de 8 cm."},
      why:{en:"Thenar sensory loss is the discriminator against carpal tunnel syndrome: any lesion proximal to the wrist takes the palmar cutaneous branch with it.",fr:"L'hypoesthésie thénarienne est le discriminant face au canal carpien : toute lésion proximale au poignet emporte la branche cutanée palmaire."}},
    sublimis:{ name:{en:"Sublimis bridge (FDS arch)",fr:"Arcade du fléchisseur superficiel"}, hit:["ain","thenar","lumb","pcb","digital"],

      spared:{en:"Pronator teres, FCR and palmaris longus — their branches have all left proximally.",fr:"Rond pronateur, FRC et long palmaire — leurs branches sont toutes sorties en amont."},
      edx:{en:"As for pronator syndrome. An isolated AIN pattern arising here is clinically indistinguishable from the upper-arm fascicular lesion; imaging separates them, electrophysiology does not.",fr:"Comme pour le syndrome du rond pronateur. Un tableau AIN isolé né ici est cliniquement indiscernable de la lésion fasciculaire brachiale ; c'est l'imagerie qui les sépare, non l'électrophysiologie."},
      why:{en:"A true compression under a fibrous arch, versus torsion proximally. Same syndrome, two mechanisms, different management.",fr:"Vraie compression sous une arcade fibreuse, versus torsion en amont. Même syndrome, deux mécanismes, prise en charge différente."}},
    carpal:{ name:{en:"Carpal tunnel",fr:"Canal carpien"}, hit:["thenar","lumb","digital"],
      deficit:{en:"Numbness of thumb, index, middle and lateral ring; thenar weakness and wasting when advanced. Routine studies are normal in 10–25% of patients — comparison studies lift the yield from about 75% to about 95%.",fr:"Hypoesthésie pouce, index, médius, hémi-annulaire latéral ; faiblesse et amyotrophie thénariennes si évolué. Les études de routine sont normales chez 10–25 % des patients — les études comparatives font passer le rendement d'environ 75 % à environ 95 %."},
      spared:{en:"Sensation over the thenar eminence, because the palmar cutaneous branch left proximal to the tunnel. All forearm median muscles, including FPL and pronator quadratus.",fr:"La sensibilité de l'éminence thénar, la branche cutanée palmaire étant sortie en amont du canal. Tous les muscles médians de l'avant-bras, LFP et carré pronateur inclus."},
      edx:{en:"Palmar mixed at 8 cm (≥0.4 ms), digit 4 median vs ulnar (≥0.5 ms), second lumbrical vs interossei (≥0.5 ms), median vs radial to digit 1 (≥0.5 ms). Two of three abnormal in 97% of mild cases; be hesitant to diagnose on a single abnormal comparison. Prolonged median F waves are expected — the F response traverses the tunnel twice.",fr:"Mixte palmaire à 8 cm (≥0,4 ms), doigt 4 médian vs ulnaire (≥0,5 ms), 2e lombrical vs interosseux (≥0,5 ms), médian vs radial au doigt 1 (≥0,5 ms). Deux sur trois anormales chez 97 % des formes légères ; rester prudent devant une seule comparaison anormale. Des ondes F médianes allongées sont attendues — l'onde F traverse le canal deux fois."},
      why:{en:"The largest, fastest fibres are the most prone to compression, so Ia afferents and large sensory fibres block first. After release, latencies improve but the sensitive comparison studies stay abnormal indefinitely: remyelinated internodes are short, so more nodes means permanently slower conduction across the segment.",fr:"Les fibres les plus grosses et rapides sont les plus sensibles à la compression : les afférences Ia et les grosses fibres sensitives bloquent en premier. Après libération, les latences s'améliorent mais les comparaisons sensibles restent anormales indéfiniment : les internœuds remyélinisés sont courts, donc plus de nœuds, donc une conduction définitivement plus lente sur le segment."}}
