    {conf:"high", claim:{en:"Thenar motor branch position at the carpal tunnel: radial–volar 60%, central–volar 22%, intermediate 18% of 50 hands; separate fascial tunnel in 56%.",fr:"Position de la branche motrice thénarienne au canal carpien : radio-volaire 60 %, centro-volaire 22 %, intermédiaire 18 % sur 50 mains ; tunnel fibreux propre dans 56 %."},
      src:"Mackinnon SE, Dellon AL. Ann Plast Surg 1988;21(1):32–5"},
    {conf:"high", claim:{en:"AIN-destined fascicles occupy the posteromedial median trunk in the distal upper arm and the posterior trunk at the elbow, emerging 3.0–5.2 cm distal to the intercondylar axis; reported constrictions average 4.7 cm proximal to the elbow.",fr:"Les fascicules destinés à l'AIN occupent la partie postéro-médiale du tronc au bras distal et postérieure au coude, émergeant 3,0–5,2 cm sous l'axe intercondylien ; constrictions à 4,7 cm en moyenne au-dessus du coude."},
      src:"Korean J Radiol 2024; Yonsei Med J 2020;61(6):547"},
    {conf:"mod", claim:{en:"Chapters 17 and 18 contain no explicit intraneural fascicular-topography statement for the median nerve. Positions of the flexor–pronator, lumbrical and digital groups here are reasoned composites.",fr:"Les chapitres 17 et 18 ne contiennent aucun énoncé explicite de topographie fasciculaire intraneurale pour le médian. Les positions des groupes fléchisseur–pronateur, lombrical et digital sont ici des composites raisonnés."},
      src:"Preston & Shapiro, Ch 17–18; Sunderland 1978"}
  ]
},

ulnar:{
  name:{en:"Ulnar",fr:"Ulnaire"}, roots:"C8–T1", limb:"upper", axes:"arm",
  blurb:{en:"The nerve with the richest selective-fascicle story, and the one where the classic teaching is wrong. The book states plainly that FCU sparing is not explained by the branch arising above the groove — cadaver studies found otherwise.",
         fr:"Le nerf à l'histoire fasciculaire la plus riche, et celui où l'enseignement classique est faux. Le livre dit clairement que l'épargne du FUC ne s'explique pas par une naissance de la branche au-dessus de la gouttière — les études cadavériques disent le contraire."},
  trunks:[
    {id:"main", label:{en:"Ulnar nerve",fr:"Nerf ulnaire"}, until:11, key:[[0,0,0,1],[1,0,0,1],[2,-0.26,-0.10,0.68],[11,-0.26,-0.10,0.68]]},
    {id:"duc", label:{en:"Dorsal cutaneous",fr:"Cutanée dorsale"}, from:2, until:8.7, key:[[2,0.58,0.44,0.22],[8,0.60,0.46,0.22]]},
    {id:"deep", label:{en:"Deep palmar motor",fr:"Motrice palmaire profonde"}, from:11, key:[[11,-0.02,0.44,0.48],[13,-0.02,0.46,0.46]]},
    {id:"sup", label:{en:"Superficial branch",fr:"Branche superficielle"}, from:11, key:[[11,0.02,-0.48,0.44],[13,0.02,-0.50,0.42]]}
  ],
  levels:[
    {code:"L0", name:{en:"Medial cord",fr:"Faisceau médial"}, dist:{en:"C8–T1, sometimes a minor C7 component",fr:"C8–T1, parfois une composante mineure C7"}, kind:"plain"},
    {code:"L1", name:{en:"Medial arm",fr:"Bras, versant médial"}, dist:{en:"No muscular branches anywhere in the arm",fr:"Aucune branche musculaire au bras"}, kind:"plain"},
    {code:"L2", name:{en:"Arcade of Struthers",fr:"Arcade de Struthers"}, dist:{en:"Deep fascia, medial triceps fibres and the internal brachial ligament, after the nerve pierces the medial intermuscular septum",fr:"Fascia profond, fibres du chef médial du triceps et ligament brachial interne, après traversée du septum intermusculaire médial"}, kind:"entrap", sites:["arcade"]},
    {code:"L3", name:{en:"Ulnar groove",fr:"Gouttière épitrochléo-olécrânienne"}, dist:{en:"Between medial epicondyle and olecranon; subcutaneous against bone",fr:"Entre épitrochlée et olécrâne ; sous-cutané contre l'os"}, kind:"entrap", sites:["groove"]},
    {code:"L4", name:{en:"Cubital tunnel",fr:"Tunnel cubital"}, dist:{en:"Humero-ulnar aponeurosis, 3–20 mm distal to the medial epicondyle in cadaver series",fr:"Aponévrose huméro-ulnaire, 3–20 mm sous l'épitrochlée en séries cadavériques"}, kind:"entrap", sites:["cubital"]},
    {code:"L5", name:{en:"Cubital tunnel exit",fr:"Sortie du tunnel cubital"}, dist:{en:"Deep fascia between FCU and FDP, 3–7 cm distal to the groove",fr:"Fascia profond entre FUC et FPD, 3–7 cm sous la gouttière"}, kind:"entrap", sites:["exit"]},
    {code:"L6", name:{en:"FCU and FDP branches",fr:"Branches du FUC et du FPD"}, dist:{en:"Arise distal to the cubital tunnel in 93–95% of cadaver dissections",fr:"Naissent en aval du tunnel cubital dans 93–95 % des dissections"}, kind:"branch"},
    {code:"L7", name:{en:"Mid forearm",fr:"Avant-bras moyen"}, dist:{en:"No further muscular branches until the wrist",fr:"Plus aucune branche musculaire avant le poignet"}, kind:"plain"},
    {code:"L8", name:{en:"Dorsal cutaneous take-off",fr:"Naissance de la cutanée dorsale"}, dist:{en:"5–8 cm proximal to the wrist",fr:"5–8 cm au-dessus du poignet"}, kind:"branch"},
    {code:"L9", name:{en:"Palmar cutaneous take-off",fr:"Naissance de la cutanée palmaire"}, dist:{en:"At the level of the ulnar styloid, 1–2 cm proximal to the wrist",fr:"Au niveau du styloïde ulnaire, 1–2 cm au-dessus du poignet"}, kind:"branch"},
    {code:"L10", name:{en:"Guyon's canal — proximal",fr:"Canal de Guyon — proximal"}, dist:{en:"Enters at the distal wrist crease; pisiform proximally, hook of hamate distally",fr:"Entrée au pli de flexion distal ; pisiforme en amont, hamulus en aval"}, kind:"entrap", sites:["guyon_proximal"]},
    {code:"L11", name:{en:"Pisohamate hiatus",fr:"Hiatus piso-hamatien"}, dist:{en:"Deep and superficial branches separate; hypothenar branches have already left",fr:"Séparation des branches profonde et superficielle ; les branches hypothénariennes sont déjà sorties"}, kind:"entrap", sites:["guyon_deep_prox","guyon_superficial"]},
    {code:"L12", name:{en:"Deep palmar motor course",fr:"Trajet moteur palmaire profond"}, dist:{en:"Runs across the palm to the thenar eminence",fr:"Traverse la paume jusqu'à l'éminence thénar"}, kind:"entrap", sites:["guyon_deep_dist"]},
    {code:"L13", name:{en:"Adductor pollicis and deep FPB",fr:"Adducteur du pouce et CFP profond"}, dist:{en:"The far end of the deep branch, in the thenar eminence — which is why both eminences waste",fr:"L'extrémité de la branche profonde, dans l'éminence thénar — d'où l'amyotrophie des deux éminences"}, kind:"branch"}
  ],
  groups:[
    { id:"fcu", abbr:{en:"FCU / FDP",fr:"FUC / FPD"}, kind:"m", color:C.m1, from:0, exit:6,
      label:{en:"FCU and ulnar FDP",fr:"FUC et FPD ulnaire"},
      supplies:{en:"Flexor carpi ulnaris; flexor digitorum profundus to the ring and little fingers",fr:"Fléchisseur ulnaire du carpe ; fléchisseur profond des doigts, annulaire et auriculaire"},
      note:{en:"The FCU is normal or minimally affected in many surgically proven ulnar neuropathies at the elbow. The book explicitly rejects the classic explanation — cadaver studies found the FCU branch does not arise proximal to the groove; it arises distal to the cubital tunnel in 93–95% of dissections. The sparing is instead attributed to differential fascicular susceptibility, or to dying-back. The pattern of an abnormal FDI and abnormal FDP 4/5 with a spared FCU is one to recognise.",
            fr:"Le FUC est normal ou peu atteint dans de nombreuses neuropathies ulnaires du coude prouvées chirurgicalement. Le livre rejette explicitement l'explication classique — les études cadavériques montrent que la branche du FUC ne naît pas en amont de la gouttière ; elle naît en aval du tunnel cubital dans 93–95 % des dissections. L'épargne est attribuée à une susceptibilité fasciculaire différentielle, ou au phénomène de dying-back. Le tableau PID anormal et FPD 4/5 anormal avec FUC épargné est à reconnaître."},
      quote:{text:{en:"Although sparing of the FCU was classically thought to be due to the muscular branch to the FCU arising proximal to the groove, cadaver anatomic studies have found this not to be the case.",fr:"Bien que l'épargne du FUC ait classiquement été attribuée à une naissance de sa branche en amont de la gouttière, les études anatomiques cadavériques ont montré qu'il n'en est rien."}, src:"Preston & Shapiro, Ch 19"},
      key:[[0,-0.20,0.30,0.26],[3,-0.38,0.42,0.25],[6,-0.44,0.46,0.22]]},
    { id:"duc", abbr:{en:"DUC",fr:"BCD"}, kind:"s", color:C.s2, from:0, exit:8,
      trunk:[[0,"main"],[2,"duc"]],
      label:{en:"Dorsal ulnar cutaneous",fr:"Branche cutanée dorsale ulnaire"},
      supplies:{en:"Dorsal medial hand, dorsal fifth and medial fourth digits",fr:"Dos de la main en médial, dos du cinquième et hémi-quatrième doigts"},
      note:{en:"The book describes this fascicle separating from the main trunk above the elbow and travelling, in effect, as a separate nerve alongside the ulnar nerve in the forearm — which is why it can be paradoxically spared at the elbow. The asymmetry of the rule matters: an abnormal DUC response places the lesion proximal to the wrist, but a normal one does not exclude an elbow lesion.",
            fr:"Le livre décrit ce fascicule se séparant du tronc au-dessus du coude et cheminant, de fait, comme un nerf distinct à côté de l'ulnaire à l'avant-bras — d'où son épargne paradoxale possible au coude. L'asymétrie de la règle compte : une réponse DUC anormale place la lésion en amont du poignet, mais une réponse normale n'exclut pas une atteinte du coude."},
      quote:{text:{en:"effectively travels as a separate nerve next to the ulnar nerve in the forearm",fr:"chemine de fait comme un nerf distinct à côté du nerf ulnaire à l'avant-bras"}, src:"Preston & Shapiro, Ch 19"},
      key:[[0,-0.10,0.42,0.19],[2,0.00,0.00,0.64],[8,0.00,0.00,0.70],[10,0.00,0.00,0.70]]},
    { id:"puc", abbr:{en:"PUC",fr:"BCP"}, kind:"s", color:C.s3, from:0, exit:9,
      label:{en:"Palmar ulnar cutaneous",fr:"Branche cutanée palmaire ulnaire"},
      supplies:{en:"Proximal medial palm",fr:"Paume, partie proximale médiale"},
      note:{en:"Arises at the ulnar styloid, so it too lies outside Guyon's canal. Together with the dorsal branch it means sensory loss confined to the volar digits, sparing both the dorsal hand and the proximal palm, localises to the wrist.",
            fr:"Naît au styloïde ulnaire, donc également hors du canal de Guyon. Avec la branche dorsale, cela signifie qu'un déficit sensitif limité aux doigts palmaires, épargnant le dos de la main et la paume proximale, localise au poignet."},
      key:[[0,0.20,0.22,0.15],[6,0.34,0.18,0.15],[9,0.48,0.10,0.14]]},
    { id:"hypo", abbr:{en:"Hypothenar",fr:"Hypothénar"}, kind:"m", color:C.m6, from:0, exit:11,
      trunk:[[0,"main"],[11,"deep"]],
      label:{en:"Hypothenar motor",fr:"Moteur hypothénarien"},
      supplies:{en:"Abductor digiti minimi, flexor digiti minimi, opponens digiti minimi",fr:"Abducteur, court fléchisseur et opposant du petit doigt"},
      note:{en:"These three leave the deep branch before it passes through the pisohamate hiatus. That single fact generates two of the four lesion patterns at the wrist: a lesion distal to the hiatus spares them, a lesion proximal to it does not. The fourth hypothenar muscle, palmaris brevis, belongs to the superficial branch instead.",
            fr:"Ces trois muscles quittent la branche profonde avant son passage dans le hiatus piso-hamatien. Ce seul fait engendre deux des quatre tableaux lésionnels au poignet : une lésion en aval du hiatus les épargne, une lésion en amont non. Le quatrième muscle hypothénarien, le court palmaire, dépend de la branche superficielle."},
      key:[[0,0.30,-0.20,0.22],[6,0.12,-0.28,0.23],[10,-0.16,-0.30,0.24],[11,-0.30,-0.34,0.23]]},
    { id:"deep", abbr:{en:"Deep motor",fr:"Mot. profonde"}, kind:"m", color:C.m3, from:0, exit:13,
      trunk:[[0,"main"],[11,"deep"]],
      label:{en:"Deep palmar motor branch",fr:"Branche motrice palmaire profonde"},
      supplies:{en:"After the hiatus: third and fourth lumbricals, all interossei, adductor pollicis, deep head of flexor pollicis brevis",fr:"Après le hiatus : 3e et 4e lombricaux, tous les interosseux, adducteur du pouce, chef profond du court fléchisseur du pouce"},
      sub:{en:["Third and fourth lumbricals","Four dorsal and three palmar interossei","Adductor pollicis","Deep head of flexor pollicis brevis"],
           fr:["3e et 4e lombricaux","Quatre interosseux dorsaux et trois palmaires","Adducteur du pouce","Chef profond du court fléchisseur du pouce"]},
      note:{en:"The fibres to first dorsal interosseous run in the fascicle closest to the site of compression at the elbow, which is why recording FDI has a higher yield than ADM. FDI can show conduction block across the elbow while ADM shows only axon loss — two pathophysiologies in one nerve at one level. Because adductor pollicis and the deep head of FPB sit in the thenar eminence, both eminences can waste.",
            fr:"Les fibres du premier interosseux dorsal cheminent dans le fascicule le plus proche du site de compression au coude, d'où un meilleur rendement en enregistrant le PID plutôt que l'ADM. Le PID peut montrer un bloc de conduction au coude alors que l'ADM ne montre qu'une perte axonale — deux physiopathologies dans un même nerf au même niveau. L'adducteur du pouce et le chef profond du CFP siégeant dans l'éminence thénar, les deux éminences peuvent s'amyotrophier."},
      quote:{text:{en:"External compression may preferentially affect the fibers within the fascicle nearest to the compression",fr:"Une compression externe peut atteindre préférentiellement les fibres du fascicule le plus proche de la compression"}, src:"Preston & Shapiro, Ch 19"},
      key:[[0,0.28,-0.24,0.28],[3,0.16,-0.32,0.31],[7,-0.02,-0.30,0.34],[10,-0.22,-0.22,0.36],[11,0.00,0.00,0.66],[13,0.00,0.00,0.68]]},
    { id:"sup", abbr:{en:"Superficial",fr:"Superficielle"}, kind:"x", color:C.s1, from:0, exit:13,
      trunk:[[0,"main"],[11,"sup"]],
      label:{en:"Superficial terminal branch",fr:"Branche terminale superficielle"},
      supplies:{en:"Volar fifth and medial fourth digits — and one muscle, the palmaris brevis",fr:"Cinquième et hémi-quatrième doigts en palmaire — et un muscle, le court palmaire"},
      note:{en:"Usually called the sensory branch, but it supplies palmaris brevis. That gives the palmaris brevis sign: in the common deep-branch lesions the muscle is spared while everything around it wastes, so forced abduction of the little finger produces prominent puckering of the skin along the proximal medial border of the hand.",
            fr:"Souvent appelée branche sensitive, elle innerve pourtant le court palmaire. D'où le signe du court palmaire : dans les lésions courantes de la branche profonde, le muscle est épargné alors que tout autour s'amyotrophie, si bien que l'abduction forcée de l'auriculaire produit un plissement marqué de la peau au bord médial proximal de la main."},
      key:[[0,-0.02,-0.02,0.28],[6,0.24,0.08,0.30],[10,0.34,0.24,0.34],[11,0.00,0.00,0.64],[13,0.00,0.00,0.62]]}
  ],
  sites:{
    arcade:{ name:{en:"Arcade of Struthers",fr:"Arcade de Struthers"}, hit:["fcu","duc","puc","hypo","deep","sup"],
      deficit:{en:"Whole ulnar territory including FCU and FDP. Reported but infrequent.",fr:"Tout le territoire ulnaire, FUC et FPD inclus. Rapportée mais peu fréquente."},
      spared:{en:"Medial forearm sensation — the medial antebrachial cutaneous nerve arises directly from the medial cord, so medial forearm involvement implies a higher lesion still.",fr:"La sensibilité médiale de l'avant-bras — le nerf cutané médial de l'avant-bras naît directement du faisceau médial, si bien qu'une atteinte de l'avant-bras médial implique une lésion encore plus haute."},
      edx:{en:"Slowing in the above-elbow segment. Easily missed by a standard below-/above-elbow protocol; inching or a long above-elbow segment is needed. Since no ulnar muscle exists above the elbow, a non-localising study can conclude only an ulnar neuropathy at or proximal to the FCU take-off.",fr:"Ralentissement sur le segment sus-épitrochléen. Facilement manqué par un protocole standard ; inching ou long segment sus-épitrochléen nécessaires. Aucun muscle ulnaire n'existant au-dessus du coude, une étude non localisatrice ne peut conclure qu'à une neuropathie ulnaire au niveau ou en amont de la naissance du FUC."},
      why:{en:"A fibrous band compressing the whole trunk before any sorting advantage exists.",fr:"Une bande fibreuse comprimant tout le tronc avant tout avantage de tri."}},
    groove:{ name:{en:"Ulnar groove",fr:"Gouttière épitrochléo-olécrânienne"}, hit:["hypo","deep","sup"],
      deficit:{en:"Benediction posture from third and fourth lumbrical weakness; Wartenberg's sign from a weak third palmar interosseous; Froment's sign as median FPL and FDP compensate for a weak adductor pollicis. Sensory loss over the volar and dorsal fifth and medial fourth digits, not extending far proximal to the wrist crease.",fr:"Main en bénédiction par faiblesse des 3e et 4e lombricaux ; signe de Wartenberg par faiblesse du 3e interosseux palmaire ; signe de Froment, le LFP et le FPD médians compensant l'adducteur du pouce. Hypoesthésie palmaire et dorsale du cinquième et de l'hémi-quatrième doigts, dépassant peu le pli du poignet."},
      spared:{en:"FCU and ulnar FDP in many surgically proven cases — and the book is explicit that this is not because their branches arise proximally. Thumb abduction is spared because APB is median and APL radial.",fr:"Le FUC et le FPD ulnaire dans de nombreux cas prouvés chirurgicalement — et le livre est explicite : ce n'est pas parce que leurs branches naîtraient en amont. L'abduction du pouce est épargnée, le CAP étant médian et le LAP radial."},
      edx:{en:"Test with the elbow flexed 90–135°: differential slowing above 10–11 m/s is abnormal, whereas in extension the normal limit is 25–30 m/s and a 10 m/s cutoff yields many false positives. Below-elbow stimulation exactly 3 cm distal to the medial epicondyle, below-to-above distance ideally 10 cm. Any amplitude drop over 10% between below and above elbow suggests true demyelination.",fr:"Tester coude fléchi à 90–135° : un ralentissement différentiel supérieur à 10–11 m/s est anormal, alors qu'en extension la limite normale est de 25–30 m/s et qu'un seuil à 10 m/s multiplie les faux positifs. Stimulation sous-épitrochléenne exactement 3 cm sous l'épitrochlée, distance sous- à sus-épitrochléenne idéalement 10 cm. Toute chute d'amplitude supérieure à 10 % entre les deux évoque une démyélinisation vraie."},
      why:{en:"Subcutaneous against bone with minimal epineurial padding, so the most superficially placed fascicles take the load. Watch for subluxation: it overestimates the across-elbow distance by an average of 1.6 cm and inflates the calculated velocity by about 7.9 m/s, but it does not affect conduction block.",fr:"Sous-cutané contre l'os avec peu de coussin épineural : les fascicules les plus superficiels encaissent. Attention à la subluxation : elle surestime la distance au coude de 1,6 cm en moyenne et gonfle la vitesse calculée d'environ 7,9 m/s, sans affecter le bloc de conduction."}},
    cubital:{ name:{en:"Cubital tunnel",fr:"Tunnel cubital"}, hit:["hypo","deep","sup"],
      deficit:{en:"As for the groove, but worsened by elbow flexion, which both narrows the tunnel and stretches the nerve.",fr:"Comme la gouttière, mais aggravé par la flexion du coude, qui rétrécit le tunnel et étire le nerf."},
      spared:{en:"FCU and FDP again — their branches arise distal to the cubital tunnel in 93–95% of dissections, so a lesion here is genuinely upstream of them and still spares them.",fr:"À nouveau le FUC et le FPD — leurs branches naissent en aval du tunnel dans 93–95 % des dissections, si bien qu'une lésion ici est réellement en amont et les épargne pourtant."},
      edx:{en:"Inching separates this from the groove: mark the midpoint between epicondyle and olecranon as zero, map with submaximal current, then step 1 cm from 4 cm below to 4–6 cm above. Normal step 0.1–0.3 ms; 0.5 ms or more is focal slowing. The distinction matters surgically — a cubital tunnel lesion may need only a simple release rather than transposition.",fr:"L'inching le sépare de la gouttière : repérer le milieu entre épitrochlée et olécrâne comme zéro, cartographier en courant sous-maximal, puis progresser par 1 cm de 4 cm en dessous à 4–6 cm au-dessus. Pas normal 0,1–0,3 ms ; 0,5 ms ou plus signe un ralentissement focal. La distinction compte chirurgicalement — une atteinte du tunnel peut ne requérir qu'une simple libération plutôt qu'une transposition."},
      why:{en:"Flexion narrows the aponeurotic roof and raises intraneural pressure at the same time. Combined compression and traction is harsher on large fibres than compression alone.",fr:"La flexion rétrécit le toit aponévrotique et augmente simultanément la pression intraneurale. L'association compression–traction est plus délétère pour les grosses fibres que la compression seule."}},
    exit:{ name:{en:"Cubital tunnel exit",fr:"Sortie du tunnel cubital"}, hit:["fcu","hypo","deep","sup"],
      deficit:{en:"Ulnar deficit including FCU and FDP, arising 3–7 cm distal to the groove where the nerve passes through the deep fascia separating FCU from FDP.",fr:"Déficit ulnaire incluant FUC et FPD, naissant 3–7 cm sous la gouttière, là où le nerf traverse le fascia profond séparant FUC et FPD."},
      spared:{en:"The dorsal and palmar cutaneous branches are still within the trunk here, so they are not spared — a useful contrast with the wrist lesions.",fr:"Les branches cutanées dorsale et palmaire sont encore dans le tronc ici : elles ne sont donc pas épargnées — contraste utile avec les lésions du poignet."},
      edx:{en:"Usually found only by careful inching into the proximal forearm, at surgery, or at a second operation after a failed ulnar release at the elbow.",fr:"Habituellement découverte seulement par un inching soigneux à l'avant-bras proximal, en peropératoire, ou lors d'une seconde intervention après échec d'une libération au coude."},
      why:{en:"A rare distal-forearm variant is described from a fibrovascular band supplying a hypertrophied FCU.",fr:"Une variante rare à l'avant-bras distal est décrite, liée à une bande fibrovasculaire vascularisant un FUC hypertrophié."}},
    guyon_proximal:{ name:{en:"Proximal canal lesion",fr:"Lésion proximale du canal"}, hit:["hypo","deep","sup"],
      deficit:{en:"The most complete of the four wrist patterns: all branches of the ulnar nerve at the wrist — hypothenar muscles, interossei, third and fourth lumbricals, adductor pollicis, deep head of FPB, palmaris brevis — plus sensory loss over the volar fifth and medial fourth digits.",fr:"Le plus complet des quatre tableaux du poignet : toutes les branches ulnaires au poignet — muscles hypothénariens, interosseux, 3e et 4e lombricaux, adducteur du pouce, chef profond du CFP, court palmaire — plus une hypoesthésie palmaire du cinquième et de l'hémi-quatrième doigts."},
      spared:{en:"Dorsal medial hand and dorsal fourth and fifth fingers, and the proximal volar medial palm — both cutaneous branches left the trunk proximal to the wrist. FCU and ulnar FDP. And abductor pollicis brevis, which is the discriminator against motor neuron disease.",fr:"Le dos de la main en médial et le dos des 4e et 5e doigts, ainsi que la paume proximale médiale — les deux branches cutanées sont sorties en amont du poignet. FUC et FPD ulnaire. Et le court abducteur du pouce, discriminant face à une maladie du motoneurone."},
      edx:{en:"Reduced CMAP and prolonged distal latency to both FDI and ADM, reduced digit 5 SNAP, plus conduction block or slowing across the wrist. A distal motor latency to FDI over 6.0 ms is in the demyelinating range and settles the localisation.",fr:"CMAP réduit et latence distale allongée sur le PID et l'ADM, SNAP du doigt 5 réduit, avec bloc ou ralentissement au poignet. Une latence motrice distale au PID supérieure à 6,0 ms est dans la zone démyélinisante et tranche la localisation."},
      why:{en:"Everything is still bundled at the canal inlet. Selectivity at the wrist is a function of how far past the pisohamate hiatus the lesion sits — which is exactly the principle the four patterns demonstrate.",fr:"Tout est encore rassemblé à l'entrée du canal. La sélectivité au poignet dépend de la position de la lésion par rapport au hiatus piso-hamatien — précisément le principe que démontrent les quatre tableaux."}},
    guyon_deep_prox:{ name:{en:"Proximal deep palmar motor lesion",fr:"Lésion proximale de la branche motrice profonde"}, hit:["hypo","deep"],
      deficit:{en:"All ulnar-innervated hand muscles including the hypothenar group — abductor, flexor and opponens digiti minimi — plus interossei, third and fourth lumbricals, adductor pollicis and deep head of FPB. Painless weakness and wasting of both the hypothenar and thenar eminences.",fr:"Tous les muscles intrinsèques ulnaires, groupe hypothénarien inclus — abducteur, court fléchisseur et opposant du petit doigt — plus interosseux, 3e et 4e lombricaux, adducteur du pouce et chef profond du CFP. Faiblesse et amyotrophie indolores des éminences hypothénar et thénar."},
      spared:{en:"The entire superficial branch: all sensory fibres, and the palmaris brevis. There is no sensory symptom and no sensory loss whatsoever — which is why this pattern is most often confused with early motor neuron disease.",fr:"Toute la branche superficielle : toutes les fibres sensitives, et le court palmaire. Aucun symptôme ni déficit sensitif — d'où la confusion fréquente avec une maladie du motoneurone débutante."},
      edx:{en:"Reduced CMAP and prolonged latency to both FDI and ADM, with a normal digit 5 sensory response. Together with the distal pattern this accounts for more than 75% of all ulnar neuropathies at the wrist.",fr:"CMAP réduit et latence allongée sur le PID et l'ADM, réponse sensitive du doigt 5 normale. Avec le tableau distal, cela représente plus de 75 % des neuropathies ulnaires au poignet."},
      why:{en:"The lesion sits proximal to the pisohamate hiatus but distal to the superficial branch take-off. Intact APB strength and bulk is the key differentiator from motor neuron disease, in which all C8–T1 muscles would be equally affected.",fr:"La lésion siège en amont du hiatus mais en aval de la naissance de la branche superficielle. Une force et un volume normaux du CAP sont le discriminant clé face à une maladie du motoneurone, où tous les muscles C8–T1 seraient également atteints."}},
    guyon_superficial:{ name:{en:"Superficial branch lesion",fr:"Lésion de la branche superficielle"}, hit:["sup"],
      deficit:{en:"Sensory loss over the volar fifth and medial fourth digits, and nothing else that can be seen. The palmaris brevis is affected, but the book notes this is not clinically apparent.",fr:"Hypoesthésie palmaire du cinquième et de l'hémi-quatrième doigts, et rien d'autre de visible. Le court palmaire est atteint, mais le livre note que cela n'est pas cliniquement perceptible."},
      spared:{en:"Every deep-branch muscle: hypothenar group, all interossei, third and fourth lumbricals, adductor pollicis and deep head of FPB. Strength is entirely normal.",fr:"Tous les muscles de la branche profonde : groupe hypothénarien, interosseux, 3e et 4e lombricaux, adducteur du pouce et chef profond du CFP. La force est strictement normale."},
      edx:{en:"Reduced digit 5 sensory response with entirely normal motor studies to FDI and ADM and a normal needle examination. The mirror image of the deep motor patterns.",fr:"Réponse sensitive du doigt 5 réduite, études motrices PID et ADM strictement normales et détection normale. L'image en miroir des tableaux moteurs profonds."},
      why:{en:"After the hiatus the superficial branch runs on its own. Once fascicles have finished sorting into named branches, a lesion can be perfectly selective — selectivity is a function of how far the sorting has got.",fr:"Après le hiatus, la branche superficielle chemine seule. Une fois le tri achevé en branches nommées, une lésion peut être parfaitement sélective — la sélectivité dépend de l'avancement du tri."}},
    guyon_deep_dist:{ name:{en:"Distal deep palmar motor lesion",fr:"Lésion distale de la branche motrice profonde"}, hit:["deep"],
      deficit:{en:"All muscles supplied by the deep palmar motor branch except the hypothenar group: third and fourth lumbricals, all interossei, adductor pollicis and the deep head of FPB. Painless weakness and wasting with no sensory symptoms at all.",fr:"Tous les muscles de la branche motrice palmaire profonde sauf le groupe hypothénarien : 3e et 4e lombricaux, tous les interosseux, adducteur du pouce et chef profond du CFP. Faiblesse et amyotrophie indolores, sans aucun symptôme sensitif."},
      spared:{en:"The hypothenar muscles, because their branches leave before the pisohamate hiatus — and the whole superficial branch, so sensation and palmaris brevis are intact. A normal ADM with an abnormal FDI is what separates this from the proximal deep pattern.",fr:"Les muscles hypothénariens, leurs branches sortant avant le hiatus — et toute la branche superficielle, donc sensibilité et court palmaire intacts. Un ADM normal avec un PID anormal sépare ce tableau du tableau profond proximal."},
      edx:{en:"Reduced CMAP and prolonged latency recording FDI, with a normal response recording ADM and a normal digit 5 SNAP. Needle abnormalities in FDI with a normal ADM. Comparing the two recording sites is what localises the lesion.",fr:"CMAP réduit et latence allongée en enregistrant le PID, réponse normale sur l'ADM et SNAP du doigt 5 normal. Détection anormale au PID, ADM normal. C'est la comparaison des deux sites d'enregistrement qui localise."},
      why:{en:"Most often a ganglion cyst in the canal, or repetitive pressure on the hypothenar eminence in cyclists and labourers using hand tools — the skin there may be calloused. Beware: focal motor neuron disease can preferentially affect the deep palmar motor branch and mimic this exactly.",fr:"Le plus souvent un kyste synovial du canal, ou une pression répétée sur l'éminence hypothénar chez les cyclistes et les travailleurs manuels — la peau peut y être calleuse. Attention : une maladie du motoneurone focale peut atteindre préférentiellement la branche motrice profonde et mimer exactement ce tableau."}}
  },
  evidence:[
    {conf:"high", claim:{en:"Four distinct lesion patterns at the wrist are described — distal deep palmar motor, proximal deep palmar motor, proximal canal, and superficial branch. The first two account for more than 75% of all ulnar neuropathies at the wrist.",fr:"Quatre tableaux lésionnels distincts sont décrits au poignet — moteur palmaire profond distal, moteur palmaire profond proximal, canal proximal, et branche superficielle. Les deux premiers représentent plus de 75 % des neuropathies ulnaires au poignet."},
      src:"Preston & Shapiro, Ch 20, Table 20–1"},
    {conf:"high", claim:{en:"Hypothenar branches (abductor, flexor and opponens digiti minimi) leave the deep branch before the pisohamate hiatus; palmaris brevis is supplied by the superficial branch after it.",fr:"Les branches hypothénariennes (abducteur, court fléchisseur, opposant du petit doigt) quittent la branche profonde avant le hiatus piso-hamatien ; le court palmaire dépend de la branche superficielle après le hiatus."},
      src:"Preston & Shapiro, Ch 20"},
    {conf:"high", claim:{en:"FCU sparing is NOT explained by the muscular branch arising proximal to the groove — cadaver studies found otherwise, and the branch arises distal to the cubital tunnel in 93–95% of dissections. The book attributes sparing to differential fascicular susceptibility or dying-back.",fr:"L'épargne du FUC ne s'explique PAS par une naissance de la branche en amont de la gouttière — les études cadavériques montrent l'inverse, la branche naissant en aval du tunnel cubital dans 93–95 % des dissections. Le livre attribue l'épargne à une susceptibilité fasciculaire différentielle ou au dying-back."},
      src:"Preston & Shapiro, Ch 19"},
    {conf:"high", claim:{en:"Fibres to first dorsal interosseous run in the fascicle closest to the site of compression, giving FDI recording a higher yield; different fascicles are involved or spared depending on their position within the nerve trunk.",fr:"Les fibres du premier interosseux dorsal cheminent dans le fascicule le plus proche du site de compression, d'où un meilleur rendement en enregistrant le PID ; les fascicules sont atteints ou épargnés selon leur position dans le tronc nerveux."},
      src:"Preston & Shapiro, Ch 19, Fig 19–13"},
    {conf:"mod", claim:{en:"The book gives no cross-sectional coordinates for the ulnar nerve. The arrangement drawn here is inferred from the stated selective-involvement patterns — deep motor fibres superficially placed at the elbow, FCU and cutaneous fascicles deeper — not from a measured series.",fr:"Le livre ne donne aucune coordonnée en coupe pour l'ulnaire. L'agencement dessiné ici est déduit des tableaux d'atteinte sélective décrits — fibres motrices profondes en position superficielle au coude, fascicules du FUC et cutanés plus profonds — et non d'une série mesurée."},
      src:"Preston & Shapiro, Ch 19; Sunderland 1978"}
  ]
},

radial:{
  name:{en:"Radial",fr:"Radial"}, roots:"C5–T1", limb:"upper", axes:"arm",
  blurb:{en:"The cleanest illustration of sequential branch exit: what a lesion spares tells you how far down the arm it sits. Note this book defines the PIN as the segment after the nerve enters supinator — so a complete PIN lesion spares supinator and ECRB.",
         fr:"L'illustration la plus nette du départ séquentiel des branches : ce qu'une lésion épargne indique sa hauteur. Attention : ce livre définit l'IPO comme le segment après l'entrée dans le supinateur — une lésion complète de l'IPO épargne donc le supinateur et le CERC."},
  trunks:[
    {id:"main", label:{en:"Radial nerve",fr:"Nerf radial"}, until:5, key:[[0,0,0,1]]},
    {id:"deep", label:{en:"Deep branch → PIN",fr:"Branche profonde → IPO"}, from:5, until:9.7, key:[[5,0.02,0.44,0.46],[8,0.02,0.46,0.46],[10,0.02,0.46,0.42]]},
    {id:"sup", label:{en:"Superficial branch",fr:"Branche superficielle"}, from:5, key:[[5,-0.02,-0.46,0.44],[9,-0.02,-0.48,0.44],[11,0,-0.46,0.48]]}
  ],
  levels:[
    {code:"L0", name:{en:"Posterior cord",fr:"Faisceau postérieur"}, dist:{en:"Contributions from each of C5–T1; axillary, thoracodorsal and subscapular leave first",fr:"Contributions de C5 à T1 ; l'axillaire, le thoracodorsal et les subscapulaires partent d'abord"}, kind:"plain"},
    {code:"L1", name:{en:"Axilla",fr:"Creux axillaire"}, dist:{en:"Posterior cutaneous nerves of arm and forearm, then triceps and anconeus branches",fr:"Nerfs cutanés postérieurs du bras et de l'avant-bras, puis branches du triceps et de l'anconé"}, kind:"entrap", sites:["axilla"]},
    {code:"L2", name:{en:"Spiral groove",fr:"Gouttière radiale"}, dist:{en:"Juxtaposed to the posterior humerus",fr:"Plaqué contre l'humérus postérieur"}, kind:"entrap", sites:["spiral"]},
    {code:"L3", name:{en:"Lateral intermuscular septum",fr:"Septum intermusculaire latéral"}, dist:{en:"Nerve leaves the groove into the anterior compartment",fr:"Le nerf quitte la gouttière vers la loge antérieure"}, kind:"plain"},
    {code:"L4", name:{en:"Brachioradialis and ECRL branches",fr:"Branches du brachioradial et du LERC"}, dist:{en:"Descending toward the elbow",fr:"En descendant vers le coude"}, kind:"branch"},
    {code:"L5", name:{en:"Bifurcation",fr:"Bifurcation"}, dist:{en:"3–4 cm distal to the lateral epicondyle, into superficial and deep branches",fr:"3–4 cm sous l'épicondyle latéral, en branches superficielle et profonde"}, kind:"branch"},
    {code:"L6", name:{en:"ECRB and supinator branches",fr:"Branches du CERC et du supinateur"}, dist:{en:"Leave the deep branch before it enters the supinator",fr:"Quittent la branche profonde avant son entrée dans le supinateur"}, kind:"branch"},
    {code:"L7", name:{en:"Arcade of Frohse",fr:"Arcade de Frohse"}, dist:{en:"Proximal border of supinator, tendinous in some individuals — the PIN proper begins here",fr:"Bord proximal du supinateur, tendineux chez certains — l'IPO proprement dit commence ici"}, kind:"entrap", sites:["frohse","radial_tunnel"]},
    {code:"L8", name:{en:"Forearm",fr:"Avant-bras"}, dist:{en:"PIN on the interosseous membrane; superficial branch over the radius",fr:"IPO sur la membrane interosseuse ; branche superficielle sur le radius"}, kind:"plain"},
    {code:"L9", name:{en:"Distal forearm",fr:"Avant-bras distal"}, dist:{en:"Superficial radial nerve runs subcutaneously next to the radius",fr:"La branche superficielle chemine en sous-cutané le long du radius"}, kind:"entrap", sites:["cheiralgia"]},
    {code:"L10", name:{en:"Dorsal hand",fr:"Dos de la main"}, dist:{en:"Terminal distribution",fr:"Distribution terminale"}, kind:"branch"},
    {code:"L11", name:{en:"Dorsal digital nerves",fr:"Nerfs digitaux dorsaux"}, dist:{en:"Only the superficial branch is left — the PIN has already ended as an articular branch at the wrist",fr:"Seule la branche superficielle subsiste — l'IPO s'est déjà terminé en rameau articulaire au poignet"}, kind:"branch"}
  ],
  groups:[
    { id:"tri", abbr:{en:"Triceps",fr:"Triceps"}, kind:"x", color:C.m1, from:0, exit:1,
      label:{en:"Triceps, anconeus and posterior cutaneous",fr:"Triceps, anconé et cutanés postérieurs"},
      supplies:{en:"All three heads of triceps and the anconeus; posterior cutaneous nerves of arm and forearm, lower lateral cutaneous nerve of arm",fr:"Les trois chefs du triceps et l'anconé ; nerfs cutanés postérieurs du bras et de l'avant-bras, cutané latéral inférieur du bras"},
      note:{en:"The anconeus is effectively an extension of the medial head of triceps and is the only muscle in the forearm proper supplied by the radial nerve above the spiral groove. Because this whole group leaves in the axilla, everything distal to it spares elbow extension — which is why a Saturday-night palsy has a normal triceps.",
            fr:"L'anconé est de fait un prolongement du chef médial du triceps et le seul muscle de l'avant-bras proprement dit innervé par le radial au-dessus de la gouttière. Ce groupe sortant dans l'aisselle, toute lésion en aval épargne l'extension du coude — d'où un triceps normal dans la paralysie du samedi soir."},
      key:[[0,-0.28,0.32,0.28],[1,-0.42,0.40,0.24]]},
    { id:"brecr", abbr:{en:"BR / ECRL",fr:"BR / LERC"}, kind:"m", color:C.m4, from:0, exit:4,
      label:{en:"Brachioradialis and ECRL",fr:"Brachioradial et LERC"},
      supplies:{en:"Brachioradialis, long head of extensor carpi radialis",fr:"Brachioradial, long extenseur radial du carpe"},
      note:{en:"The discriminator between a spiral groove lesion and a PIN lesion. Weak brachioradialis with a complete wrist drop places the lesion in the arm; preserved brachioradialis with wrist extension that deviates radially places it at the PIN. On needle EMG the brachioradialis is the easiest and safest of these — mistaking ECRB for ECRL can falsely suggest a lesion at or proximal to the elbow.",
            fr:"Le discriminant entre lésion de la gouttière et lésion de l'IPO. Un brachioradial faible avec main tombante complète situe la lésion au bras ; un brachioradial conservé avec extension du poignet en déviation radiale la situe à l'IPO. En détection, le brachioradial est le plus simple et le plus sûr — confondre le CERC avec le LERC peut faussement évoquer une lésion au coude ou en amont."},
      key:[[0,0.32,-0.18,0.25],[2,0.38,-0.22,0.25],[4,0.48,-0.26,0.22]]},
    { id:"ecrb", abbr:{en:"ECRB / Sup",fr:"CERC / Sup"}, kind:"m", color:C.m5, from:0, exit:6,
      trunk:[[0,"main"],[5,"deep"]],
      label:{en:"ECRB and supinator",fr:"CERC et supinateur"},
      supplies:{en:"Extensor carpi radialis brevis and the supinator",fr:"Court extenseur radial du carpe et supinateur"},
      note:{en:"ECRB has three normal innervation variants — from the main radial nerve, the superficial branch, or the deep motor branch — so an abnormal ECRB cannot distinguish a main radial lesion at the elbow from a deep branch lesion. The supinator branches leave before the arcade of Frohse, so a lesion there may or may not affect supination. Avoid the supinator on needle EMG: it is essentially in the centre of the forearm.",
            fr:"Le CERC a trois variantes normales d'innervation — tronc radial, branche superficielle, ou branche motrice profonde — si bien qu'un CERC anormal ne distingue pas une lésion du tronc au coude d'une lésion de la branche profonde. Les branches du supinateur sortent avant l'arcade de Frohse : une lésion à ce niveau peut ou non toucher la supination. Éviter le supinateur en détection : il siège pratiquement au centre de l'avant-bras."},
      key:[[0,0.14,0.06,0.22],[4,0.20,0.14,0.22],[5,0.30,-0.30,0.30],[6,0.42,-0.40,0.26]]},
    { id:"pin", abbr:{en:"PIN",fr:"IPO"}, kind:"m", color:C.m2, from:0, exit:9,
      trunk:[[0,"main"],[5,"deep"]],
      label:{en:"Posterior interosseous (PIN)",fr:"Interosseux postérieur (IPO)"},
      supplies:{en:"Extensor digitorum communis, extensor carpi ulnaris, extensor digiti quinti, abductor pollicis longus, extensor pollicis longus and brevis, extensor indicis proprius",fr:"Extenseur commun des doigts, extenseur ulnaire du carpe, extenseur du petit doigt, long abducteur du pouce, long et court extenseurs du pouce, extenseur propre de l'index"},
      note:{en:"No cutaneous sensation, but it carries deep sensory fibres to the interosseous membrane and the radioulnar joints — which is why a PIN lesion can cause forearm pain despite normal skin sensation. Most PIN lesions are pure axonal loss; conduction block between forearm and elbow is possible but rare.",
            fr:"Aucune sensibilité cutanée, mais il porte des fibres sensitives profondes pour la membrane interosseuse et les articulations radio-ulnaires — d'où une possible douleur de l'avant-bras malgré une sensibilité cutanée normale. La plupart des lésions de l'IPO sont purement axonales ; un bloc de conduction entre avant-bras et coude est possible mais rare."},
      key:[[0,0.02,0.06,0.30],[4,0.10,0.16,0.36],[5,0.00,0.10,0.52],[6,0.00,0.00,0.62],[10,0.00,0.00,0.62]]},
    { id:"srn", abbr:{en:"SRN",fr:"BSR"}, kind:"s", color:C.s1, from:0, exit:11,
      trunk:[[0,"main"],[5,"sup"]],
      label:{en:"Superficial radial sensory",fr:"Branche superficielle sensitive"},
      supplies:{en:"Lateral dorsum of the hand, part of the thumb, dorsal proximal phalanges of index, middle and ring",fr:"Dos de la main en latéral, partie du pouce, phalanges proximales dorsales de l'index, du médius et de l'annulaire"},
      note:{en:"Purely sensory. Cheiralgia paresthetica — from tight watches, bracelets or handcuffs — gives that patch of altered sensation with no weakness at all. A normal superficial radial SNAP in a clinically numb territory means one of only three things: a hyperacute axonal injury under four days old, a lesion proximal to the dorsal root ganglion, or proximal demyelination.",
            fr:"Purement sensitive. La chéiralgie paresthésique — montre, bracelet ou menottes trop serrés — donne cette plage d'hypoesthésie sans aucune faiblesse. Un SNAP radial superficiel normal dans un territoire cliniquement hypoesthésié ne signifie que trois choses : une lésion axonale suraiguë de moins de quatre jours, une lésion en amont du ganglion spinal, ou une démyélinisation proximale."},
      key:[[0,0.18,-0.34,0.24],[4,0.10,-0.36,0.28],[5,0.00,0.00,0.58],[9,0.00,0.00,0.66],[11,0.00,0.00,0.68]]}
  ],
  sites:{
    axilla:{ name:{en:"Axillary compression (crutch palsy)",fr:"Compression axillaire (paralysie des béquilles)"}, hit:["tri","brecr","ecrb","pin","srn"],
      deficit:{en:"Everything radial, triceps included — weak elbow extension on top of wrist and finger drop, with sensory disturbance extending into the posterior forearm and arm.",fr:"Tout le territoire radial, triceps inclus — extension du coude faible en plus de la main et des doigts tombants, avec troubles sensitifs s'étendant à la face postérieure de l'avant-bras et du bras."},
      spared:{en:"Deltoid and latissimus dorsi, which is what separates this from a posterior cord lesion. Median and ulnar territories entirely normal.",fr:"Deltoïde et grand dorsal, ce qui la distingue d'une atteinte du faisceau postérieur. Territoires médian et ulnaire strictement normaux."},
      edx:{en:"Denervation in triceps as well as brachioradialis and the extensors, with an absent or reduced superficial radial SNAP. Check deltoid and latissimus dorsi to exclude the cord.",fr:"Dénervation du triceps comme du brachioradial et des extenseurs, avec SNAP radial superficiel aboli ou réduit. Vérifier deltoïde et grand dorsal pour éliminer le faisceau."},
      why:{en:"Sustained external pressure on a nerve with no bony protection, every group still travelling together.",fr:"Pression externe prolongée sur un nerf sans protection osseuse, tous les groupes cheminant encore ensemble."}},
    spiral:{ name:{en:"Spiral groove — Saturday-night palsy",fr:"Gouttière radiale — paralysie du samedi soir"}, hit:["brecr","ecrb","pin","srn"],
      deficit:{en:"Marked wrist drop and finger drop, mild weakness of supination and of elbow flexion, a diminished brachioradialis reflex, and sensory loss in the superficial radial territory.",fr:"Main et doigts tombants marqués, faiblesse discrète de la supination et de la flexion du coude, réflexe brachioradial diminué, et hypoesthésie dans le territoire radial superficiel."},
      spared:{en:"Elbow extension and the anconeus — both triceps and anconeus branches arise above the groove. This is a topographic fact, not a coincidence.",fr:"L'extension du coude et l'anconé — les branches du triceps et de l'anconé naissent au-dessus de la gouttière. C'est un fait topographique, non une coïncidence."},
      edx:{en:"Look for conduction block on above-groove stimulation, not for a velocity: the nerve winds around the humerus so distances are inaccurate and calculated velocities can be factitiously fast, over 75 m/s. In a purely demyelinating lesion the forearm, elbow and below-groove responses are normal and only above-groove stimulation drops.",fr:"Chercher un bloc de conduction en stimulation sus-gouttière, non une vitesse : le nerf s'enroule autour de l'humérus, les distances sont inexactes et les vitesses calculées peuvent être faussement rapides, au-delà de 75 m/s. Dans une lésion purement démyélinisante, les réponses avant-bras, coude et sous-gouttière sont normales et seule la stimulation sus-gouttière chute."},
      why:{en:"The nerve is pinned against bone. Selectivity here comes from what has already left the trunk, not from which fascicle lies more superficially. A bedside trap: in the wrist-drop posture finger abduction looks weak and suggests ulnar disease — retest with the hand flat on a surface.",fr:"Le nerf est plaqué contre l'os. La sélectivité vient ici de ce qui est déjà sorti du tronc, non d'une position superficielle. Piège clinique : en position de main tombante, l'abduction des doigts paraît faible et évoque une atteinte ulnaire — retester main à plat sur une surface."}},
    frohse:{ name:{en:"Posterior interosseous neuropathy",fr:"Neuropathie de l'interosseux postérieur"}, hit:["pin"],
      deficit:{en:"Finger drop with a wrist that still extends, but weakly and in radial deviation, because ECRL and ECRB are preserved while extensor carpi ulnaris is not. Forearm pain is possible from the deep sensory fibres.",fr:"Doigts tombants avec extension du poignet conservée, mais faible et en déviation radiale, le LERC et le CERC étant préservés alors que l'extenseur ulnaire du carpe ne l'est pas. Une douleur de l'avant-bras est possible par les fibres sensitives profondes."},
      spared:{en:"All cutaneous sensation, plus brachioradialis, both heads of extensor carpi radialis, and triceps. On this book's definition the supinator is spared too, since its branches leave before the arcade.",fr:"Toute la sensibilité cutanée, ainsi que le brachioradial, les deux chefs de l'extenseur radial du carpe et le triceps. Selon la définition de ce livre, le supinateur est également épargné, ses branches partant avant l'arcade."},
      edx:{en:"Denervation confined to PIN-innervated muscles with a normal brachioradialis and a normal superficial radial sensory response. That normal sensory response is the whole diagnosis. Myokymic discharges can occur — the book's case shows them in extensor carpi ulnaris.",fr:"Dénervation limitée aux muscles innervés par l'IPO, brachioradial normal et réponse sensitive radiale superficielle normale. Cette normalité sensitive fait tout le diagnostic. Des décharges myokymiques sont possibles — le cas du livre en montre à l'extenseur ulnaire du carpe."},
      why:{en:"Sorting is complete here: the PIN and the superficial branch are separate nerves under separate fascia, so the arcade can compress one without touching the other.",fr:"Le tri est achevé ici : l'IPO et la branche superficielle sont deux nerfs distincts sous des fascias distincts, l'arcade peut donc comprimer l'un sans toucher l'autre."}},
    radial_tunnel:{ name:{en:"Radial tunnel syndrome",fr:"Syndrome du tunnel radial"}, hit:[],
      deficit:{en:"Isolated pain and tenderness in the extensor forearm, not unlike a persistent tennis elbow. Pain increases on resisted extension of the middle finger, which loads ECRB, or on resisted supination.",fr:"Douleur et sensibilité isolées de la loge des extenseurs, proches d'une épicondylite persistante. La douleur augmente à l'extension contrariée du médius, qui sollicite le CERC, ou à la supination contrariée."},
      spared:{en:"Everything. There are no objective neurologic signs and no weakness — by definition.",fr:"Tout. Il n'existe aucun signe neurologique objectif ni faiblesse — par définition."},
      edx:{en:"Normal. Entirely normal electrodiagnostic studies are part of the definition, which is why the entity is included here as a negative control rather than a lesion.",fr:"Normale. Des études électrodiagnostiques strictement normales font partie de la définition, raison pour laquelle cette entité figure ici comme témoin négatif plutôt que comme lésion."},
      why:{en:"The book calls this one of the more controversial and disputed nerve entrapment syndromes, and states there is no compelling evidence that the pain syndrome is caused by any nerve entrapment. It is included so the tool does not imply every named syndrome has a fascicular basis.",fr:"Le livre le qualifie de syndrome canalaire parmi les plus controversés et discutés, et affirme qu'aucune preuve convaincante ne rattache ce syndrome douloureux à une compression nerveuse. Il figure ici pour que l'outil ne laisse pas croire que tout syndrome nommé a un substrat fasciculaire."}},
    cheiralgia:{ name:{en:"Cheiralgia paresthetica",fr:"Chéiralgie paresthésique"}, hit:["srn"],
      deficit:{en:"A patch of altered sensation over the lateral dorsum of the hand, part of the thumb and the dorsal proximal phalanges of index, middle and ring. From tight bands, watches, bracelets or handcuffs.",fr:"Une plage d'hypoesthésie du dos de la main en latéral, d'une partie du pouce et des phalanges proximales dorsales de l'index, du médius et de l'annulaire. Liée à un bracelet, une montre ou des menottes trop serrés."},
      spared:{en:"All motor function — purely sensory, no weakness develops.",fr:"Toute la fonction motrice — purement sensitif, aucune faiblesse ne s'installe."},
      edx:{en:"A reduced superficial radial sensory response with an entirely normal radial motor study.",fr:"Réponse sensitive radiale superficielle réduite avec étude motrice radiale strictement normale."},
      why:{en:"In the distal third of the forearm the nerve runs subcutaneously next to the radius and can be palpated over the thumb extensor tendons — no padding, no protection.",fr:"Au tiers distal de l'avant-bras le nerf est sous-cutané le long du radius et se palpe sur les tendons extenseurs du pouce — aucun coussin, aucune protection."}}
  },
  evidence:[

      edx:{en:"The book's stance is sceptical: definite piriformis syndrome requires all four of clinical sciatic neuropathy, electrophysiologic confirmation, surgical demonstration of entrapment in a hypertrophied muscle, and improvement after decompression. The FAIR H-reflex cutoff of 1.86 ms gives only 83% specificity — 17% of normals are misclassified.",fr:"Le livre est sceptique : un syndrome du piriforme certain exige les quatre critères — neuropathie sciatique clinique, confirmation électrophysiologique, entrapment peropératoire dans un muscle hypertrophié, et amélioration après décompression. Le seuil FAIR de 1,86 ms sur le réflexe H n'offre que 83 % de spécificité — 17 % des sujets normaux sont mal classés."},
      why:{en:"In some individuals the fibres destined to become the common fibular nerve run through the piriformis before joining the sciatic — an anatomical variant that would produce exactly the selective fibular picture. In 90% of people the whole nerve simply passes beneath the muscle.",fr:"Chez certains, les fibres destinées au fibulaire commun traversent le piriforme avant de rejoindre le sciatique — variante anatomique qui produirait exactement le tableau fibulaire sélectif. Chez 90 % des sujets, le nerf passe simplement sous le muscle."}},
    hip:{ name:{en:"Hip fracture, dislocation or arthroplasty",fr:"Fracture, luxation ou prothèse de hanche"}, hit:["per","shb","tib","ham","pcnt"],
      deficit:{en:"The commonest sciatic presentation. Posterior dislocation especially, or the repair surgery — retraction, stretch, or methylmethacrylate cement forming spurs that erode into the nerve months to years later. Complete lesions paralyse knee flexion and all ankle and toe movement, with a depressed or absent ankle reflex.",fr:"La présentation sciatique la plus fréquente. Surtout la luxation postérieure, ou la chirurgie de reconstruction — écartement, étirement, ou ciment de méthacrylate formant des éperons érodant le nerf des mois ou des années plus tard. Les lésions complètes paralysent la flexion du genou et tous les mouvements de cheville et d'orteils, avec réflexe achilléen diminué ou aboli."},
      spared:{en:"Medial calf and foot (saphenous, from the femoral nerve) and, if the posterior cutaneous nerve escapes, the posterior thigh. Any involvement of those territories suggests a more widespread lesion. The complete deficit is seen only in severe lesions or late in the course.",fr:"Le mollet et le pied en médial (saphène, du fémoral) et, si le cutané postérieur est épargné, la face postérieure de la cuisse. Une atteinte de ces territoires évoque une lésion plus étendue. Le déficit complet ne s'observe que dans les lésions sévères ou tardivement."},
      edx:{en:"Reduced tibial and fibular CMAPs versus the other side, with velocities normal or slightly slowed but never in the demyelinating range. Both sural and superficial fibular SNAPs reduced. Needle: sciatic thigh, fibular and tibial muscles abnormal with gluteal, tensor fascia latae and paraspinal muscles spared.",fr:"CMAP tibial et fibulaire réduits par rapport au côté sain, vitesses normales ou peu ralenties mais jamais dans la zone démyélinisante. SNAP suraux et fibulaires superficiels tous deux réduits. Détection : muscles de cuisse sciatiques, fibulaires et tibiaux anormaux, fessiers, tenseur du fascia lata et paravertébraux épargnés."},
      why:{en:"Even in a lesion this proximal the fibular fibres come off worse, because they are lateral and posterior and take the brunt of retraction and stretch.",fr:"Même à ce niveau proximal, les fibres fibulaires souffrent davantage, étant latérales et postérieures et encaissant l'essentiel de l'écartement et de l'étirement."}},

      why:{en:"The proximal thigh is a watershed area for nerve ischaemia. Because the blood supply is fascicle by fascicle, this is where the book's general rule bites hardest: fascicles to certain muscles can be preferentially affected while others are preferentially spared.",fr:"La cuisse proximale est une zone de dernier pré pour l'ischémie nerveuse. La vascularisation étant fasciculaire, c'est ici que la règle générale du livre s'applique le plus fort : les fascicules de certains muscles peuvent être préférentiellement atteints, d'autres préférentiellement épargnés."}},
