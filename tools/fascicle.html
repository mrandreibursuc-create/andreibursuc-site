/* ============================================================
   State
   ============================================================ */
let nerveKey = "median";
let posF = 0;
let mode = "explore";
let focusGroup = null;
let hoverGroup = null;
let siteIdx = 0;
let lastLevel = -1;

const $ = s => document.querySelector(s);
const nerve = () => NERVES[nerveKey];
const maxIdx = () => nerve().levels.length - 1;
const lerp = (a,b,t) => a + (b-a)*t;
const sstep = u => u <= 0 ? 0 : u >= 1 ? 1 : u*u*(3 - 2*u);
function hashStr(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return h >>> 0; }

/* generic keyframe interpolation over [level, ...values] rows (clamped at both ends) */
function keyAt(K, f){
  let a = K[0], b = K[0];
  if(f >= K[K.length-1][0]){ a = b = K[K.length-1]; }
  else {
    for(let i=0;i<K.length-1;i++){
      if(f >= K[i][0] && f <= K[i+1][0]){ a = K[i]; b = K[i+1]; break; }
    }
  }
  const span = (b[0]-a[0]) || 1;
  const t = Math.max(0, Math.min(1, (f - a[0]) / span));
  const out = [];
  for(let i=1;i<a.length;i++) out.push(lerp(a[i], b[i], t));
  return out;
}

/* ============================================================
   Timing of the continuous model
   ------------------------------------------------------------
   Nothing appears or disappears at a level: every departure is a
   BUD. Over the W_SPLIT window before a branch leaves, a small
   envelope forms around its fascicles inside the parent, slides
   to the parent's wall and pinches off; after the exit level the
   detached bud drifts away and fades over FADE. A trunk division
   is the same idea run in reverse scale: the daughter envelopes
   start coincident with the parent and slide apart, so the single
   outline becomes a waisted figure-of-eight and then two nerves.
   ============================================================ */
const W_SPLIT = 0.85;   // window before an exit / division (in levels)
const FADE    = 0.70;   // detached bud drifts and fades over this
const GROW    = 0.60;   // a fascicle that first appears grows in over this

/* ============================================================
   Trunks
   ============================================================ */
const DEFAULT_TRUNKS = [{id:"main", key:[[0,0,0,1]]}];
function trunksOf(){ return nerve().trunks || DEFAULT_TRUNKS; }
function trunkById(id){ return trunksOf().find(t => t.id === id) || null; }

function shapeAt(f){
  const S = nerve().shape;
  if(!S) return 0.9;
  return keyAt(S, f)[0];
}

const metaCache = {};
/* parent: the trunk whose fascicles flow into this one; division: the parent ends where this one starts */
function trunkMeta(tr){
  const ck = nerveKey + "|" + tr.id;
  if(metaCache[ck]) return metaCache[ck];
  let parent = null;
  if(tr.id !== "main"){
    parent = "main";
    outer: for(const fa of nerve().fasc){
      const m = fa.trunk || [];
      for(let i=1;i<m.length;i++) if(m[i][1] === tr.id){ parent = m[i-1][1]; break outer; }
    }
  }
  const S = tr.from || 0;
  const P = parent ? trunkById(parent) : null;
  const division = !!(P && P.until !== undefined && Math.abs(P.until - S) < 0.01);
  metaCache[ck] = {parent, division};
  return metaCache[ck];
}
/* the level at which this trunk ends by dividing into daughters, or null */
function divisionAt(tr){
  if(tr.until === undefined) return null;
  for(const c of trunksOf()){
    if(c === tr) continue;
    if(Math.abs((c.from || 0) - tr.until) < 0.01 && trunkMeta(c).parent === tr.id) return tr.until;
  }
  return null;
}

function pressDeform(){
  const s = (mode === "lesion") ? currentSite() : null;
  if(!s || !s.press) return {sx:1, sy:1, dx:0, dy:0, press:null, sig:"0"};
  const [px,py] = s.press;
  return {sx: px ? 0.66 : 1, sy: py ? 0.66 : 1, dx: -px*0.13, dy: -py*0.13, press:s.press, sig:px+","+py};
}

/* geometry of a trunk envelope in section space (units of R) */
function trunkGeom(tr, f, D){
  const [cx,cy,r] = keyAt(tr.key, f);
  const ar = (tr.id === "main") ? shapeAt(f) : (tr.ar || 0.86);
  const g = {cx, cy, rx:r, ry:r*ar};
  if(tr.id === "main" && D && D.press){ g.cx += D.dx*r; g.cy += D.dy*r; g.rx *= D.sx; g.ry *= D.sy; g.deformed = true; }
  return g;
}

/* null (not shown) | {phase:"window", u} | {phase:"on", alpha, fade} */
function trunkState(tr, f){
  const S = tr.from || 0;
  const U = (tr.until === undefined) ? Infinity : tr.until;
  if(S > 0){
    if(f < S - W_SPLIT - 1e-6) return null;
    if(f < S) return {phase:"window", u: sstep((f - (S - W_SPLIT)) / W_SPLIT)};
  }
  const dv = divisionAt(tr);
  if(dv !== null){
    if(f >= dv - W_SPLIT - 1e-6) return null;          // daughters take over
    return {phase:"on", alpha:1, fade:0};
  }
  if(U !== Infinity){
    if(f >= U) return null;
    if(f > U - FADE){ const a = (U - f)/FADE; return {phase:"on", alpha:a, fade:1 - a}; }
  }
  return {phase:"on", alpha:1, fade:0};
}

function trunkIdAt(o, f){
  const map = o.trunk || [[0,"main"]];
  let id = map[0][1];
  for(const row of map){ if(f >= row[0] - 0.001) id = row[1]; }
  return id;
}

/* ============================================================
   Fascicles — one continuous trajectory each
   ============================================================ */

/* A fascicle's keyframes before and after a trunk change are expressed in
   different coordinate frames, so they must never be interpolated together.
   Restrict interpolation to the keyframes inside the current trunk segment. */
function segKeys(fa, f){
  const map = fa.trunk || [[0,"main"]];
  let lo = 0, hi = Infinity;
  for(let i=0;i<map.length;i++){
    if(f >= map[i][0] - 0.001){ lo = map[i][0]; hi = (i+1 < map.length) ? map[i+1][0] : Infinity; }
  }
  const K = fa.key.filter(k => k[0] >= lo - 0.001 && k[0] < hi - 0.001);
  return K.length ? K : fa.key;
}

/* When and how a fascicle leaves the picture.
   E: level at which its bud detaches. carried: its whole envelope leaves
   (a named branch trunk that ends), so it rides that envelope's fade instead
   of budding on its own. ws: start of its budding window. */
const exitCache = {};
function exitInfo(fa){
  const ck = nerveKey + "|" + fa.id;
  if(exitCache[ck]) return exitCache[ck];
  const m = fa.trunk || [[0,"main"]];
  let tid = m[0][1];
  for(const r of m) if(fa.exit >= r[0] - 0.001) tid = r[1];
  const tr = trunkById(tid);
  const switches = m.some(r => r[0] > 0 && Math.abs(r[0] - fa.exit) < 0.01);
  let E = fa.exit, carried = false;
  if(fa.exit >= maxIdx() - 0.001){                      // the model ends here: nothing to leave from
    exitCache[ck] = {E:1e9, carried:false, ws:1e9, tid, terminal:true};
    return exitCache[ck];
  }
  if(tr && tr.id !== "main" && tr.until !== undefined && divisionAt(tr) === null
     && tr.until <= fa.exit + FADE + 0.05 && tr.until >= fa.exit - 0.001){ E = tr.until; carried = true; }
  else if(switches) E = fa.exit + 0.75;       // leaves right after joining a daughter: bud from the daughter
  let ws = E - W_SPLIT;
  for(const r of m) if(r[0] > 0 && r[0] <= E + 0.001 && r[0] > ws) ws = r[0];
  ws = Math.max(ws, fa.from || 0);
  exitCache[ck] = {E, carried, ws, tid};
  return exitCache[ck];
}

/* presence summary used by legend / panel */
function fascAt(fa, f){
  const from = fa.from || 0;
  if(f < from - 0.001) return null;
  const X = exitInfo(fa);
  if(X.carried){
    if(f >= X.E) return null;
    const a = Math.min(1, (X.E - f)/FADE);
    return {alpha:a, leaving: a < 0.999};
  }
  if(f >= X.E + FADE) return null;
  if(f >= X.E){ const u = (f - X.E)/FADE; return {alpha: 1 - u, leaving:true}; }
  return {alpha:1, leaving:false};
}

function labelOf(fa, f){
  if(typeof fa.lab === "string") return fa.lab;
  if(!Array.isArray(fa.lab)) return "";
  let s = fa.lab[0][1];
  for(const row of fa.lab){ if(f >= row[0] - 0.001) s = row[1]; }
  return s;
}

function groupAlive(gid, f){
  return nerve().fasc.some(fa => fa.g === gid && (() => { const p = fascAt(fa,f); return p && p.alpha > 0.04 && !p.leaving; })());
}
function groupPresent(gid, f){
  return nerve().fasc.some(fa => fa.g === gid && (() => { const p = fascAt(fa,f); return p && p.alpha > 0.04; })());
}

/* raw authored position of a fascicle at level f, in its current trunk's frame */
function rawLocal(fa, f){
  let [x,y,r] = keyAt(segKeys(fa, f), Math.min(f, fa.exit));
  let alpha = 1;
  const from = fa.from || 0;
  if(from > 0 && f < from + GROW){ const u = Math.max(0, (f - from)/GROW); r *= 0.62 + 0.38*u; alpha = 0.45 + 0.55*u; }
  return {x, y, r, alpha};
}

/* ============================================================
   Relaxation inside an ellipse of semi-axes (1, ar).
   Separation is done by MOVING fascicles, never by shrinking them —
   the only size adjustment is a continuous area cap. A fascicle that
   is budding off (w → 1) releases its space progressively, while the
   bud that carries it away is a solid obstacle the residents flow
   around — so nothing jumps when it finally leaves.
   ============================================================ */
const AREA_TARGET = 0.52;
const PAD = 1.07;

function relaxE(arr, ar, obst){
  obst = obst || [];
  for(const o of arr) o.r = Math.min(o.r, 0.85*ar);
  // a departing fascicle stops colliding with the residents as soon as its bud
  // (an obstacle in its own right) has taken over; its share of the area cap goes with it
  const wt = o => 1 - ramp(o.w || 0);

  let sum = 0; for(const o of arr) sum += o.r*o.r*wt(o);
  const cap = AREA_TARGET*ar;
  if(sum > cap){ const k = Math.sqrt(cap/sum); for(const o of arr) o.r *= k; }

  for(let it=0; it<130; it++){
    for(let i=0;i<arr.length;i++){
      for(let j=i+1;j<arr.length;j++){
        const a = arr[i], b = arr[j];
        let dx = b.x-a.x, dy = (b.y-a.y)*ar;
        let d = Math.hypot(dx,dy);
        if(d < 1e-4){ dx = 1e-3*(i+1); dy = 1e-3*(j+1); d = Math.hypot(dx,dy); }
        // fascicles leaving together keep their full size against each other
        const together = a.dest && a.dest === b.dest && a.bud === b.bud;
        const min = together ? (a.r+b.r)*PAD : (a.r*wt(a)+b.r*wt(b))*PAD;
        if(d < min){
          const push = ((min-d)/d)*0.6;
          const wa = 1 - 0.85*(a.w||0), wb = 1 - 0.85*(b.w||0);   // residents hold their ground
          const tot = wa + wb;
          a.x -= dx*push*(wb/tot)*2; a.y -= dy*push*(wb/tot)*2/ar;
          b.x += dx*push*(wa/tot)*2; b.y += dy*push*(wa/tot)*2/ar;
        }
      }
    }
    for(const o of arr){
      o.x += (o.ax-o.x)*0.035;
      o.y += (o.ay-o.y)*0.035;
      for(const ob of obst){
        if(ob.members.has(o.fa.id)) continue;
        const dx = o.x-ob.cx, dy = (o.y-ob.cy)*ar;
        const d = Math.hypot(dx,dy);
        const min = (o.r + ob.r)*PAD;
        if(d >= min) continue;
        // the bud slides outward along its path; a resident in the way is
        // shouldered SIDEWAYS, to the side of the path it was on when the bud began to form
        const side = ob.side(o.fa);
        const k = (min-d)*0.6*ob.k;
        o.x += -ob.py*side*k; o.y += ob.px*side*k/ar;
      }
      const rx = Math.max(0.02, 1 - o.r), ry = Math.max(0.02, ar - o.r);
      const u = o.x/rx, v = (o.y*ar)/ry, m = Math.hypot(u,v);
      if(m > 1){ o.x /= m; o.y /= m; }
    }
  }
}

/* ============================================================
   Buds. A bud is described entirely from authored positions, so the
   frame solver and the renderer agree on it exactly.
   c: tight centre of its fascicles; c0: the same, pulled inward so the
   bud starts wholly inside the parent; rb0: tight radius; rb: radius
   with margin, reached at detachment; tc: centre at detachment, just
   outside the parent wall along dir. At weight w the bud sits at
   cc = lerp(c0, tc, w) with radius rp = lerp(rb0, rb, w).
   ============================================================ */
function budFrom(pts, w){
  let cx = 0, cy = 0;
  for(const p of pts){ cx += p.x; cy += p.y; }
  cx /= pts.length; cy /= pts.length;
  let rb0 = 0, rmax = 0;
  for(const p of pts){ rb0 = Math.max(rb0, Math.hypot(p.x-cx, p.y-cy) + p.r); rmax = Math.max(rmax, p.r); }
  const rb = Math.max(rb0*1.08, rmax*1.32);
  const n = Math.hypot(cx, cy);
  const lim = Math.max(0, 1 - rb0 - 0.02);
  const k = (n > lim && n > 1e-6) ? lim/n : 1;
  const c0 = {x:cx*k, y:cy*k};
  const dir = n < 1e-3 ? {x:1, y:0} : {x:cx/n, y:cy/n};
  const tc = {x: dir.x*(1 + rb + 0.02), y: dir.y*(1 + rb + 0.02)};
  return {c:{x:cx, y:cy}, c0, rb0, rb, dir, tc, w, cc:{x: lerp(c0.x, tc.x, w), y: lerp(c0.y, tc.y, w)}, rp: lerp(rb0, rb, w)};
}
/* unit direction of a bud's path in the (x, y·ar) metric, with its origin */
function pathOf(a, b, ar){
  const dx = b.x - a.x, dy = (b.y - a.y)*ar, d = Math.hypot(dx,dy);
  return d > 1e-6 ? {x0:a.x, y0:a.y, px:dx/d, py:dy/d} : {x0:a.x, y0:a.y, px:1, py:0};
}
/* which side of a bud's path a resident lies on, decided once — at the level
   where the bud begins to form — so the choice can never flip mid-transition */
const sideCache = {};
function sideFn(budId, memberFas, ws, ar, target){
  const key0 = nerveKey + "|" + budId + "|";
  const pts = memberFas.map(fa => { const p = rawLocal(fa, Math.max(ws, fa.from || 0)); return {x:p.x, y:p.y, r:p.r}; });
  const B = budFrom(pts, 0);
  const path = pathOf(B.c0, target || B.tc, ar);
  return fa => {
    const ck = key0 + fa.id;
    if(sideCache[ck] !== undefined) return sideCache[ck];
    const p = rawLocal(fa, Math.max(ws, fa.from || 0));
    let side = path.px*((p.y-path.y0)*ar) - path.py*(p.x-path.x0);
    if(Math.abs(side) < 1e-4) side = (hashStr(fa.id) % 2) ? 1 : -1;
    side = side > 0 ? 1 : -1;
    sideCache[ck] = side;
    return side;
  };
}

const ramp = w => sstep(w/0.25);      // an obstacle's strength, full once the bud has begun to move

/* departing fascicles of one trunk at one exit level, grouped into buds by
   proximity of their authored positions (deterministic, level-independent) */
const clusterCache = {};
function budClusters(tid, E){
  const ck = nerveKey + "|" + tid + "|" + E;
  if(clusterCache[ck]) return clusterCache[ck];
  const cand = nerve().fasc.filter(fa => { const X = exitInfo(fa); return !X.carried && Math.abs(X.E - E) < 0.01 && X.tid === tid; })
    .map(fa => { const [x,y,r] = keyAt(segKeys(fa, fa.exit), fa.exit); return {id:fa.id, x, y, r}; })
    .sort((a,b) => a.id < b.id ? -1 : 1);
  const cl = [];
  for(const c of cand){
    let home = null;
    for(const grp of cl){
      if(grp.some(o => Math.hypot(o.x-c.x, o.y-c.y) <= (o.r + c.r) + 0.10)){ home = grp; break; }
    }
    if(home) home.push(c); else cl.push([c]);
  }
  const out = {};
  cl.forEach((grp, k) => grp.forEach(o => out[o.id] = k));
  clusterCache[ck] = out;
  return out;
}

/* ============================================================
   Frames — the relaxed arrangement of each trunk's fascicles at f,
   in that trunk's own coordinates. Pure function of (nerve, f, deform).
   Each frame also carries the buds and budding daughters attached to
   its trunk at f, computed from authored positions.
   ============================================================ */
const frameCache = new Map();
function memo(cache, key, fn){
  if(cache.has(key)) return cache.get(key);
  const v = fn();
  cache.set(key, v);
  if(cache.size > 64){ cache.delete(cache.keys().next().value); }
  return v;
}
function clearCaches(){ frameCache.clear(); childCache.clear(); frozenCache.clear(); layoutCache.key = ""; }

function departure(fa, f, X){
  const m = fa.trunk || [[0,"main"]];
  let sw = null;
  for(const row of m){ if(row[0] > f + 0.001){ sw = row; break; } }
  if(sw && f >= sw[0] - W_SPLIT) return {w: sstep((f - (sw[0] - W_SPLIT))/W_SPLIT), dest: sw[1]};
  if(!X.carried && f >= X.ws) return {w: sstep((f - X.ws)/Math.max(1e-6, X.E - X.ws)), dest: "bud"};
  return {w:0, dest:null};
}

function frame(f){
  const D = pressDeform();
  return memo(frameCache, nerveKey + "|" + f.toFixed(4) + "|" + D.sig, () => {
    const buckets = {};
    for(const fa of nerve().fasc){
      const from = fa.from || 0;
      if(f < from - 0.001) continue;
      const X = exitInfo(fa);
      if(f >= X.E - 1e-9) continue;
      const g = nerve().groups.find(x => x.id === fa.g);
      if(!g) continue;
      const tid = trunkIdAt(fa, f);
      const p = rawLocal(fa, f);
      const dp = departure(fa, f, X);
      const bud = (dp.dest === "bud") ? (budClusters(tid, X.E)[fa.id] || 0) : -1;
      (buckets[tid] = buckets[tid] || []).push({
        fa, g, tid, lab:labelOf(fa,f), dash:fa.dash, alpha:p.alpha,
        x:p.x, y:p.y, r:p.r, ax:p.x, ay:p.y, w:dp.w, dest:dp.dest, E:X.E, bud
      });
    }
    const out = {buckets, buds:{}, daughters:{}};
    for(const tid in buckets){
      const tr = trunkById(tid);
      const G = tr ? trunkGeom(tr, f, D) : {cx:0, cy:0, rx:1, ry:0.9};
      const ar = Math.max(0.18, G.ry/G.rx);
      const arr = buckets[tid];

      /* pass 1 — as if nothing were leaving: this is where the departing
         fascicles sit, and where their bud starts from */
      const p1 = arr.map(o => Object.assign({}, o, {w:0, dest:null, bud:-1}));
      relaxE(p1, ar);
      const rel = {}; p1.forEach(o => rel[o.fa.id] = o);

      const obst = [];
      /* buds forming on this trunk */
      const groups = {};
      for(const o of arr){
        if(o.dest !== "bud" || !(o.w > 0)) continue;
        const key = (Math.round(o.E*1000)/1000) + ":" + o.bud;
        (groups[key] = groups[key] || []).push(o);
      }
      const buds = [];
      for(const key in groups){
        const cl = groups[key];
        let w = 0; for(const o of cl) w += o.w; w /= cl.length;
        const B = budFrom(cl.map(o => { const q = rel[o.fa.id]; return {x:q.x, y:q.y, r:q.r}; }), w);
        B.id = "bud:" + tid + ":" + key; B.tid = tid; B.members = new Set(cl.map(o => o.fa.id)); B.cl = cl;
        buds.push(B);
      }
      /* buds leaving side by side must not land on top of each other */
      for(let it=0; it<30; it++){
        for(let i=0;i<buds.length;i++) for(let j=i+1;j<buds.length;j++){
          const a = buds[i], b = buds[j];
          const dx = b.tc.x - a.tc.x, dy = b.tc.y - a.tc.y, d = Math.hypot(dx,dy) || 1e-4;
          const min = a.rb + b.rb + 0.03;
          if(d < min){ const k = (min-d)/d*0.5; a.tc.x -= dx*k; a.tc.y -= dy*k; b.tc.x += dx*k; b.tc.y += dy*k; }
        }
      }
      for(const B of buds){
        B.cc = {x: lerp(B.c0.x, B.tc.x, B.w), y: lerp(B.c0.y, B.tc.y, B.w)};
        B.pos = {};
        out.buds[B.id] = B;
        const path = pathOf(B.c0, B.tc, ar);
        const side = sideFn(B.id, B.cl.map(o => o.fa), exitInfo(B.cl[0].fa).ws, ar);
        // the bud is an obstacle made of its own fascicles, carried from where they
        // sit now to where the bud detaches — exactly as they will be drawn
        for(const o of B.cl){
          const q = rel[o.fa.id];
          const lx = lerp((q.x-B.c0.x)/B.rp, (q.x-B.c.x)/B.rb, B.w), ly = lerp((q.y-B.c0.y)/B.rp, (q.y-B.c.y)/B.rb, B.w);
          const pos = {x: B.cc.x + lx*B.rp, y: B.cc.y + ly*B.rp, r: q.r, lx, ly};
          B.pos[o.fa.id] = pos;
          obst.push(Object.assign({cx:pos.x, cy:pos.y, r:pos.r, k:ramp(B.w), members:B.members, side}, path));
        }
      }
      /* daughter trunks budding from this trunk (not divisions: those have no residents) */
      for(const ch of trunksOf()){
        const st = trunkState(ch, f);
        if(!st || st.phase !== "window") continue;
        const M = trunkMeta(ch);
        if(M.parent !== tid || M.division) continue;
        const mine = arr.filter(o => o.dest === ch.id);
        if(!mine.length) continue;
        const B = budFrom(mine.map(o => { const q = rel[o.fa.id]; return {x:q.x, y:q.y, r:q.r}; }), 0);
        const tg = trunkGeom(ch, ch.from || 0, D);
        const tl = {x:(tg.cx - G.cx)/G.rx, y:(tg.cy - G.cy)/G.ry, r: tg.rx/G.rx};   // target, in this trunk's units
        const u = st.u;
        const dg = {id:ch.id, members:new Set(mine.map(o => o.fa.id)), c0:B.c0, rb0:B.rb0,
                    cc:{x: lerp(B.c0.x, tl.x, u), y: lerp(B.c0.y, tl.y, u)}, rp: lerp(B.rb0, tl.r, u), u, pos:{}};
        out.daughters[ch.id] = dg;
        const path = pathOf(B.c0, tl, ar);
        const side = sideFn(ch.id, mine.map(o => o.fa), (ch.from || 0) - W_SPLIT, ar, tl);
        const CF = childFrame(ch);
        for(const o of mine){
          const q = rel[o.fa.id];
          const t = CF[o.fa.id] || {x:(q.x-B.c0.x)/B.rb0, y:(q.y-B.c0.y)/B.rb0, r:q.r/B.rb0};
          const lx = lerp((q.x-B.c0.x)/B.rb0, t.x, u), ly = lerp((q.y-B.c0.y)/B.rb0, t.y, u), lr = lerp(q.r/B.rb0, t.r, u);
          const pos = {x: dg.cc.x + lx*dg.rp, y: dg.cc.y + ly*dg.rp, r: lr*dg.rp, lx, ly, lr};
          dg.pos[o.fa.id] = pos;
          obst.push(Object.assign({cx:pos.x, cy:pos.y, r:pos.r, k:ramp(u), members:dg.members, side}, path));
        }
      }

      /* pass 2 — the residents make way for the buds; the departing fascicles
         keep their pass-1 places (their bud carries them from there) */
      relaxE(arr, ar, obst);
      for(const o of arr){
        if(o.w > 0){ const q = rel[o.fa.id]; o.x = q.x; o.y = q.y; o.r = q.r; }
      }
    }
    return out;
  });
}

/* the arrangement a daughter trunk has at the level it is born — the target of its budding */
const childCache = new Map();
function childFrame(tr){
  const D = pressDeform();
  return memo(childCache, nerveKey + "|" + tr.id + "|" + D.sig, () => {
    const S = tr.from || 0;
    const arr = [];
    for(const fa of nerve().fasc){
      if((fa.from || 0) > S + 0.001) continue;
      const X = exitInfo(fa);
      if(S >= X.E - 1e-9) continue;
      if(trunkIdAt(fa, S) !== tr.id) continue;
      const p = rawLocal(fa, S);
      arr.push({fa, x:p.x, y:p.y, r:p.r, ax:p.x, ay:p.y, w:0, dest:null, bud:-1});
    }
    const G = trunkGeom(tr, S, D);
    relaxE(arr, Math.max(0.18, G.ry/G.rx));
    const out = {};
    for(const o of arr) out[o.fa.id] = {x:o.x, y:o.y, r:o.r};
    return out;
  });
}

/* ============================================================
   Layout — envelopes and fascicle positions in section space
   ============================================================ */
let layoutCache = {key:"", val:null};
const frozenCache = new Map();

/* a trunk's name goes below it unless the trunk clearly sits above the rest of the picture */
function labelSide(g){ return !(g.cy < -0.12); }

function refCenter(tr, f, D){
  const M = trunkMeta(tr);
  const P = M.parent ? trunkById(M.parent) : null;
  if(P && trunkState(P, f)) { const g = trunkGeom(P, f, D); return {x:g.cx, y:g.cy}; }
  let sx = 0, sy = 0, n = 0;
  for(const o of trunksOf()){
    if(o === tr) continue;
    const st = trunkState(o, f);
    if(!st || st.phase !== "on" || st.alpha < 0.999) continue;
    const g = trunkGeom(o, f, D); sx += g.cx; sy += g.cy; n++;
  }
  return n ? {x:sx/n, y:sy/n} : {x:0, y:0};
}

/* bud states at the instant before an exit level, so a detached bud keeps the shape it had */
function frozenBuds(E){
  const D = pressDeform();
  return memo(frozenCache, nerveKey + "|" + E + "|" + D.sig, () => {
    const FR = frame(E - 0.001);
    const out = {};
    for(const id in FR.buds){
      const B = FR.buds[id];
      for(const o of FR.buckets[B.tid]){
        if(!B.members.has(o.fa.id)) continue;
        const q = B.pos[o.fa.id];
        out[o.fa.id] = {id, tid:B.tid, tc:B.tc, dir:B.dir, rb:B.rb,
                        L:{x:(q.x-B.cc.x)/B.rp, y:(q.y-B.cc.y)/B.rp, r:q.r/B.rb}, lab:o.lab, dash:o.dash, g:o.g};
      }
    }
    return out;
  });
}

function layout(f){
  const D = pressDeform();
  const ck = nerveKey + "|" + f.toFixed(4) + "|" + mode + "|" + siteIdx + "|" + D.sig;
  if(layoutCache.key === ck) return layoutCache.val;

  const FR = frame(f);
  const envs = [];
  const items = [];

  /* 1. every frame item gets a base position through its own trunk's geometry
        (frames are cached and shared, so work on copies) */
  const byFa = {};
  for(const tid in FR.buckets){
    const tr = trunkById(tid);
    const G = tr ? trunkGeom(tr, f, D) : {cx:0, cy:0, rx:1, ry:0.9};
    for(const o0 of FR.buckets[tid]){
      const o = Object.assign({}, o0);
      o.gx = G.cx + o.x*G.rx; o.gy = G.cy + o.y*G.ry; o.gr = o.r*G.rx;
      o.env = tid; o.leaving = false;
      byFa[o.fa.id] = o;
      items.push(o);
    }
  }
  const mine_of = (tid, pred) => (FR.buckets[tid] || []).map(o0 => byFa[o0.fa.id]).filter(o => o && pred(o));

  /* 2. trunk envelopes */
  const mainG = trunkGeom(trunkById("main") || DEFAULT_TRUNKS[0], f, D);
  for(const tr of trunksOf()){
    const st = trunkState(tr, f);
    if(!st) continue;

    if(st.phase === "on"){
      const g = trunkGeom(tr, f, D);
      const e = {id:tr.id, tr, g, alpha:st.alpha, kind:"trunk", label:tr.label, labelAlpha:st.alpha, deformed:!!g.deformed, side: labelSide(g)};
      if(st.fade > 0){
        const ref = refCenter(tr, f, D);
        const dx = g.cx - ref.x, dy = g.cy - ref.y, d = Math.hypot(dx,dy);
        const ux = d > 1e-6 ? dx/d : 1, uy = d > 1e-6 ? dy/d : 0;
        g.cx += ux*0.18*st.fade; g.cy += uy*0.18*st.fade;
        g.rx *= 1 - 0.25*st.fade; g.ry *= 1 - 0.25*st.fade;
        e.ref = ref; e.fading = true;
        for(const o of mine_of(tr.id, () => true)){
          o.gx = g.cx + o.x*g.rx; o.gy = g.cy + o.y*g.ry; o.gr = o.r*g.rx;
          o.alpha *= st.alpha; o.leaving = true;
        }
      }
      envs.push(e);
      continue;
    }

    /* a daughter in its budding window */
    const M = trunkMeta(tr);
    const P = trunkById(M.parent);
    const Pg = trunkGeom(P, f, D);
    const S = tr.from || 0;
    const tg = trunkGeom(tr, S, D);
    const mine = mine_of(M.parent, o => o.dest === tr.id);
    const u = st.u;
    const dg = FR.daughters[tr.id];
    if(M.division || !dg){
      /* division: both daughters start as the parent itself and slide apart */
      const CF = childFrame(tr);
      const start = {cx:Pg.cx, cy:Pg.cy, rx:Pg.rx, ry:Pg.ry};
      const g = {cx: lerp(start.cx, tg.cx, u), cy: lerp(start.cy, tg.cy, u), rx: lerp(start.rx, tg.rx, u), ry: lerp(start.ry, tg.ry, u)};
      envs.push({id:tr.id, tr, g, alpha:1, kind:"trunk", window:true, label:tr.label, labelAlpha:u, side: labelSide(tg)});
      for(const o of mine){
        const a = {x:o.x, y:o.y, r:o.r}, b = CF[o.fa.id] || a;
        const x = lerp(a.x, b.x, u), y = lerp(a.y, b.y, u), r = lerp(a.r, b.r, u);
        o.gx = g.cx + x*g.rx; o.gy = g.cy + y*g.ry; o.gr = r*g.rx; o.env = tr.id;
      }
    } else {
      /* side branch: starts as a small envelope around its own fascicles (geometry from the frame) */
      const g = {cx: Pg.cx + dg.cc.x*Pg.rx, cy: Pg.cy + dg.cc.y*Pg.ry, rx: dg.rp*Pg.rx, ry: lerp(dg.rb0*Pg.ry, tg.ry, u)};
      envs.push({id:tr.id, tr, g, alpha:1, kind:"trunk", window:true, label:tr.label, labelAlpha:u, side: labelSide(tg)});
      for(const o of mine){
        const q = dg.pos[o.fa.id]; if(!q) continue;
        o.gx = g.cx + q.lx*g.rx; o.gy = g.cy + q.ly*g.ry; o.gr = q.lr*g.rx; o.env = tr.id;
      }
    }
  }

  /* 3. buds forming before an exit (geometry from the frame) */
  for(const id in FR.buds){
    const B = FR.buds[id];
    const tr = trunkById(B.tid);
    const Pg = tr ? trunkGeom(tr, f, D) : {cx:0, cy:0, rx:1, ry:0.9};
    const g = {cx: Pg.cx + B.cc.x*Pg.rx, cy: Pg.cy + B.cc.y*Pg.ry, rx: B.rp*Pg.rx, ry: B.rp*Pg.ry};
    envs.push({id, g, alpha:1, kind:"bud", parent:B.tid, ref:{x:Pg.cx, y:Pg.cy}, w:B.w});
    for(const o of mine_of(B.tid, o => B.members.has(o.fa.id))){
      const q = B.pos[o.fa.id]; if(!q) continue;
      o.gx = Pg.cx + q.x*Pg.rx; o.gy = Pg.cy + q.y*Pg.ry; o.gr = q.r*Pg.rx; o.env = id;
    }
  }

  /* 4. detached buds drifting away */
  const postEnv = {};
  for(const fa of nerve().fasc){
    const X = exitInfo(fa);
    if(X.carried || f < X.E || f >= X.E + FADE) continue;
    const B = frozenBuds(X.E)[fa.id];
    if(!B) continue;
    const tr = trunkById(B.tid);
    const Pg = tr ? trunkGeom(tr, f, D) : {cx:0, cy:0, rx:1, ry:0.9};
    const u2 = (f - X.E)/FADE;
    const cc = {x: B.tc.x + B.dir.x*0.16*u2, y: B.tc.y + B.dir.y*0.16*u2};
    const sh = 1 - 0.40*u2;
    const g = {cx: Pg.cx + cc.x*Pg.rx, cy: Pg.cy + cc.y*Pg.ry, rx: B.rb*Pg.rx*sh, ry: B.rb*Pg.ry*sh};
    if(!postEnv[B.id]){ postEnv[B.id] = {id:B.id, g, alpha:1 - u2, kind:"bud", post:true, parent:B.tid, ref:{x:Pg.cx, y:Pg.cy}}; envs.push(postEnv[B.id]); }
    items.push({
      fa, g:B.g, tid:B.id, env:B.id, lab:B.lab, dash:B.dash, alpha:1 - u2, leaving:true,
      x:B.L.x, y:B.L.y, r:B.L.r, w:1, dest:null,
      gx: g.cx + B.L.x*g.rx, gy: g.cy + B.L.y*g.ry, gr: B.L.r*B.rb*Pg.rx*sh
    });
  }

  /* 5. the view: centred on the trunks, scaled so that everything (buds included) fits */
  let tx0 = Infinity, ty0 = Infinity, tx1 = -Infinity, ty1 = -Infinity;
  for(const e of envs){
    if(e.kind !== "trunk" || e.alpha < 0.999) continue;
    tx0 = Math.min(tx0, e.g.cx-e.g.rx); tx1 = Math.max(tx1, e.g.cx+e.g.rx); ty0 = Math.min(ty0, e.g.cy-e.g.ry); ty1 = Math.max(ty1, e.g.cy+e.g.ry);
  }
  if(!isFinite(tx0)){ tx0 = -1; tx1 = 1; ty0 = -0.9; ty1 = 0.9; }
  const mx = (tx0+tx1)/2, my = (ty0+ty1)/2;
  let hw = 0, hh = 0;
  for(const e of envs){
    let {cx, cy, rx, ry} = e.g;
    const a = e.alpha;
    if(a < 1 && e.ref){ cx = lerp(e.ref.x, cx, a); cy = lerp(e.ref.y, cy, a); rx *= a; ry *= a; }
    hw = Math.max(hw, Math.abs(cx-mx)+rx); hh = Math.max(hh, Math.abs(cy-my)+ry);
  }
  const MARG = 0.12;
  hw = Math.max(hw + MARG, 1.26); hh = Math.max(hh + MARG, 1.14);   // a fixed reserve for buds, so the view does not breathe at every branch
  const R = Math.min((CW/2 - 40)/hw, (CH/2 - 28)/hh, Math.min(CW,CH)*0.47);
  const view = {R, CX: CW/2 - mx*R, CY: CH/2 + 4 - my*R};

  const val = {envs, items, deform:D, view, mainG};
  layoutCache = {key:ck, val};
  return val;
}
/* ============================================================

   right limb, and a marker riding along it with the slider.
   Waypoints are [level, x, y]; "behind" marks the levels where the

   ============================================================ */
const BODY = {

function bodyPoint(f){
  const B = BODY[nerveKey]; if(!B) return null;

  return {x, y};
}
function renderBody(){
  const B = BODY[nerveKey];

  for(let i=0;i<B.pts.length-1;i++){

    const seg = `M${a[1]} ${a[2]} L${b[1]} ${b[2]} `;

}

function anchorAt(f){
  const A = ANCHORS[nerveKey]; if(!A) return null;
  for(const k in A){ if(Math.abs(f - Number(k)) <= 0.35) return Object.assign({lvl:Number(k)}, A[k]); }
  return null;
}
function anchorLevels(){ const A = ANCHORS[nerveKey]; return A ? Object.keys(A).map(Number) : []; }

/* ============================================================
   Sites
   ============================================================ */
function levelSites(){
  const i = Math.round(posF);
  const lv = nerve().levels[i];
  if(!lv || !lv.sites || !lv.sites.length) return [];
  if(Math.abs(posF - i) > 0.32) return [];
  return lv.sites.map(id => ({id, s:nerve().sites[id]})).filter(o => o.s);
}
function currentSite(){
  const ls = levelSites();
  if(!ls.length) return null;
  return ls[Math.min(siteIdx, ls.length-1)].s;
}

/* ============================================================
   Canvas
   ============================================================ */
const cv = $("#section"), ctx = cv.getContext("2d");
const ocv = document.createElement("canvas"), octx = ocv.getContext("2d");
let CW = 720, CH = 560, DPR = 1;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function sizeCanvas(){
  const rect = cv.parentElement.getBoundingClientRect();
  CW = Math.max(300, Math.floor(rect.width - 20));
  CH = Math.round(CW * 0.88);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = CW*DPR; cv.height = CH*DPR;
  cv.style.width = CW+"px"; cv.style.height = CH+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ocv.width = CW*DPR; ocv.height = CH*DPR;
  octx.setTransform(DPR,0,0,DPR,0,0);
  clearCaches();
}

/* the epineurial outline: a gently irregular ellipse, seeded per envelope so it never flickers */
function epiPath(c, seed, cx, cy, rx, ry){
  const N = 48;
  c.beginPath();
  for(let k=0;k<=N;k++){
    const a = (k/N)*Math.PI*2;
    const wob = 1 + 0.026*Math.sin(a*3 + seed) + 0.016*Math.sin(a*5 - seed*1.7);
    const x = cx + Math.cos(a)*rx*wob, y = cy + Math.sin(a)*ry*wob;
    if(k===0) c.moveTo(x,y); else c.lineTo(x,y);
  }
  c.closePath();
}
function envPath(c, e, V, inset){
  const seed = (hashStr(nerveKey + "|" + e.id) % 97) * 0.37;
  const cx = V.CX + e.g.cx*V.R, cy = V.CY + e.g.cy*V.R;
  const rx = Math.max(1, e.g.rx*V.R - (inset||0)), ry = Math.max(1, e.g.ry*V.R - (inset||0));
  epiPath(c, seed, cx, cy, rx, ry);
}

/* one outline for overlapping envelopes: stroke them all, then erase every
   interior — what remains is the boundary of their union */
function strokeUnion(list, V, rule, ruleS){
  if(!list.length) return;
  octx.save();
  octx.setTransform(DPR,0,0,DPR,0,0);
  octx.clearRect(0,0,CW,CH);
  const del = 0.6;
  octx.lineJoin = "round";
  for(const e of list){ envPath(octx, e, V); octx.lineWidth = 2*4.6; octx.strokeStyle = rule; octx.stroke(); }
  for(const e of list){ envPath(octx, e, V); octx.lineWidth = 2*(1.6 - del); octx.strokeStyle = ruleS; octx.stroke(); }
  octx.globalCompositeOperation = "destination-out";
  for(const e of list){ envPath(octx, e, V, del); octx.fill(); }
  octx.restore();
  ctx.drawImage(ocv, 0, 0, CW, CH);
}

function axisLabels(){
  return nerve().axes === "leg"
    ? {top:t("ant"), bottom:t("post"), right:t("lat"), left:t("med")}
    : {top:t("volar"), bottom:t("dorsal"), right:t("radial"), left:t("ulnar")};
}

function updateStageNote(){
  const A = anchorAt(posF);
  const D = pressDeform();
  const el = $("#stage-note");
  if(!el) return;
  const budding = layout(posF).envs.some(e => (e.kind === "bud" && !e.post) || e.window);
  el.textContent = t("sectionNote") + " "
    + (A ? t("mapNote") : (budding ? t("budNote") : t("schematicNote")))
    + (D.press ? " · " + t("pressNote") : "");
  el.style.color = A ? "var(--ink-2)" : "";
}

function envContainsHit(e, L2, site){
  return L2.items.some(o => (o.env === e.id) && site.hit.indexOf(o.g.id) >= 0);
}

function draw(){
  const ink=cssVar("--ink"), faint=cssVar("--faint"), rule=cssVar("--rule"),
        ruleS=cssVar("--rule-strong"), surface=cssVar("--surface"), crit=cssVar("--crit"),
        accent=cssVar("--accent"), surf2=cssVar("--surface-2");
  ctx.clearRect(0,0,CW,CH);
  const L2 = layout(posF);
  const V = L2.view;
  const {CX,CY,R} = V;
  const site = currentSite();
  const lesion = mode === "lesion" && site;
  const ax = axisLabels();

  /* orientation labels sit at the frame edges */
  ctx.save();
  ctx.font = "500 10px 'IBM Plex Mono', monospace";
  ctx.fillStyle = faint; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(ax.top, CW/2, 14);
  ctx.fillText(ax.bottom, CW/2, CH - 12);
  ctx.save(); ctx.translate(CW - 12, CH/2); ctx.rotate(Math.PI/2); ctx.fillText(ax.right,0,0); ctx.restore();
  ctx.save(); ctx.translate(12, CH/2); ctx.rotate(-Math.PI/2); ctx.fillText(ax.left,0,0); ctx.restore();
  ctx.restore();

  /* compressor, against the main envelope */
  if(lesion && L2.deform.press){
    const g = L2.mainG;
    const [px,py] = L2.deform.press;
    const cx = CX + g.cx*R, cy = CY + g.cy*R, rx = g.rx*R, ry = g.ry*R;
    ctx.save();
    ctx.fillStyle = surf2; ctx.strokeStyle = ruleS; ctx.lineWidth = 1.4;
    const bx = cx + px*(rx + R*0.17), by = cy + py*(ry + R*0.17);
    ctx.beginPath(); ctx.ellipse(bx, by, px?R*0.15:rx*0.95, py?R*0.15:ry*0.95, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke(); ctx.restore();
  }

  const envs = L2.envs.slice().sort((a,b) => (a.kind === "bud") - (b.kind === "bud"));
  const solid = envs.filter(e => e.alpha >= 0.999);
  const fading = envs.filter(e => e.alpha < 0.999);

  /* fills */
  for(const e of envs){
    ctx.save();
    ctx.globalAlpha = e.alpha;
    envPath(ctx, e, V);
    ctx.fillStyle = surface; ctx.fill();
    ctx.restore();
  }
  /* lesion hatching, clipped to the envelopes that contain the hit fascicles */
  if(lesion){
    for(const e of envs){
      if(!envContainsHit(e, L2, site)) continue;
      const cx = CX + e.g.cx*R, cy = CY + e.g.cy*R, rx = e.g.rx*R, ry = e.g.ry*R;
      ctx.save();
      envPath(ctx, e, V); ctx.clip();
      ctx.globalAlpha = 0.09*e.alpha; ctx.fillStyle = crit;
      ctx.fillRect(cx-rx*1.5, cy-ry*1.5, rx*3, ry*3);
      ctx.globalAlpha = 0.8*e.alpha; ctx.strokeStyle = crit; ctx.lineWidth = 1; ctx.setLineDash([3,5]);
      for(let k=-9;k<=9;k++){
        ctx.beginPath(); ctx.moveTo(cx-rx*1.5, cy+k*ry*0.19); ctx.lineTo(cx+rx*1.5, cy+k*ry*0.19); ctx.stroke();
      }
      ctx.restore();
    }
  }
  /* outlines: one merged outline for everything still attached, plain strokes for what has detached */
  strokeUnion(solid, V, rule, ruleS);
  for(const e of fading){
    ctx.save();
    ctx.globalAlpha = e.alpha;
    envPath(ctx, e, V);
    ctx.lineWidth = 6; ctx.strokeStyle = rule; ctx.stroke();
    ctx.lineWidth = 1.6; ctx.strokeStyle = ruleS; ctx.stroke();
    ctx.restore();
  }

  /* trunk names, once there is more than one trunk to tell apart */
  const nTrunk = envs.filter(e => e.kind === "trunk").length;
  if(nTrunk > 1){
    for(const e of envs){
      if(e.kind !== "trunk" || !e.label || !(e.labelAlpha > 0.02)) continue;
      const cx = CX + e.g.cx*R, cy = CY + e.g.cy*R, ry = e.g.ry*R;
      ctx.save();
      ctx.globalAlpha = e.labelAlpha;
      ctx.font = "500 10px 'IBM Plex Mono', monospace";
      ctx.textAlign = "center";
      const below = e.side !== undefined ? e.side : (e.g.cy > 0.02);
      const ly = below ? cy + ry + 9 : cy - ry - 9;
      ctx.textBaseline = below ? "top" : "bottom";
      const txt = L(e.label).toUpperCase();
      ctx.lineJoin = "round"; ctx.lineWidth = 4; ctx.strokeStyle = surface; ctx.strokeText(txt, cx, ly);
      ctx.fillStyle = accent; ctx.fillText(txt, cx, ly);
      ctx.restore();
    }
  }

  /* fascicles */
  const items = L2.items.slice().sort((a,b) => b.gr - a.gr);
  for(const o of items){
    const g = o.g;
    const gx = CX + o.gx*R, gy = CY + o.gy*R, gr = o.gr*R;
    if(!(gr > 0.5)) continue;
    const affected = lesion && site.hit.indexOf(g.id) >= 0;
    const dim = (focusGroup && focusGroup !== g.id) || (lesion && !affected);
    ctx.save();
    ctx.beginPath(); ctx.arc(gx,gy,gr,0,Math.PI*2);
    ctx.globalAlpha = o.alpha * (dim ? 0.08 : 0.40); ctx.fillStyle = g.color; ctx.fill();
    ctx.globalAlpha = o.alpha * (dim ? 0.24 : 1);
    ctx.lineWidth = (focusGroup===g.id || hoverGroup===g.id) ? 2.4 : 1.6;
    ctx.setLineDash(o.leaving ? [4,4] : (o.dash ? [3,3] : []));
    ctx.strokeStyle = affected ? crit : g.color; ctx.stroke(); ctx.setLineDash([]);

    if(!dim && o.lab && gr > R*0.030){
      ctx.globalAlpha = o.alpha;
      ctx.font = "600 9.5px 'IBM Plex Sans', sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      const w = ctx.measureText(o.lab).width;
      const out = w > gr*1.85;
      const ly = out ? (((items.indexOf(o)) % 2) ? gy + gr + 7 : gy - gr - 7) : gy;
      ctx.lineJoin = "round"; ctx.lineWidth = 3.5; ctx.strokeStyle = surface; ctx.strokeText(o.lab,gx,ly);
      ctx.fillStyle = ink; ctx.fillText(o.lab,gx,ly);
    }
    ctx.restore();
  }

  if(lesion){
    ctx.save();
    ctx.font = "500 10.5px 'IBM Plex Mono', monospace";
    ctx.fillStyle = crit; ctx.textAlign="left"; ctx.textBaseline="bottom";
    ctx.fillText("⌁ " + L(site.name).toUpperCase(), 12, CH-8);
    ctx.restore();
  }
}

function pick(mx,my){
  const L2 = layout(posF);
  const {CX,CY,R} = L2.view;
  let best=null, bestD=Infinity;
  for(const o of L2.items){
    const d = Math.hypot(mx-(CX+o.gx*R), my-(CY+o.gy*R));
    if(d < o.gr*R && d < bestD){ best = o.g.id; bestD = d; }
  }
  return best;
}
cv.addEventListener("pointermove", e => {
  const r = cv.getBoundingClientRect();
  const h = pick(e.clientX-r.left, e.clientY-r.top);
  if(h !== hoverGroup){ hoverGroup = h; cv.style.cursor = h ? "pointer" : "default"; draw(); }
});
cv.addEventListener("pointerleave", () => { hoverGroup = null; draw(); });
cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect();
  const h = pick(e.clientX-r.left, e.clientY-r.top);
  focusGroup = (h && h === focusGroup) ? null : h;
  renderLegend(); renderPanel(); draw();
});

function kindOf(g){ return g.kind==="m" ? {c:"kind-m", t:t("motor")} : g.kind==="s" ? {c:"kind-s", t:t("sensory")} : {c:"kind-x", t:t("mixed")}; }

function renderLegend(){
  const el = $("#legend"); el.innerHTML = "";
  nerve().groups.forEach(g => {
    const gone = !groupPresent(g.id, posF);
    const k = kindOf(g);
    const b = document.createElement("button");
    b.type="button"; b.className = "legend-row" + (gone ? " gone" : "");

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function quoteHtml(q){
  if(!q) return "";
  return '<blockquote class="bq">“'+esc(L(q.text))+'”<cite>'+esc(L(q.src))+'</cite></blockquote>';
}

function trunkLabelFor(id){
  const tr = trunksOf().find(x => x.id === id);
  return tr && tr.label ? L(tr.label) : null;
}

function inTrunkHtml(){
  const L2 = layout(posF);
  const byT = {};
  const seen = {};
  for(const o of L2.items){
    if(o.leaving) continue;
    const k2 = o.tid + "|" + o.g.id;
    if(seen[k2]) continue; seen[k2] = 1;
    (byT[o.tid] = byT[o.tid] || []).push(o.g);
  }
  const ids = Object.keys(byT);
  if(!ids.length) return '<span class="prose"><em>—</em></span>';
  if(ids.length === 1 && ids[0] === "main")
    return '<div class="pillrow">' + byT[ids[0]].map(g => '<span class="pill">'+esc(L(g.label))+'</span>').join("") + '</div>';
  return ids.map(id => {
    const lab = trunkLabelFor(id);
    return (lab ? '<div style="font:500 11px/1.5 var(--mono);color:var(--accent);margin:8px 0 5px">'+esc(lab)+'</div>' : '') +
      '<div class="pillrow">' + byT[id].map(g => '<span class="pill">'+esc(L(g.label))+'</span>').join("") + '</div>';
  }).join("");
}

  $("#panel-head").textContent = t("atThisLevel");
  const g = focusGroup ? nerve().groups.find(x => x.id === focusGroup) : null;
  let html = "";
  const FM = anchorAt(posF);
  if(FM){
    const cls = FM.conf==="high" ? "high" : FM.conf==="mod" ? "mod" : "low";
    const lab = FM.conf==="high" ? t("confHigh") : FM.conf==="mod" ? t("confMod") : t("confLow");
    html += '<div class="sect"><h3>'+esc(t("fascicleMap"))+' &nbsp;<span class="conf '+cls+'">'+esc(lab)+'</span></h3>' +
      '<p class="prose">'+esc(L(FM.note))+'</p>' +
      '<dl class="kv" style="margin-top:10px">' +
      '<dt>'+esc(t("mapSource"))+'</dt><dd>'+esc(L(FM.src))+'</dd>' +
      '<dt>'+esc(t("mapCount"))+'</dt><dd>'+layout(posF).items.filter(o=>o.tid==="main"&&!o.leaving).length+'</dd>' +
      '</dl></div><div class="rule"></div>';
  }
  if(g){
    const mine = layout(posF).items.filter(o => o.g.id === g.id && !o.leaving);
    const p = mine.length ? {
      x: mine.reduce((s,o)=>s+o.x,0)/mine.length,
      y: mine.reduce((s,o)=>s+o.y,0)/mine.length
    } : null;
    const tl = mine.length ? trunkLabelFor(mine[0].tid) : null;
    const nf = mine.length;
    html += '<div class="sect"><h3><span class="swatch" style="display:inline-block;vertical-align:-1px;background:'+g.color+'"></span>&nbsp; '+esc(L(g.label))+'</h3>' +
      '<dl class="kv">' +
      '<dt>'+esc(t("supplies"))+'</dt><dd>'+esc(L(g.supplies))+'</dd>' +
      (tl ? '<dt>'+esc(t("travelsIn"))+'</dt><dd>'+esc(tl)+'</dd>' : '') +
      '<dt>'+esc(t("exitsAt"))+'</dt><dd>'+esc(nerve().levels[g.exit].code)+' — '+esc(L(nerve().levels[g.exit].name))+'</dd>' +
      '<dt>'+esc(t("position"))+'</dt><dd>'+(p ? describePos(p) : "—")+'</dd>' +
      (nf ? '<dt>'+esc(t("mapCount"))+'</dt><dd>'+nf+'</dd>' : '') +
      '</dl></div>';
    if(g.sub){
      html += '<div class="sect"><h3>'+esc(t("branchChain"))+'</h3><ol class="chain">' +
        L(g.sub).map(s => '<li>'+esc(s)+'</li>').join("") + '</ol></div>';
    }
    html += '<div class="rule"></div><div class="sect"><h3>'+esc(t("clinicalNote"))+'</h3><p class="prose">'+esc(L(g.note))+'</p>' + quoteHtml(g.quote) + '</div><div class="rule"></div>';
  } else {
    html += '<p class="prose"><em>'+esc(t("pickFascicle"))+'</em></p>' +
      '<div class="sect"><h3>'+esc(L(nerve().name))+'</h3><p class="prose">'+esc(L(nerve().blurb))+'</p></div><div class="rule"></div>';
  }
  html += '<div class="sect"><h3>'+esc(t("inTrunk"))+'</h3>' + inTrunkHtml() + '</div>';
  html += '<div class="sect"><h3>'+esc(t("alreadyLeft"))+'</h3><div class="pillrow">' +
    (gone.length ? gone.map(x => '<span class="pill gone">'+esc(L(x.label))+'</span>').join("") : '<span class="prose"><em>'+esc(t("none"))+'</em></span>') + '</div></div>';
  el.innerHTML = html;
}

function describePos(p){
  const leg = nerve().axes === "leg";
  const ns = p.y < -0.12 ? (leg?{en:"anterior",fr:"antérieure"}:{en:"volar",fr:"volaire"})
           : p.y > 0.12 ? (leg?{en:"posterior",fr:"postérieure"}:{en:"dorsal",fr:"dorsale"})
           : {en:"central",fr:"centrale"};
  const ew = p.x > 0.12 ? (leg?{en:"lateral",fr:"latérale"}:{en:"radial",fr:"radiale"})
           : p.x < -0.12 ? (leg?{en:"medial",fr:"médiale"}:{en:"ulnar",fr:"ulnaire"})
           : {en:"mid",fr:"médiane"};
  const depth = Math.hypot(p.x,p.y) > 0.42 ? {en:"superficial",fr:"superficielle"} : {en:"deep",fr:"profonde"};
  return esc(L(ew)+" · "+L(ns)+" · "+L(depth));
}

/* ============================================================
   Interchangeable fascicles (same group, label, dash, exit and route)
   may swap their authored slots in a daughter trunk so that each one
   takes the nearest slot at the division — the section is identical,
   the transition no longer crosses. Run once per nerve at load.
   ============================================================ */
function optimizeSwitches(){
  const perms = n => { const out = []; const rec = (arr, rest) => { if(!rest.length){ out.push(arr); return; } rest.forEach((v,i) => rec(arr.concat(v), rest.slice(0,i).concat(rest.slice(i+1)))); }; rec([], [...Array(n).keys()]); return out; };
  for(const nk in NERVES){
    const N = NERVES[nk];
    const trunks = N.trunks || DEFAULT_TRUNKS;
    const geom = (id, f) => { const tr = trunks.find(t => t.id === id); const [cx,cy,r] = keyAt(tr.key, f); const ar = id === "main" ? (N.shape ? keyAt(N.shape, f)[0] : 0.9) : (tr.ar || 0.86); return {cx, cy, rx:r, ry:r*ar}; };
    const sig = (fa, S) => [fa.g, fa.dash?1:0, fa.from||0, fa.exit, JSON.stringify(fa.trunk||[]), JSON.stringify(Array.isArray(fa.lab) ? fa.lab.filter(r => r[0] >= S-0.001) : fa.lab)].join("|");
    const levels = new Set();
    for(const fa of N.fasc) for(const r of (fa.trunk||[])) if(r[0] > 0) levels.add(r[0]);
    for(const S of levels){
      const groups = {};
      for(const fa of N.fasc){
        const m = fa.trunk || [];
        const row = m.find(r => Math.abs(r[0]-S) < 0.01);
        if(!row) continue;
        (groups[sig(fa,S) + "|" + row[1]] = groups[sig(fa,S) + "|" + row[1]] || []).push({fa, child:row[1], parent: m[m.indexOf(row)-1][1]});
      }
      for(const k in groups){
        const G = groups[k];
        if(G.length < 2 || G.length > 6) continue;
        const Pg = geom(G[0].parent, S - 0.5), Cg = geom(G[0].child, S);
        const before = G.map(o => { const K = o.fa.key.filter(r => r[0] < S - 0.001); const [x,y] = keyAt(K.length ? K : o.fa.key, S - 0.001); return {x: Pg.cx + x*Pg.rx, y: Pg.cy + y*Pg.ry}; });
        const after = G.map(o => { const K = o.fa.key.filter(r => r[0] >= S - 0.001); if(!K.length) return null; const [x,y] = keyAt(K, S); return {x: Cg.cx + x*Cg.rx, y: Cg.cy + y*Cg.ry}; });
        if(after.some(a => !a)) continue;
        const cross = (p1,p2,p3,p4) => { const d = (a,b,c) => (b.x-a.x)*(c.y-a.y) - (b.y-a.y)*(c.x-a.x); return (d(p1,p2,p3)*d(p1,p2,p4) < 0) && (d(p3,p4,p1)*d(p3,p4,p2) < 0); };
        let best = null, bestC = Infinity;
        for(const pm of perms(G.length)){
          let c = 0;
          for(let i=0;i<G.length;i++){ const a = after[pm[i]]; c += (a.x-before[i].x)**2 + (a.y-before[i].y)**2; }
          // paths that cross each other cost extra: the fascicles would pass through one another
          for(let i=0;i<G.length;i++) for(let j=i+1;j<G.length;j++) if(cross(before[i], after[pm[i]], before[j], after[pm[j]])) c += 0.25;
          if(c < bestC - 1e-9){ bestC = c; best = pm; }
        }
        if(!best || best.every((v,i) => v === i)) continue;
        const tails = G.map(o => o.fa.key.filter(r => r[0] >= S - 0.001));
        G.forEach((o,i) => { o.fa.key = o.fa.key.filter(r => r[0] < S - 0.001).concat(tails[best[i]]); });
      }
    }
  }
}

function start(){
  optimizeSwitches();
  applyStatic(); renderNerveTabs(); renderTrack(); sizeCanvas(); setPos(3); renderEvidence();
}
start();
</script>
