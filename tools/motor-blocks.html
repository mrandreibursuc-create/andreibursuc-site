<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motor Block Territory Explorer — upper & lower limb</title>
<style>
  :root{
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
    --ink:#1c2530; --ink-soft:#67717f; --line:#e3e8ee; --bg:#f6f8fa;
    --complete:#c0392b; --partial:#d98a1f;
    /* upper limb */
    --mcn:#b8332a; --ax:#7d5ba6; --med:#2566a8; --rad:#2c8a5f; --uln:#c2761a; --prox:#475569;
    /* lower limb */
    --fem:#2566a8; --obt:#0e8f8a; --tib:#1f7a4d; --fib:#7d5ba6; --glut:#556072; --proxl:#8a8f98;
    --cmpA:#2563eb; --cmpB:#9333ea; --cmpBoth:#0f766e;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
  header{padding:12px 18px 10px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
  .toprow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .ttl{font-weight:750;font-size:17px;letter-spacing:-.01em}
  .ttl span{font-weight:450;color:var(--ink-soft);font-family:var(--mono);font-size:11.5px;margin-left:8px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .seg button{font:inherit;font-size:12.5px;font-weight:650;padding:6px 13px;border:0;background:#fff;color:var(--ink-soft);cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:#1c2530;color:#fff}
  .sub{color:var(--ink-soft);font-size:12px;margin-top:4px;max-width:960px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}
  .search{position:relative}
  .search input{font:inherit;font-size:13px;padding:7px 28px 7px 11px;border:1px solid var(--line);border-radius:9px;width:250px;background:#fff;outline:none}
  .search input:focus{border-color:#9bb6d6;box-shadow:0 0 0 3px #e7f0fb}
  .search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink-soft);font-size:16px;cursor:pointer;display:none}
  .ghost{font:inherit;font-size:12.5px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;color:var(--ink)}
  .ghost:hover{border-color:#b9c4d1}
  .ghost.active{background:#1c2530;color:#fff;border-color:#1c2530}
  .lang{font-weight:700;border-color:#2566a8;color:#2566a8;background:#eef5fc}
  .lang:hover{background:#e1ecf9;border-color:#1d5390}
  .legend{display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin-left:auto;font-size:11.5px;color:var(--ink-soft)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  .legend i.dash{border:1.5px dashed #5b8a8a;background:#f6f9fb}

  main{display:grid;grid-template-columns:1fr 372px;gap:0;align-items:start}
  @media (max-width:980px){ main{grid-template-columns:1fr} .panelwrap{position:static!important;border-left:0!important;border-top:1px solid var(--line)} }
  .diagramwrap{overflow:auto;max-height:calc(100vh - var(--hdr,128px));padding:12px 6px 60px 12px;
    background:#fbfcfd;
    background-image:radial-gradient(#ecedf1 1px, transparent 1px);
    background-size:22px 22px}
  svg.tree{display:block;font-family:var(--sans);transition:height .35s ease,width .35s ease}

  .panelwrap{position:sticky;top:var(--hdr,128px);max-height:calc(100vh - var(--hdr,128px));overflow:auto;border-left:1px solid var(--line);background:#fff;padding:16px 16px 40px}
  .ph{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft)}
  .blockpoint{margin:6px 0 2px;font-weight:750;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
  .blockmeta{color:var(--ink-soft);font-size:12px;margin-bottom:12px}
  .countrow{display:flex;gap:8px;margin:10px 0 6px;flex-wrap:wrap}
  .pill{font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:20px}
  .pill.c{background:#fbe9e7;color:var(--complete)}
  .pill.p{background:#fcf1df;color:var(--partial)}
  .pill.a{background:#e6effd;color:var(--cmpA)}
  .pill.b{background:#f3e8fd;color:var(--cmpB)}
  .pill.both{background:#ddf5f1;color:var(--cmpBoth)}
  .grp{margin:12px 0 0}
  .grp h4{margin:0 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
  .grp h4 .nv{width:9px;height:9px;border-radius:50%;display:inline-block}
  ul.musc{list-style:none;margin:0;padding:0}
  ul.musc li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed #eef1f5;font-size:13px}
  ul.musc li>span:first-child{overflow-wrap:anywhere}
  ul.musc li .lv{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);white-space:nowrap}
  ul.musc li.part{color:var(--partial)}
  ul.sens li{font-size:12.5px;color:#3f6b6b;flex-direction:column;align-items:flex-start;gap:1px}
  ul.sens li .terr{color:var(--ink-soft);font-size:11px}
  .caveat{margin-top:14px;font-size:11.5px;color:var(--ink-soft);background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:9px 11px;line-height:1.5}
  .pathline{font-size:12.5px;line-height:1.8;margin:6px 0}
  .pathline b{font-weight:700}
  .chip{display:inline-block;font-family:var(--mono);font-size:11px;background:#eef2f7;border-radius:5px;padding:1px 6px;margin:1px 2px}
  .empty{color:var(--ink-soft);font-size:13px;margin-top:30px;text-align:center;line-height:1.6}

  .node{cursor:pointer;transition:transform .38s cubic-bezier(.2,.7,.2,1),opacity .25s}
  .node rect{transition:fill .12s,stroke .12s,opacity .12s}
  .node text{pointer-events:none}
  .nlabel{font-size:11.5px;font-weight:650;dominant-baseline:middle}
  .nlabel.sens{font-style:italic;font-weight:500}
  .nlv{font-family:var(--mono);font-size:8.5px;fill:#8a95a3}
  svg.dimmed .node:not(.on) rect{opacity:.26}
  svg.dimmed .node:not(.on) text{opacity:.30}
  svg.dimmed .edge{opacity:.12}
  svg.dimmed .edge.eon{opacity:.95}
  .node.block rect{stroke-width:3 !important}
  svg.tree:not(.dimmed) .node.peek rect:first-of-type{fill:#fff4d9 !important;stroke-width:2.2}
  svg.tree:not(.dimmed) .node.peek.peekhead rect:first-of-type{fill:#ffe9b0 !important}
  .edge{fill:none;stroke:#a6b2bf;stroke-width:1.6}
  .edge.sec{stroke:#bdc6d1;stroke-dasharray:4 4;stroke-width:1.3}
  .edge.sens{stroke:#a1c0c0;stroke-dasharray:2 3;stroke-width:1.2}
  .edge.eon{stroke:#c0392b;stroke-width:2.4}
  @media print{ header .bar,.seg{display:none} .diagramwrap{max-height:none;overflow:visible} .panelwrap{position:static;max-height:none} }
</style>
</head>
<body>
<header>
  <div class="toprow">
    <div class="ttl"><span id="ttlMain"></span> <span id="ttlSub"></span></div>
    <div class="seg" id="limbSeg"><button data-limb="upper"></button><button data-limb="lower"></button></div>
  </div>
  <div class="sub" id="subTxt"></div>
  <div class="bar">
    <div class="search"><input id="q" type="search" autocomplete="off"><button class="x" id="qx">×</button></div>
    <button class="ghost" id="reset"></button>
    <button class="ghost" id="compactBtn"></button>
    <button class="ghost" id="sensBtn"></button>
    <button class="ghost" id="cmpBtn"></button>
    <button class="ghost lang" id="langBtn"></button>
    <button class="ghost" id="printbtn"></button>
    <div class="legend" id="legend"></div>
  </div>
</header>

<main>
  <div class="diagramwrap"><svg class="tree" id="tree" role="img" aria-label="Plexus block diagram"></svg></div>
  <aside class="panelwrap"><div id="panel"></div></aside>
</main>

  const acr=(short.match(/[A-Z0-9]{2,}/g)||[]).filter(t=>(t.match(/[A-Z]/g)||[]).length>=2&&!full.includes(t));
  return acr.length?`${full} (${acr.join(" / ")})`:full;

function loadDataset(key){
  limb=key; const D=LIMB[key];
  NODES=D.NODES; KIDS=D.KIDS; ROOTS=D.ROOTS; SEC=D.SEC; EDGELV=D.EDGELV; C=D.C;
  NVNAME=D.NVNAME; LEGTXT=D.LEGTXT; NVORDER=D.NVORDER; PROXTYPES=D.proximalTypes;
  ADJ={}; PARENTS={};
  const addEdge=(a,b,lv,sec)=>{(ADJ[a]=ADJ[a]||[]).push([b,lv]); (PARENTS[b]=PARENTS[b]||[]).push([a,sec]);};
  Object.keys(KIDS).forEach(a=>KIDS[a].forEach(b=>addEdge(a,b,EDGELV[a+">"+b]||"*",false)));
  SEC.forEach(([a,b,lv])=>addEdge(a,b,lv,true));

/* =====================================================================
   ENGINE  (dominator logic on the level-tagged DAG)
   ===================================================================== */
function findPath(r,t){
  const stack=[[r,[r]]], seen=new Set();
  while(stack.length){
    const [n,path]=stack.pop();
    if(n===t) return path;
    if(seen.has(n)) continue; seen.add(n);
    (ADJ[n]||[]).forEach(([to,lv])=>{ if(lv==="*"||lv.includes(r)) stack.push([to,path.concat(to)]); });
  }
  return null;
}
function affectedRoots(N,m){ const out=[]; (NODES[m].myo||[]).forEach(r=>{const p=findPath(r,m); if(p&&p.includes(N)) out.push(r);}); return out; }
function classify(N){
  const complete=[],partial=[];
  MUSCLES.forEach(m=>{ const a=affectedRoots(N,m); if(!a.length) return;
    ((NODES[m].myo||[]).every(r=>a.includes(r))?complete:partial).push({id:m,roots:a}); });
  return {complete,partial};
}
function affectedSet(N){ const {complete,partial}=classify(N); return new Set(complete.concat(partial).map(o=>o.id)); }
function affectedSensory(N){
  const out=[],seen=new Set(),st=[N];
  while(st.length){ const n=st.pop(); if(seen.has(n))continue; seen.add(n);
    (ADJ[n]||[]).forEach(([to])=>{ if(NODES[to].t==="sensory") out.push(to); st.push(to); }); }
  return [...new Set(out)];
}
function lineage(m){ const s=new Set(); (NODES[m].myo||[]).forEach(r=>{const p=findPath(r,m); if(p)p.forEach(x=>s.add(x));}); return s; }
/* every node on a root→muscle path that passes through N (+ the edges) */
function involvement(N){
  const nodes=new Set([N]), edges=new Set();
  const {complete,partial}=classify(N);
  complete.concat(partial).forEach(({id:mid,roots})=>{
    roots.forEach(r=>{const p=findPath(r,mid); if(p&&p.includes(N)){for(let i=0;i<p.length;i++){nodes.add(p[i]); if(i<p.length-1)edges.add(p[i]+">"+p[i+1]);}}});
  });
  return {nodes,edges,complete,partial};
}

const svg=document.getElementById("tree");
const kidsOf=id=>(KIDS[id]||[]).filter(k=>SHOW_SENSORY||NODES[k].t!=="sensory");
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function cssvar(c){return c?(getComputedStyle(document.documentElement).getPropertyValue(c.replace(/var\(|\)/g,'').trim())||c).trim():c;}
function colorOf(id){const n=NODES[id];return n.c?cssvar(C[n.c]):"#475569";}
function baseFill(id){const t=NODES[id].t; return t==="root"?"#475569":(t==="sensory"?"#f6f9fb":((t==="plexus"||t==="trunk"&&limb==="lower")?"#eef1f5":"#ffffff"));}
const POS={}; const NW={};
function nodeW(id){
  const n=NODES[id], base=(L(id)||"").length*6.6;
  let w = n.t==="root" ? base+18 : base+16;
  if(n.myo) w = base + 21 + n.myo.join("·").length*5.2;
  return Math.min(320, Math.max(60, w));
}
/* Build a tree for layout. F = set of visible nodes (null = all). In focus mode a node
   whose primary parent is hidden hangs from any visible parent (primary or secondary). */
function layout(F){
  for(const k in POS) delete POS[k];
  const vis=id=>!F||F.has(id);
  const CH={}; const placedAsChild=new Set();
  const order=ALL.slice();
  if(F){
    order.forEach(id=>{ if(!vis(id)||NODES[id].t==="root") return;
      const ps=(PARENTS[id]||[]).filter(([p])=>vis(p));
      if(!ps.length) return;
      const prim=ps.find(([p,sec])=>!sec)||ps[0];
      (CH[prim[0]]=CH[prim[0]]||[]).push(id); placedAsChild.add(id);
    });
    // keep original sibling order
    Object.keys(CH).forEach(p=>{ const ord=(KIDS[p]||[]); CH[p].sort((a,b)=>{const ia=ord.indexOf(a),ib=ord.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib);}); });
  }else{
    order.forEach(id=>{ CH[id]=kidsOf(id); });
  }
  const rowH=30; let leaf=0;
  const place=(id,depth)=>{ const kids=CH[id]||[]; POS[id]={depth,w:NW[id]};
    if(kids.length){ kids.forEach(k=>place(k,depth+1)); POS[id].y=(POS[kids[0]].y+POS[kids[kids.length-1]].y)/2; }
    else { POS[id].y=leaf*rowH+rowH/2; leaf++; } };
  const tops=F?order.filter(id=>vis(id)&&!placedAsChild.has(id)):ROOTS.slice();
  // roots first in canonical order, then any orphans
  tops.sort((a,b)=>{const ia=ROOTS.indexOf(a),ib=ROOTS.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib);});
  tops.forEach(r=>place(r,0));
  const maxD=Math.max(0,...Object.values(POS).map(p=>p.depth));
  const colX=[]; let acc=8; const gap=34;
  for(let d=0;d<=maxD;d++){ const w=Math.max(...Object.keys(POS).filter(id=>POS[id].depth===d).map(id=>POS[id].w),60); colX[d]=acc; acc+=w+gap; }
  Object.keys(POS).forEach(id=>POS[id].x=colX[POS[id].depth]);
  return {W:acc, H:Math.max(1,leaf)*rowH+10};
}
const NODEEL={};
function buildNodes(){
  svg.innerHTML=`<defs><filter id="sh" x="-20%" y="-45%" width="140%" height="190%"><feDropShadow dx="0" dy="1" stdDeviation="1.05" flood-color="#243049" flood-opacity="0.16"/></filter></defs><g id="edges"></g><g id="nodes"></g>`;
  const ng=svg.querySelector("#nodes");
  for(const k in NODEEL) delete NODEEL[k];
  for(const k in NW) delete NW[k];
  let html="";
  ALL.forEach(id=>{ NW[id]=nodeW(id); html+=nodeSVG(id); });
  ng.innerHTML=html;
  ng.querySelectorAll(".node").forEach(g=>{
    NODEEL[g.dataset.id]=g;
    g.addEventListener("click",e=>{e.stopPropagation();onClick(g.dataset.id);});
    g.addEventListener("mouseenter",()=>peek(g.dataset.id));
    g.addEventListener("mouseleave",unpeek);
  });
}
let currentF=null;
function render(F){
  currentF=F||null;
  const {W,H}=layout(F); const PX=18,PT=10,PB=16; const w=Math.round(W),h=Math.round(H);
  svg.setAttribute("viewBox",`${-PX} ${-PT} ${w+PX*2} ${h+PT+PB}`);
  svg.setAttribute("width",w+PX*2); svg.setAttribute("height",h+PT+PB);
  let edges="";
  Object.keys(KIDS).forEach(a=>kidsOf(a).forEach(b=>{ if(POS[a]&&POS[b]) edges+=edgePath(a,b,NODES[b].t==="sensory"?"sens":false); }));
  SEC.forEach(([a,b])=>{ if(POS[a]&&POS[b]&&(SHOW_SENSORY||NODES[b].t!=="sensory")) edges+=edgePath(a,b,"secm"); });
  svg.querySelector("#edges").innerHTML=edges;
  ALL.forEach(id=>{ const g=NODEEL[id], p=POS[id];
    if(p){ g.style.display=""; g.setAttribute("transform",`translate(${p.x},${p.y})`); }
    else g.style.display="none"; });
}
svg.addEventListener("click",()=>{ if(sel||slotA||slotB){ resetSel(); } });
function edgePath(a,b,kind){ const pa=POS[a],pb=POS[b]; if(!pa||!pb)return "";
  const x1=pa.x+pa.w,y1=pa.y,x2=pb.x,y2=pb.y,mx=(x1+x2)/2;
  const cls= kind==="sens"?"edge sens": kind==="secm"?"edge sec":"edge";
  return `<path class="${cls}" data-a="${a}" data-b="${b}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
}
function nodeSVG(id){
  const n=NODES[id],col=colorOf(id),h=22,y=-h/2,w=NW[id];
  const sens=n.t==="sensory";
  const fill=baseFill(id);
  const sw=n.t==="nerve"?1.9:(n.t==="root"?0:1.2);
  const sop=n.t==="root"?1:(n.t==="nerve"?0.9:(sens?0.7:0.55));
  const dash=sens?` stroke-dasharray="3 3"`:"";
  const barW=n.t==="nerve"?4.5:(n.t==="muscle"?3:3.5);
  const tcol=n.t==="root"?"#fff":col;
  const lc=sens?"nlabel sens":"nlabel";
  let label=`<text class="${lc}" x="9" y="0" fill="${tcol}">${esc(L(id))}</text>`;
  if(n.myo) label=`<text class="${lc}" x="9" y="0" fill="${tcol}">${esc(L(id))}<tspan class="nlv" dx="5">${n.myo.join("·")}</tspan></text>`;
  const title=`${esc(L(id))}${n.myo?" · "+n.myo.join(","):""}${sens?" · "+esc(TERR(id)):""}`;
  return `<g class="node" data-id="${id}" data-t="${n.t}" transform="translate(0,0)">`+
    `<rect x="0" y="${y}" width="${w}" height="${h}" rx="6" fill="${fill}" stroke="${col}" stroke-width="${sw}" stroke-opacity="${sop}"${dash} filter="url(#sh)"/>`+
    `<rect x="0" y="${y}" width="${barW}" height="${h}" rx="2" fill="${col}"/>`+
    label+`<title>${title}</title></g>`;
}

  });

}
function resetSel(){ sel=null; slotA=null; slotB=null; clearHL(); if(currentF) render(null); if(cmpMode) showCmpPrompt(); else showEmpty(); }
function markOn(id){const g=NODEEL[id]; if(g)g.classList.add("on");}
function markEdge(a,b){const e=svg.querySelector(`.edge[data-a="${a}"][data-b="${b}"]`); if(e)e.classList.add("eon");}
function paintNode(id,fill,stroke,whiteText){const g=NODEEL[id]; if(!g)return; g.classList.add("on");
  const r=g.querySelector("rect"); if(fill)r.setAttribute("fill",fill); if(stroke){r.setAttribute("stroke",stroke);r.setAttribute("stroke-opacity",1);}
  if(whiteText){const lab=g.querySelector(".nlabel"); if(lab)lab.setAttribute("fill","#fff");}}

function peek(id){ if(sel||cmpMode)return;
  const node=NODES[id],g=NODEEL[id]; if(g)g.classList.add("peek","peekhead");
  let ids=[]; if(node.t==="muscle")ids=[...lineage(id)];
  else if(node.t==="sensory")ids=[id];
  else { const {complete,partial}=classify(id); ids=complete.concat(partial).map(o=>o.id); if(SHOW_SENSORY)ids=ids.concat(affectedSensory(id)); }
  ids.forEach(x=>{const gg=NODEEL[x]; if(gg)gg.classList.add("peek");});
}

function onClick(id){
  if(cmpMode){ compareClick(id); return; }
  if(sel===id){ sel=null; clearHL(); if(currentF) render(null); showEmpty(); return; }
  sel=id; clearHL(); applySingle(id);
}
/* re-layout to the involved subgraph (compact) or to the full tree (dimmed) */
function focusLayout(F){

  else if(currentF){ render(null); }
}
function applySingle(id){
  const node=NODES[id];

  else if(node.t==="sensory"){ F=new Set([id]); }
  else { inv=involvement(id); F=new Set(inv.nodes); if(SHOW_SENSORY){ affectedSensory(id).forEach(s=>{F.add(s); pathToSensory(id,s).forEach(x=>F.add(x));}); } }
  focusLayout(F);
  svg.classList.add("dimmed");
  const g=NODEEL[id]; g.classList.add("on","block");
  if(node.t==="muscle"){ showMuscle(id); return; }

  const {complete,partial}=inv;
  inv.nodes.forEach(markOn); inv.edges.forEach(e=>{const [a,b]=e.split(">"); markEdge(a,b);});
  complete.forEach(o=>paintNode(o.id,cssvar("var(--complete)"),cssvar("var(--complete)"),true));
  partial.forEach(o=>paintNode(o.id,"#fcf1df",cssvar("var(--partial)"),false));
  let sens=[];
  if(SHOW_SENSORY){ sens=affectedSensory(id); sens.forEach(s=>{ const p=pathToSensory(id,s); for(let i=0;i<p.length;i++){markOn(p[i]); if(i<p.length-1)markEdge(p[i],p[i+1]);} paintNode(s,"#e2efef",cssvar(C[NODES[s].c]),false);}); }
  showPanel(id,complete,partial,sens);
}
/* forward path N → sensory leaf (any levels) */
function pathToSensory(N,s){
  const st=[[N,[N]]], seen=new Set();
  while(st.length){ const [n,p]=st.pop(); if(n===s) return p; if(seen.has(n))continue; seen.add(n);
    (ADJ[n]||[]).forEach(([to])=>st.push([to,p.concat(to)])); }
  return [N,s];
}
function grpByNerve(arr){const by={}; arr.forEach(o=>{const c=NODES[o.id].c||"prox";(by[c]=by[c]||[]).push(o);}); return by;}
function muscleLi(o,part){const n=NODES[o.id]; const keep=part?` · ${T("keeps")} ${n.myo.filter(r=>!o.roots.includes(r)).join("/")}`:"";
  return `<li class="${part?'part':''}"><span>${esc(LONG(o.id))}</span><span class="lv">${n.myo.join(" ")}${keep}</span></li>`;}
function nerveGroups(arr,part){const by=grpByNerve(arr); let h="";
  NVORDER.forEach(c=>{ if(!by[c])return; h+=`<div class="grp"><h4><span class="nv" style="background:${cssvar(C[c])}"></span>${NVNAME[lang][c]}</h4><ul class="musc">${by[c].map(o=>muscleLi(o,part)).join("")}</ul></div>`; });
  return h;}
function sensoryGroup(sens){ if(!sens.length)return "";
  return `<div class="ph" style="margin-top:16px">${T("sensoryTerr")}</div><ul class="musc sens">`+
    sens.map(s=>`<li><span>${esc(L(s))}</span><span class="terr">${esc(TERR(s))}</span></li>`).join("")+`</ul>`;}
function typeLabel(t){return {root:T("typeRoot"),trunk:T("typeTrunk"),cord:T("typeCord"),plexus:T("typePlexus"),division:T("typeDivision"),nerve:T("typeNerve"),branch:T("typeBranch"),sensory:T("typeSensory")}[t]||"";}
function compactNote(){ return COMPACT?`<div class="caveat">${T("compactNote")}</div>`:""; }
function showPanel(id,complete,partial,sens){
  const n=NODES[id], proximal=PROXTYPES.includes(n.t);
  let h=`<div class="ph">${T("blockPoint")}</div><div class="blockpoint">${esc(LONG(id))}</div><div class="blockmeta">${typeLabel(n.t)}</div>`+
    `<div class="countrow"><span class="pill c">${complete.length} ${T("complete")}</span>${partial.length?`<span class="pill p">${partial.length} ${T("partial")}</span>`:""}</div>`;
  if(complete.length) h+=`<div class="ph" style="margin-top:14px">${T("completelyDen")}</div>`+nerveGroups(complete,false);
  if(partial.length) h+=`<div class="ph" style="margin-top:16px">${T("partiallyAff")}</div>`+nerveGroups(partial,true);
  if(!complete.length&&!partial.length) h+=`<p class="empty">${T("noDistal")}</p>`;
  if(SHOW_SENSORY) h+=sensoryGroup(sens);
  if(proximal) h+=`<div class="caveat">${T("proximalCaveat")}</div>`;
  h+=compactNote();
  panel.innerHTML=h;
}
function showMuscle(id){
  const n=NODES[id], ln=lineage(id); ln.forEach(markOn);
  (n.myo||[]).forEach(r=>{const p=findPath(r,id); if(p)for(let i=0;i<p.length-1;i++)markEdge(p[i],p[i+1]);});
  paintNode(id,cssvar("var(--complete)"),cssvar("var(--complete)"),true);
  let longest=[]; (n.myo||[]).forEach(r=>{const p=findPath(r,id); if(p&&p.length>longest.length)longest=p;});
  const chips=longest.map(x=>`<span class="chip">${esc(L(x))}</span>`).join(" <b>→</b> ");
  panel.innerHTML=`<div class="ph">${T("targetMuscle")}</div><div class="blockpoint">${esc(LONG(id))}</div>`+
    `<div class="blockmeta">${NVNAME[lang][n.c]} · ${T("myotome")} ${n.myo.join("–")}</div>`+
    `<div class="ph" style="margin-top:14px">${T("toBlockOnly")}</div><div class="pathline">${chips}</div>`+
    `<div class="caveat">${T("onlyBranchNote").replace("{m}",esc(LONG(id)))}</div>`+compactNote();
}
function showSensoryNode(id){
  const n=NODES[id];
  panel.innerHTML=`<div class="ph">${typeLabel("sensory")}</div><div class="blockpoint">${esc(LONG(id))}</div>`+
    `<div class="blockmeta">${NVNAME[lang][n.c]}</div>`+
    `<div class="ph" style="margin-top:14px">${T("territory")}</div><div class="pathline">${esc(TERR(id))}</div>`+
    `<div class="caveat">${T("sensoryNodeMsg")}</div>`;
}
function showEmpty(){ panel.innerHTML=`<div class="empty">${T("emptyMsg")}</div>`; }

/* compare */
function showCmpPrompt(){ panel.innerHTML=`<div class="empty">${slotA?T("cmpPickB"):T("cmpPrompt")}</div>`; }
function compareClick(id){
  if(NODES[id].t==="sensory"){ return; }
  if(!slotA){ slotA=id; clearHL(); applyCompare(); }
  else if(!slotB){ if(id===slotA){ slotA=null; clearHL(); if(currentF)render(null); showCmpPrompt(); return;} slotB=id; clearHL(); applyCompare(); }
  else { slotA=id; slotB=null; clearHL(); applyCompare(); }
}
function slotNodes(N){ if(!N)return new Set(); if(NODES[N].t==="muscle")return lineage(N); return involvement(N).nodes; }
function applyCompare(){
  const sa=slotA?affectedSet(slotA):new Set(), sb=slotB?affectedSet(slotB):new Set();
  if(slotA&&NODES[slotA].t==="muscle") sa.add(slotA); if(slotB&&NODES[slotB].t==="muscle") sb.add(slotB);
  const F=new Set([...slotNodes(slotA),...slotNodes(slotB)]);
  focusLayout(F);
  if(!(COMPACT&&F.size)) svg.classList.add("dimmed");
  F.forEach(markOn);
  const union=new Set([...sa,...sb]);
  union.forEach(m=>{ const inA=sa.has(m),inB=sb.has(m);
    const fill=inA&&inB?CMPBOTH():(inA?CMPA():CMPB()); paintNode(m,fill,fill,true); });
  if(slotA){ paintNode(slotA,null,CMPA(),false); const r=NODEEL[slotA].querySelector("rect"); r.setAttribute("stroke-width","3"); }
  if(slotB){ paintNode(slotB,null,CMPB(),false); const r=NODEEL[slotB].querySelector("rect"); r.setAttribute("stroke-width","3"); }
  showComparePanel(sa,sb);
}
function cmpLi(id){const n=NODES[id]; return `<li><span>${esc(LONG(id))}</span><span class="lv">${(n.myo||[]).join(" ")}</span></li>`;}
function showComparePanel(sa,sb){
  const onlyA=[...sa].filter(m=>!sb.has(m)), onlyB=[...sb].filter(m=>!sa.has(m)), both=[...sa].filter(m=>sb.has(m));
  const dot=c=>`<span class="nv" style="background:${c};width:9px;height:9px;border-radius:50%;display:inline-block"></span>`;
  let h=`<div class="ph">${T("compare")}</div>`+
    `<div class="pathline">${dot(CMPA())} <b>A</b> · ${slotA?esc(LONG(slotA)):"—"}<br>${dot(CMPB())} <b>B</b> · ${slotB?esc(LONG(slotB)):"—"}</div>`+
    `<div class="countrow"><span class="pill a">${onlyA.length} ${T("onlyA")}</span><span class="pill both">${both.length} ${T("both")}</span><span class="pill b">${onlyB.length} ${T("onlyB")}</span></div>`;
  const blk=(title,arr,cls)=> arr.length?`<div class="grp"><h4>${title}</h4><ul class="musc ${cls}">${arr.map(cmpLi).join("")}</ul></div>`:"";
  h+=blk(T("onlyA"),onlyA,"")+blk(T("both"),both,"")+blk(T("onlyB"),onlyB,"");
  if(!slotB) h+=`<div class="caveat">${T("cmpPickB")}</div>`;
  h+=compactNote();
  panel.innerHTML=h;
}

function reApply(){
  clearHL();
  if(cmpMode){ if(slotA||slotB)applyCompare(); else { if(currentF)render(null); showCmpPrompt(); } }
  else if(sel){ if(NODES[sel]) applySingle(sel); else { sel=null; if(currentF)render(null); showEmpty(); } }
  else { if(currentF)render(null); showEmpty(); }
}
function rebuild(){ buildNodes(); render(null); reApply(); }

/* =====================================================================
   CONTROLS / LANG / LIMB
   ===================================================================== */
const q=document.getElementById("q"),qx=document.getElementById("qx");
function applyLang(){
  document.documentElement.lang=lang;
  document.title=T("title")+" — "+T(limb);
  document.getElementById("ttlMain").textContent=T("title");
  document.getElementById("ttlSub").textContent=T("tsub");
  document.getElementById("subTxt").innerHTML=T("sub");
  q.placeholder=T("search");
  document.getElementById("reset").textContent=T("reset");
  document.getElementById("printbtn").textContent=T("print");
  const kb=document.getElementById("compactBtn"); kb.textContent=T("compact"); kb.classList.toggle("active",COMPACT);
  const sb=document.getElementById("sensBtn"); sb.textContent=T("sensory"); sb.classList.toggle("active",SHOW_SENSORY);
  const cb=document.getElementById("cmpBtn"); cb.textContent=T("compare"); cb.classList.toggle("active",cmpMode);
  document.getElementById("langBtn").textContent= lang==="en"?"Français":"English";
  document.querySelectorAll("#limbSeg button").forEach(b=>{ b.textContent=T(b.dataset.limb); b.classList.toggle("on",b.dataset.limb===limb); });
  const items=[["complete","var(--complete)"],["partial","var(--partial)"]].concat(NVORDER.map(k=>[k,C[k]]));
  let lg=items.map(([k,c])=>`<span><i style="background:${c}"></i>${k==="complete"?T("complete"):k==="partial"?T("partial"):LEGTXT[lang][k]}</span>`).join("");
  if(SHOW_SENSORY) lg+=`<span><i class="dash"></i>${LEGTXT[lang].sensory}</span>`;
  document.getElementById("legend").innerHTML=lg;
  if(typeof syncHeader==="function") syncHeader();
}
function setLimb(key){
  if(key===limb) return;
  sel=null; slotA=null; slotB=null; cmpMode=false;
  loadDataset(key); applyLang(); buildNodes(); render(null); showEmpty();
  q.value=""; qx.style.display="none";
}
document.querySelectorAll("#limbSeg button").forEach(b=>b.addEventListener("click",()=>setLimb(b.dataset.limb)));
document.getElementById("langBtn").addEventListener("click",()=>{ lang=lang==="en"?"fr":"en"; applyLang(); rebuild(); });
document.getElementById("sensBtn").addEventListener("click",()=>{ SHOW_SENSORY=!SHOW_SENSORY; applyLang(); rebuild(); });
document.getElementById("compactBtn").addEventListener("click",()=>{ COMPACT=!COMPACT; applyLang(); reApply(); });
document.getElementById("cmpBtn").addEventListener("click",()=>{ cmpMode=!cmpMode; sel=null; slotA=null; slotB=null; clearHL(); if(currentF)render(null); applyLang();
  if(cmpMode) showCmpPrompt(); else showEmpty(); });
q.addEventListener("input",()=>{ const v=q.value.trim().toLowerCase(); qx.style.display=v?"block":"none"; if(!v)return;
  const hit=MUSCLES.find(m=>L(m).toLowerCase().includes(v)||LONG(m).toLowerCase().includes(v)||m.toLowerCase().includes(v));
  if(hit){ if(cmpMode){cmpMode=false;applyLang();} sel=null; clearHL(); onClick(hit); const g=NODEEL[hit]; g&&g.scrollIntoView({block:"center",behavior:"smooth"}); } });
qx.addEventListener("click",()=>{ q.value=""; qx.style.display="none"; resetSel(); });
document.getElementById("reset").addEventListener("click",()=>{ q.value=""; qx.style.display="none"; resetSel(); });
document.getElementById("printbtn").addEventListener("click",()=>window.print());
window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ q.value=""; qx.style.display="none"; resetSel(); } });

// test hooks
window.__classify=classify; window.__findPath=findPath; window.__affectedSensory=affectedSensory; window.__affectedSet=affectedSet;
window.onClick=onClick; window.peek=peek; window.unpeek=unpeek;
window.__setLang=l=>{lang=l;applyLang();rebuild();};
window.__setLimb=setLimb;
window.__setSensory=v=>{SHOW_SENSORY=v;applyLang();rebuild();};
window.__setCompact=v=>{COMPACT=v;applyLang();reApply();};
window.__setCompare=v=>{cmpMode=v;sel=null;slotA=null;slotB=null;clearHL();if(currentF)render(null);applyLang();cmpMode?showCmpPrompt():showEmpty();};
window.__pos=POS;

function syncHeader(){ document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight+"px"); }
window.addEventListener("resize",syncHeader);
/* boot */
loadDataset("upper"); applyLang(); buildNodes(); render(null); showEmpty(); syncHeader();
</script>
</body>
