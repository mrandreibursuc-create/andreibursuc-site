<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upper-Limb Nerve Explorer — brachial plexus to hand</title>
<style>
  :root{
    --ink:#161b22; --ink-soft:#445; --line:#e3e7ee; --line-soft:#eef1f6;
    --paper:#f6f7f9; --card:#ffffff;
    --nerve:#b8332a; --motor:#2566a8; --sensory:#c2761a; --pass:#2c8a5f; --pearl:#9a7a16; --root:#475569;
    --nerve-bg:#fbecea; --motor-bg:#eaf1f9; --sensory-bg:#fbf1e3; --pass-bg:#e7f4ec; --pearl-bg:#f7f1dc; --root-bg:#eef1f5;
    --focus:#161b22;
    --r:10px; --r-sm:6px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.45;
       -webkit-font-smoothing:antialiased;font-size:14px}
  a{color:inherit}

  /* ---------- top bar ---------- */
  header.bar{position:sticky;top:0;z-index:40;background:rgba(246,247,249,.92);
    backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--line);padding:10px 18px}
  .bar-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;max-width:1500px;margin:0 auto}
  .title{display:flex;flex-direction:column;line-height:1.1;margin-right:6px}
  .title b{font-size:15px;letter-spacing:-.01em}
  .title span{font-size:11px;color:var(--ink-soft);font-family:var(--mono);letter-spacing:.02em}
  .search{flex:1 1 220px;min-width:170px;position:relative}
  .search input{width:100%;padding:8px 30px 8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
    background:var(--card);font:inherit;color:var(--ink)}
  .search input:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
  .search .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--ink-soft);
    border:0;background:none;font-size:15px;display:none}
  .chips{display:flex;gap:5px;align-items:center}
  .chips .lab{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-right:2px}
  .rootchip{font-family:var(--mono);font-size:12px;padding:6px 9px;border:1px solid var(--line);
    border-radius:var(--r-sm);background:var(--card);cursor:pointer;color:var(--root);font-weight:600;
    transition:.12s}
  .rootchip:hover{border-color:var(--root)}
  .rootchip.on{background:var(--root);color:#fff;border-color:var(--root)}
  .toggles{display:flex;gap:5px}
  .tg{font-size:11px;padding:6px 9px;border:1px solid var(--line);border-radius:var(--r-sm);
    background:var(--card);cursor:pointer;display:flex;gap:6px;align-items:center;color:var(--ink-soft)}
  .tg .dot{width:9px;height:9px;border-radius:2px}
  .tg.off{opacity:.4;text-decoration:line-through}
  .tg[data-t=motor] .dot{background:var(--motor)} .tg[data-t=sensory] .dot{background:var(--sensory)}
  .tg[data-t=pass] .dot{background:var(--pass)} .tg[data-t=pearl] .dot{background:var(--pearl)}
  .ghost{font-size:11px;color:var(--ink-soft);border:1px solid var(--line);background:var(--card);
    border-radius:var(--r-sm);padding:6px 9px;cursor:pointer}
  .ghost.langon{border-color:var(--root);color:var(--root);font-weight:600}
  .ghost:hover{border-color:var(--ink-soft)}

  /* status line for cross-highlight */
  .status{max-width:1500px;margin:8px auto 0;font-size:12px;color:var(--ink-soft);min-height:16px}
  .status b{color:var(--ink)} .status .key{font-family:var(--mono)}

  main{max-width:1500px;margin:0 auto;padding:16px 18px 60px}

  /* ---------- plexus navigator ---------- */
  .nav-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:6px 10px 2px;margin-bottom:18px;position:relative;overflow:hidden}
  .nav-wrap .hint{position:absolute;right:12px;top:10px;font-size:11px;color:var(--ink-soft);
    font-family:var(--mono)}
  svg.braid{width:100%;height:auto;display:block;touch-action:manipulation}
  .cmap-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:8px 12px;margin:2px 0 18px;overflow-x:auto}
  svg.cmap{width:100%;min-width:780px;height:auto;display:block;font-family:var(--sans)}
  .cmap .creg{fill:#9aa4b1;font-size:11px;font-weight:600;text-anchor:middle;text-transform:uppercase;letter-spacing:.05em}
  .cmap .cdiv{stroke:#eef1f5;stroke-width:1}
  .cmap .clane{font-size:12.5px;font-weight:700}
  .cmap .claneln{stroke-width:2.6;opacity:.30;stroke-linecap:round}
  .cmap .clbl{fill:#3a4654;font-size:10px;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
  .csite{cursor:pointer}
  .csite .cdot,.csite .chalo{transition:.12s}
  .csite:hover .cdot{r:6.5}
  .csite:hover .chalo{stroke:#1f2a37;stroke-width:1.6}
  .csite.sel .cdot{fill:#0b6b3a}
  .csite.sel .chalo{stroke:#0b3b22;stroke-width:2}
  .csite.sel .clbl{font-weight:700;fill:#0b3b22}
  /* compression-site text highlight that KEEPS the rest of the card visible */
  .sitehit{background:#e7f6ee;box-shadow:inset 0 0 0 1.5px #97d3b1;border-radius:7px}
  .braid .seg{fill:none;stroke:#c4ccd6;stroke-width:2.4;stroke-linecap:round}
  .braid .seg.post{stroke-dasharray:1 5}
  .braid .seg.lit{stroke:#475569;stroke-width:3.4}
  .braid .node{cursor:pointer}
  .braid .node circle,.braid .node rect{stroke:#fff;stroke-width:1.5}
  .braid .nodetext{font-family:var(--mono);font-size:11px;fill:#fff;font-weight:600;
    text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .braid .chiplbl{font-family:var(--sans);font-size:11.5px;font-weight:600;fill:#33404f;
    text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .braid .nlabel{font-family:var(--sans);font-size:10.5px;fill:var(--ink-soft);text-anchor:middle}
  .braid .structlbl{font-family:var(--sans);font-size:12px;font-weight:600;fill:#2a3340;text-anchor:middle}
  .braid .lvdim{opacity:.12}
  .braid .seg.lvhit{stroke:#475569;stroke-width:3.4;opacity:1}
  .braid .node.lvhit,.braid .branchbox.lvhit{opacity:1}
  .braid .node.root.lvhit circle{stroke:#111827;stroke-width:3}
  .braid.rootlit .seglabel{opacity:.12}
  .braid .colhdr{font-family:var(--sans);font-size:10px;fill:#9aa4b1;text-anchor:middle;
    text-transform:uppercase;letter-spacing:.1em}
  .braid .seglabel{font-family:var(--sans);font-size:9.5px;font-style:italic;fill:#7a8694;
    text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:2.8px;stroke-linejoin:round}
  .braid .term text{font-size:10.5px}
  .braid .node.dim{opacity:.28}
  .braid .seg.dim{opacity:.12}
  .braid .branchbox{cursor:default}
  .treewrap{margin:8px 0 6px;overflow-x:auto;border:1px solid var(--line-soft);border-radius:8px;
    background:#fcfdfe;padding:8px 10px}
  .treelabel{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);
    font-weight:600;margin:0 2px 6px}
  .tnode.tn-on{cursor:pointer}
  .tnode.tn-on .tnbox{transition:.12s}
  .tnode.tn-on:hover .tnbox{stroke-opacity:1}
  .tnode.sel .tnbox{stroke-width:2.4;stroke-opacity:1}
  .cbody.treemode [data-search]:not(.thit){opacity:.25}
  .cbody.treemode .thit{background:#eaf3ff;box-shadow:inset 0 0 0 1px #c5dcf5;border-radius:6px}
  .braid .node.small.lvhit rect{stroke:#475569;stroke-width:1.6}
  .braid .branchbox .bbg{transition:.12s}
  .braid .branchbox:hover .bbg{stroke-opacity:.9;filter:brightness(.985)}
  .braid .branchbox.dim{opacity:.3}
  .braid .bconn.dim{opacity:.3}
  .braid .bconn.lvhit{opacity:1}

  @keyframes sweep{to{stroke-dashoffset:0}}
  .braid .seg.sweep{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
    animation:sweep .75s ease forwards}

  /* ---------- section labels ---------- */
  .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft);
    font-weight:600;margin:0 2px 8px;display:flex;align-items:center;gap:8px}
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---------- lesion explorer ---------- */
  .lesionbar{display:flex;flex-wrap:wrap;gap:10px 14px;margin:0 2px 12px}
  .lgroup{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .lgrp-label{font-size:11px;font-weight:700;margin-right:1px}
  .lpill{border:1.4px solid;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;
    background:#fff;cursor:pointer;line-height:1.25;transition:.12s;font-family:var(--sans)}
  .lpill:hover{filter:brightness(.96)}
  .lesionpanel{border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin:0 0 16px;background:var(--card)}
  .lesionpanel .lphead{font-weight:700;font-size:14px;margin:0 0 9px}
  .lcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.lcols{grid-template-columns:1fr}}
  .lcol h4{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
  .lcol.aff h4{color:#b8332a}
  .lcol.spd h4{color:#2c8a5f}
  .lcol ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px}
  .lcol li{font-size:12px;padding:2px 8px;border-radius:6px}
  .lcol.aff li{background:#fceeec;color:#9a2a22}
  .lcol.spd li{background:#eaf6ef;color:#1f6d49}
  .lsens{margin:11px 0 0;font-size:12.5px;color:#33404f;line-height:1.5}
  .lsens b{color:#1f2937}
  .lnote{margin:7px 0 0;font-size:12px;color:var(--ink-soft);font-style:italic;line-height:1.5}
  /* ---------- plexus pattern ---------- */
  .braid .plexel rect{cursor:pointer}
  .braid .plexel:hover rect{stroke:#475569;stroke-width:2}
  body.plexmode .item:not(.hit){opacity:.3}
  body.plexmode .item.hit{background:#eaf2fb;box-shadow:inset 0 0 0 1px #c2d8f0}
  body.plexmode .item.hit .lvl.match{background:#2566a8;color:#fff;opacity:1}
  .plexpanel{border:1px solid var(--line);border-left:4px solid #475569;border-radius:var(--r);
    padding:13px 15px;margin:0 0 14px;background:var(--card)}
  .plexpanel .pphead{font-weight:700;font-size:14.5px;margin:0 0 3px;color:#2a3340}
  .plexpanel .ppsub{font-size:11px;color:var(--ink-soft);margin:0 0 10px}
  .pprow{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:12.5px;line-height:1.5;
    padding:5px 0;border-top:1px solid var(--line-soft)}
  .pprow:first-of-type{border-top:0}
  .pprow .ppk{font-weight:700;color:#475569;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
  .pprow.warn .ppk{color:#b8332a}
  .pprow .ppv b{color:#1f2937}
  @media(max-width:560px){.pprow{grid-template-columns:1fr;gap:1px}}

  /* ---------- anomalous innervation + eponyms ---------- */
  .anomsigns{margin:9px 0 0;padding-left:18px}
  .anomsigns li{font-size:12.5px;line-height:1.5;margin:3px 0;color:#33404f}
  .eponyms{display:grid;grid-template-columns:1fr 1fr;gap:7px 22px;margin:0 2px 10px}
  @media(max-width:620px){.eponyms{grid-template-columns:1fr}}
  .epi{font-size:12.5px;line-height:1.5;color:#33404f}
  .epi b{color:#1f2937}
  #cmap .cprox .cdot{stroke:#fff;stroke-width:1}
  #cmap .cprox.sel .cdot{r:7}
  #cmap .cprox .clbl{fill:#475569}

  /* ---------- roots strip ---------- */
  .roots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}
  .rootcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;
    border-top:3px solid var(--root);transition:.12s}
  .rootcard.on{box-shadow:0 0 0 2px var(--root) inset;border-top-color:var(--root)}
  .rootcard h3{margin:0 0 6px;font-family:var(--mono);font-size:15px;color:var(--root);display:flex;
    justify-content:space-between;align-items:baseline}
  .rootcard h3 em{font-style:normal;font-size:10px;color:var(--ink-soft);font-family:var(--sans)}
  .rootcard .blk{margin:6px 0}
  .rootcard .blk .t{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
    margin-bottom:2px}
  .rootcard .blk .v{font-size:12px}
  .derm{color:var(--sensory)}

  /* ---------- nerve cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    gap:14px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    transition:.15s;scroll-margin-top:130px}
  .card.span2{grid-column:span 2}
  .card.focus{box-shadow:0 0 0 2px var(--focus);}
  .card.dimcard{opacity:.5}
  .chead{padding:12px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;
    display:flex;align-items:center;gap:10px;border-left:4px solid var(--nerve)}
  .chead .nm{font-size:15px;font-weight:650;letter-spacing:-.01em}
  .chead .lv{font-family:var(--mono);font-size:11px;color:#fff;background:var(--nerve);
    padding:2px 7px;border-radius:20px;margin-left:auto;white-space:nowrap}
  .chead .car{color:var(--ink-soft);font-size:11px;transition:.15s}
  .card.collapsed .car{transform:rotate(-90deg)}
  .card.collapsed .cbody{display:none}
  .cbody{padding:4px 14px 14px}

  .sec{margin-top:12px}
  .sec .sh{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;
    display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .sec .sh .sq{width:9px;height:9px;border-radius:2px}
  .sh.motor{color:var(--motor)} .sh.motor .sq{background:var(--motor)}
  .sh.sensory{color:var(--sensory)} .sh.sensory .sq{background:var(--sensory)}
  .sh.pass{color:var(--pass)} .sh.pass .sq{background:var(--pass)}
  .sh.pearl{color:var(--pearl)} .sh.pearl .sq{background:var(--pearl)}

  .item{display:flex;align-items:flex-start;gap:8px;padding:4px 6px;border-radius:var(--r-sm);
    font-size:13px;transition:.1s}
  .item .mn{flex:1}
  .item .mn .note{color:var(--ink-soft);font-size:11.5px}
  .lvls{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
  .lvl{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:10px;
    background:var(--root-bg);color:var(--root);white-space:nowrap}
  .lvl.minor{opacity:.5}
  .pass-item{background:var(--pass-bg)} .pass-item .nm2{color:var(--pass);font-weight:600}
  .pearl-item{font-size:12.5px;color:#5b4d10;background:var(--pearl-bg);display:block;padding:6px 8px}

  /* sub-nerve callout (AIN, PIN, deep ulnar) */
  .sub{margin:8px 0;border:1px dashed var(--line);border-radius:var(--r-sm);padding:8px 10px;background:#fafbfc}
  .sub .subh{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--nerve);margin-bottom:4px;
    display:flex;gap:8px;align-items:center}
  .sub .subh .tag{font-size:9px;background:var(--nerve);color:#fff;padding:1px 6px;border-radius:10px;
    text-transform:uppercase;letter-spacing:.05em}

  /* sites list (entrapment) */
  ol.sites{margin:4px 0 0;padding-left:20px;font-size:12.5px}
  ol.sites li{margin:2px 0}
  ol.sites li.key{font-weight:600;color:var(--pass)}

  /* cross-highlight states */
  body.rootmode .item:not(.hit){opacity:.32}
  body.rootmode .item.hit{background:#fff6cc;box-shadow:inset 0 0 0 1px #efe09a}
  body.rootmode .item.hit .lvl.match{background:var(--root);color:#fff;opacity:1}

  mark{background:#fde68a;color:inherit;border-radius:2px;padding:0 1px}

  footer{max-width:1500px;margin:0 auto;padding:0 18px 40px;font-size:11px;color:var(--ink-soft)}
  footer code{font-family:var(--mono);background:#eef1f5;padding:1px 4px;border-radius:3px}

  @media (max-width:760px){
    .roots{grid-template-columns:repeat(2,1fr)}
    .card.span2{grid-column:span 1}
  }
  @media (prefers-reduced-motion:reduce){
    .braid .seg.sweep{animation:none;stroke-dashoffset:0}
    *{transition:none!important}
  }
  @media print{
    header.bar,.nav-wrap .hint,.toggles,.search,.chips,.ghost,#qx,#lesionbar,#anombar{display:none!important}
    .card.collapsed .cbody{display:block!important}
    body{background:#fff}
    .grid{display:block} .card{break-inside:avoid;margin-bottom:10px}
    .card.dimcard,.item{opacity:1!important}
    /* neutralise every interactive dim/highlight state for a clean handout */
    .braid .dim,.braid .lvdim,.braid .lvhit,.braid .lit,.braid .sweep{opacity:1!important}
    .cbody.treemode [data-search]{opacity:1!important;background:none!important;box-shadow:none!important}
    body.rootmode .item,body.plexmode .item,.item.hit,.lvl.match{opacity:1!important}
    .nav-wrap,.cmap-wrap{break-inside:avoid;overflow:visible}
    svg.cmap{min-width:0}
    .eyebrow{break-after:avoid}
  }
</style>
</head>
<body>
<script>
/* One explorer, shared interactions, with the original English and French content. */
const LOCALE_HTML={"en":"\n<header class=\"bar\">\n  <div class=\"bar-row\">\n    <div class=\"title\"><b>Upper-Limb Nerve Explorer</b><span>brachial plexus → hand · electrodiagnostic reference</span></div>\n    <div class=\"search\">\n      <input id=\"q\" type=\"search\" placeholder=\"Search a muscle, nerve, or site — e.g. FDP, AIN, Guyon\" autocomplete=\"off\">\n      <button class=\"x\" id=\"qx\" aria-label=\"Clear search\">×</button>\n    </div>\n    <div class=\"chips\">\n      <span class=\"lab\">Root</span>\n      <button class=\"rootchip\" data-root=\"C5\">C5</button>\n      <button class=\"rootchip\" data-root=\"C6\">C6</button>\n      <button class=\"rootchip\" data-root=\"C7\">C7</button>\n      <button class=\"rootchip\" data-root=\"C8\">C8</button>\n      <button class=\"rootchip\" data-root=\"T1\">T1</button>\n    </div>\n    <div class=\"toggles\">\n      <button class=\"tg\" data-t=\"motor\"><span class=\"dot\"></span>Motor</button>\n      <button class=\"tg\" data-t=\"sensory\"><span class=\"dot\"></span>Sensory</button>\n      <button class=\"tg\" data-t=\"pass\"><span class=\"dot\"></span>Passage</button>\n      <button class=\"tg\" data-t=\"pearl\"><span class=\"dot\"></span>Pearls</button>\n    </div>\n    <button class=\"ghost langon\" id=\"langBtn\" type=\"button\" lang=\"fr\" aria-label=\"Passer en français\">Français</button>\n    <button class=\"ghost\" id=\"reset\">Reset</button>\n    <button class=\"ghost\" id=\"printbtn\" title=\"Open the print dialog — choose “Save as PDF” for a clean handout\">Print / PDF</button>\n  </div>\n  <div class=\"status\" id=\"status\">Tip: click a root level, a nerve in the plexus, or search a muscle. Nothing selected.</div>\n</header>\n\n<main>\n  <!-- ================= PLEXUS NAVIGATOR ================= -->\n  <div class=\"nav-wrap\">\n    <span class=\"hint\">solid = anterior · dashed = posterior · click a trunk, cord or nerve →</span>\n    <svg class=\"braid\" id=\"braid\" viewBox=\"0 0 1060 706\" role=\"img\" aria-label=\"Brachial plexus navigator\">\n      <g id=\"segs\"></g>\n      <g id=\"branches\"></g>\n      <g id=\"nodes\"></g>\n    </svg>\n  </div>\n\n  <div class=\"plexpanel\" id=\"plexpanel\" hidden></div>\n\n  <!-- ================= COMPRESSION / ENTRAPMENT MAP ================= -->\n  <div class=\"eyebrow\">Compression / entrapment sites — anatomical course (<span style=\"color:#2c8a5f;font-weight:700\">●</span> distal site → opens its card · <span style=\"color:#475569;font-weight:700\">●</span> proximal nerve → opens a clinical summary)</div>\n  <div class=\"cmap-wrap\">\n    <svg class=\"cmap\" id=\"cmap\" role=\"img\" aria-label=\"Upper-limb nerve entrapment map by anatomical region\"></svg>\n  </div>\n  <div class=\"plexpanel\" id=\"proxpanel\" hidden></div>\n\n  <!-- ================= LESION EXPLORER ================= -->\n  <div class=\"eyebrow\">Lesion explorer — pick a site to see the expected exam pattern (weak vs spared)</div>\n  <div class=\"lesionbar\" id=\"lesionbar\"></div>\n  <div class=\"lesionpanel\" id=\"lesionpanel\" hidden></div>\n\n  <!-- ================= ROOTS ================= -->\n  <div class=\"eyebrow\">Roots — myotome, reflex, dermatome</div>\n  <div class=\"roots\" id=\"roots\"></div>\n\n  <!-- ================= NERVE CARDS ================= -->\n  <div class=\"eyebrow\">Nerves — course, motor, sensory, pearls</div>\n  <div class=\"grid\" id=\"grid\"></div>\n\n  <!-- ================= ANOMALOUS INNERVATION ================= -->\n  <div class=\"eyebrow\">Anomalous innervation — the “why doesn’t this study make sense?” set</div>\n  <div class=\"lesionbar\" id=\"anombar\"></div>\n  <div class=\"lesionpanel\" id=\"anompanel\" hidden></div>\n\n  <!-- ================= EPONYMS & PROXIMAL SITES ================= -->\n  <div class=\"eyebrow\">Eponyms &amp; proximal entrapment sites</div>\n  <div class=\"eponyms\" id=\"eponyms\"></div>\n</main>\n\n<footer>\n  Levels shown are each muscle's myotome (the root that muscle tests on EM function parseLevels(str){
  // returns {levels:[...all], minor:[...]}
  const out=[],minor=[];
  (str||"").split(",").map(x=>x.trim()).filter(Boolean).forEach(tok=>{
    const mn=tok.startsWith("(");
    const lv=tok.replace(/[()]/g,"");
    out.push(lv); if(mn) minor.push(lv);
  });
  return {levels:out,minor};
}
function lvlChips(str){
  const {levels,minor}=parseLevels(str);
  return `<span class="lvls">`+levels.map(l=>
    `<span class="lvl ${minor.includes(l)?'minor':''}" data-lvl="${l}">${l}</span>`).join("")+`</span>`;
}
function dataLevels(str){return parseLevels(str).levels.join(" ");}

  let leaf=0; const rowH=48; const nodes=[];
  (function place(n,depth){

      n.cy=(n.children[0].cy+n.children[n.children.length-1].cy)/2;
    } else { n.cy=leaf*rowH+rowH/2; leaf++; }
  })(root,0);
  const maxD=Math.max(...nodes.map(n=>n.depth));
  const colW=[],colX=[]; const gap=30; let acc=6;
  for(let d=0;d<=maxD;d++) colW[d]=Math.max(...nodes.filter(n=>n.depth===d).map(n=>n.w));
  for(let d=0;d<=maxD;d++){ colX[d]=acc; acc+=colW[d]+gap; }
  nodes.forEach(n=>n.x=colX[n.depth]);
  return {nodes,W:acc-gap+6,H:Math.max(1,leaf)*rowH+6};
}

  nodes.forEach(n=>{ if(n.children) n.children.forEach(c=>{
    const x1=n.x+n.w,y1=n.cy,x2=c.x,y2=c.cy,mx=(x1+x2)/2;
    s+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="#cfd6df" stroke-width="1.7"/>`;

       `<rect x="${n.x}" y="${y}" width="3.5" height="${h}" rx="2" fill="${st.stroke}"/>`;

}

(function buildCMap(){
  const svg=document.getElementById("cmap"); if(!svg) return;
  const x0=124,colW=115,top=30,rowGap=16,pad=18,labelX=6,sepH=30;
  const xC=r=>x0+r*colW+colW/2;
  const setRowH=l=>{ const per={}; l.dots.forEach(d=>per[d.r]=(per[d.r]||0)+1); l.maxc=Math.max(1,...Object.values(per)); l.rowH=l.maxc*rowGap+pad; };
  CMAP.forEach(setRowH); PROX.forEach(setRowH);
  const H=top+CMAP.reduce((a,l)=>a+l.rowH,0)+sepH+PROX.reduce((a,l)=>a+l.rowH,0)+6, W=x0+6*colW+8;
  let inner="";
  for(let r=0;r<6;r++) inner+=`<text class="creg" x="${xC(r)}" y="17">${CREG[r]}</text>`;
  for(let r=0;r<=6;r++){ const x=x0+r*colW; inner+=`<line class="cdiv" x1="${x}" y1="24" x2="${x}" y2="${H-4}"/>`; }
  let y=top;
  function lane(l,prox){
    const cy=y+l.rowH/2, col=l.col||COLOR[l.id]||"#475569";
    inner+=`<line class="claneln" x1="${x0}" y1="${cy}" x2="${x0+6*colW}" y2="${cy}" stroke="${col}"/>`;
    inner+=`<text class="clane" x="${labelX}" y="${cy}" dominant-baseline="central" fill="${col}">${esc(l.name)}</text>`;
    const byR={}; l.dots.forEach(d=>{(byR[d.r]=byR[d.r]||[]).push(d);});
    Object.keys(byR).forEach(rk=>{
      const arr=byR[rk], r=+rk, k=arr.length, cellL=x0+r*colW;
      arr.forEach((d,i)=>{
        const dy=cy+(i-(k-1)/2)*rowGap, dx=cellL+12;
        if(prox){
          inner+=`<g class="csite cprox" data-prox="${d.pid||l.id}" data-label="${esc(d.label)}">`+
                 `<circle cx="${dx}" cy="${dy}" r="11" fill="transparent"/>`+
                 `<circle class="chalo" cx="${dx}" cy="${dy}" r="8.5" fill="#fff"/>`+
                 `<circle class="cdot" cx="${dx}" cy="${dy}" r="5.5" fill="#475569"/>`+
                 `<text class="clbl" x="${dx+10}" y="${dy}" dominant-baseline="central">${esc(d.label)}</text>`+
                 localized(`<title>${esc(l.name)} n. — click for the clinical summary</title></g>`, `<title>${esc(l.name)} — cliquez pour le résumé clinique</title></g>`);
        } else {
          inner+=`<g class="csite" data-card="${d.card||l.id}" data-key="${esc(d.key)}" data-label="${esc(d.label)}">`+
                 `<circle cx="${dx}" cy="${dy}" r="11" fill="transparent"/>`+
                 `<circle class="chalo" cx="${dx}" cy="${dy}" r="8.5" fill="#fff"/>`+
                 `<circle class="cdot" cx="${dx}" cy="${dy}" r="5.5" fill="#2c8a5f"/>`+
                 `<text class="clbl" x="${dx+10}" y="${dy}" dominant-baseline="central">${esc(d.label)}</text>`+
                 localized(`<title>${esc(d.label)} — click to locate in the ${esc(l.name)} card</title></g>`, `<title>${esc(d.label)} — cliquez pour localiser dans la fiche ${esc(l.name)}</title></g>`);
        }
      });
    });
    y+=l.rowH;
  }
  CMAP.forEach(l=>lane(l,false));
  // separator + proximal sub-header
  const sy=y+sepH/2;
  inner+=`<line x1="${labelX}" y1="${sy}" x2="${x0+6*colW}" y2="${sy}" stroke="#d6dce4" stroke-dasharray="3 3"/>`;
  inner+=localized(`<text x="${labelX}" y="${sy-6}" style="text-anchor:start;font:600 9.5px ui-sans-serif,system-ui,sans-serif;fill:#9aa4b1;letter-spacing:.07em">PROXIMAL · SHOULDER-GIRDLE NERVES</text>`, `<text x="${labelX}" y="${sy-6}" style="text-anchor:start;font:600 9.5px ui-sans-serif,system-ui,sans-serif;fill:#9aa4b1;letter-spacing:.07em">NERFS PROXIMAUX · CEINTURE SCAPULAIRE</text>`);
  y+=sepH;
  PROX.forEach(l=>lane(l,true));
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.innerHTML=inner;
})();

const plexPanel=document.getElementById("plexpanel");
let plexSel=null;
function clearPlex(){
  plexSel=null; body.classList.remove("plexmode");
  document.querySelectorAll(".item.hit").forEach(n=>n.classList.remove("hit"));
  document.querySelectorAll(".lvl.match").forEach(n=>n.classList.remove("match"));
  clearBraidHL();
  if(plexPanel){ plexPanel.hidden=true; plexPanel.innerHTML=""; }
}
function braidByPlex(E){
  clearBraidHL();
  const b=document.getElementById("braid"); if(b) b.classList.add("rootlit");
  document.querySelectorAll(".braid .seg,.braid .node.small,.braid .node.term,.braid .branchbox,.braid .bconn").forEach(n=>{
    const els=(n.dataset.el||"").split(" "), self=n.dataset.elself||"";
    n.classList.add((els.includes(E)||self===E)?"lvhit":"lvdim");
  });
  document.querySelectorAll(".braid .node.root").forEach(n=>n.classList.add("lvdim"));
}
function plexClick(E){
  clearRoot(); clearFocus(); clearTree(); clearSite();
  if(plexSel===E){ clearPlex(); defaultStatus(); return; }
  clearPlex(); plexSel=E;
  const P=PLEX[E]; if(!P) return;
  braidByPlex(E);
  body.classList.add("plexmode");
  let n=0;
  document.querySelectorAll('#grid .item[data-levels]').forEach(it=>{
    const card=it.closest(".card"); const nv=card?card.dataset.nerve:"";
    if(!P.nerves.includes(nv)) return;
    const myo=(it.dataset.levels||"").split(" ");
    if(myo.some(l=>P.levels.includes(l))){ it.classList.add("hit"); n++;
      P.levels.forEach(L=>it.querySelectorAll(`.lvl[data-lvl="${L}"]`).forEach(c=>c.classList.add("match")));
    }
  });
  const row=(k,v,warn)=>`<div class="pprow${warn?' warn':''}"><div class="ppk">${k}</div><div class="ppv">${v}</div></div>`;
  plexPanel.innerHTML=
    localized(`<div class="pphead">${esc(P.label)}</div><div class="ppsub">${esc(P.sub)} · ${n} muscle${n===1?"":"s"} lit below</div>`, `<div class="pphead">${esc(P.label)}</div><div class="ppsub">${esc(P.sub)} · ${n} muscle${n===1?"":"s"} surligné${n===1?"":"s"} ci-dessous</div>`)+
    row(localized("Weak", "Faible"),`<b>${esc(P.motor)}</b>`)+
    row(localized("Spared", "Épargné"),esc(P.spared))+
    row(localized("Sensory", "Sensitif"),esc(P.sensory))+
    row(localized("SNAPs", "Pot. sensitifs"),esc(P.snap))+
    row("EMG",esc(P.emg))+
    row(localized("Key point", "Point clé"),esc(P.warn),true);
  plexPanel.hidden=false;
  setStatus(localized(`<b>${esc(P.label)}</b> lit on the plexus — everything distal is highlighted. <span style="color:var(--ink-soft)">Click it again to clear.</span>`, `<b>${esc(P.label)}</b> allumé sur le plexus — tout ce qui est distal est surligné. <span style="color:var(--ink-soft)">Cliquez à nouveau pour effacer.</span>`));
  const reduce=(typeof matchMedia==="function")&&matchMedia("(prefers-reduced-motion:reduce)").matches;
  try{ plexPanel.scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"}); }catch(e){}
}

  if(!anomBar) return;
  ANOM.forEach(A=>{ const b=document.createElement("button"); b.type="button"; b.className="lpill";
    b.textContent=A.name; b.style.borderColor=A.col; b.style.color=A.col; b.onclick=()=>anomClick(A,b);
    anomBar.appendChild(b);
  });
})();
function clearAnom(){
  anomSel=null;
  document.querySelectorAll("#anombar .lpill").forEach(p=>{p.style.background="#fff";p.style.color=p.style.borderColor;});
  if(anomPanel){ anomPanel.hidden=true; anomPanel.innerHTML=""; }
}
function anomClick(A,btn){
  if(anomSel===A.id){ clearAnom(); return; }
  clearAnom(); anomSel=A.id; btn.style.background=A.col; btn.style.color="#fff";
  anomPanel.innerHTML=
    localized(`<div class="lphead" style="color:${A.col}">${esc(A.name)} anastomosis</div>`, `<div class="lphead" style="color:${A.col}">Anastomose de ${esc(A.name)}</div>`)+
    `<p class="lsens">${esc(A.what)}</p>`+
    `<ul class="anomsigns">${A.signs.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`+
    localized(`<p class="lnote"><b>Pitfall —</b> ${esc(A.pitfall)}</p>`, `<p class="lnote"><b>Piège —</b> ${esc(A.pitfall)}</p>`);
  anomPanel.hidden=false;
}
(function buildEponyms(){
  const el=document.getElementById("eponyms"); if(!el) return;
  el.innerHTML=EPONYMS.map(e=>`<div class="epi"><b>${esc(e.t)}</b> — ${esc(e.d)}</div>`).join("");
})();

/* proximal-nerve summary panel (driven by the slate dots on the map) */
const proxPanel=document.getElementById("proxpanel");
let proxSel=null;
function clearProx(){
  proxSel=null;
  document.querySelectorAll("#cmap .csite.proxon").forEach(n=>n.classList.remove("proxon","sel"));
  if(proxPanel){ proxPanel.hidden=true; proxPanel.innerHTML=""; }
}
function proxClick(id,g){
  if(proxSel===g){ clearProx(); defaultStatus(); return; }
  clearProx(); clearSite();
  proxSel=g; if(g) g.classList.add("proxon","sel");
  const P=PROXINFO[id]; if(!P) return;
  const row=(k,v)=>`<div class="pprow"><div class="ppk">${k}</div><div class="ppv">${v}</div></div>`;
  proxPanel.innerHTML=
    `<div class="pphead" style="color:${P.col}">${esc(P.name)}</div><div class="ppsub">${esc(P.origin)}</div>`+
    row("Site(s)",esc(P.sites))+
    row(localized("Motor", "Moteur"),`<b>${esc(P.motor)}</b>`)+
    row(localized("Sensory", "Sensitif"),esc(P.sensory))+
    row("EDX",esc(P.edx))+
    row(localized("Pearl", "Perle"),esc(P.pearl));
  proxPanel.hidden=false;
  setStatus(localized(`<b>${esc(P.name)}</b> — proximal-nerve summary. <span style="color:var(--ink-soft)">Click the dot again to clear.</span>`, `<b>${esc(P.name)}</b> — résumé du nerf proximal. <span style="color:var(--ink-soft)">Cliquez à nouveau le point pour effacer.</span>`));
  const reduce=(typeof matchMedia==="function")&&matchMedia("(prefers-reduced-motion:reduce)").matches;
  try{ proxPanel.scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"}); }catch(e){}
}

/* =====================================================================
   INTERACTION
   ===================================================================== */
const body=document.body, statusEl=document.getElementById("status");
let activeRoot=null, focusNerve=null, typeOff=new Set(), query="";

function setStatus(html){statusEl.innerHTML=html;}

function applyTypeFilters(){
  ["motor","sensory","pass","pearl"].forEach(t=>{
    const hide=typeOff.has(t);
    document.querySelectorAll(`[data-type="${t}"]`).forEach(n=>n.style.display=hide?"none":"");
  });
}

let treeSel=null;
function clearTree(){
  treeSel=null;
  document.querySelectorAll(".cbody.treemode").forEach(c=>c.classList.remove("treemode"));
  document.querySelectorAll(".thit").forEach(n=>n.classList.remove("thit"));
  document.querySelectorAll(".tnode.sel").forEach(n=>n.classList.remove("sel"));
}
function treeClick(g){
  const card=document.getElementById("card-"+g.dataset.card);
  const cbody=card&&card.querySelector(".cbody"); if(!cbody) return;
  if(treeSel===g){ clearTree(); defaultStatus(); return; }
  clearRoot(); clearFocus(); clearTree(); clearSite(); clearPlex();
  treeSel=g; g.classList.add("sel"); cbody.classList.add("treemode");
  const keys=(g.dataset.keys||"").split("|").filter(Boolean);
  let n=0;
  cbody.querySelectorAll("[data-search]").forEach(it=>{
    const t=it.dataset.search||"";
    if(keys.some(k=>t.includes(k))){ it.classList.add("thit"); n++; }
  });
  setStatus(localized(`<b>${g.dataset.label}</b> → <b>${n}</b> structure${n===1?"":"s"} highlighted in this card. <span style="color:var(--ink-soft)">Click it again to clear.</span>`, `<b>${g.dataset.label}</b> → <b>${n}</b> structure${n===1?"":"s"} surlignée${n===1?"":"s"} dans cette fiche. <span style="color:var(--ink-soft)">Cliquez à nouveau pour effacer.</span>`));
}
let siteSel=null;
function clearSite(){ siteSel=null;
  document.querySelectorAll(".csite.sel").forEach(n=>n.classList.remove("sel"));
  document.querySelectorAll(".sitehit").forEach(n=>n.classList.remove("sitehit"));
}
function siteClick(g){
  const card=document.getElementById("card-"+g.dataset.card);
  const cbody=card&&card.querySelector(".cbody"); if(!cbody) return;
  if(siteSel===g){ clearSite(); defaultStatus(); return; }
  clearRoot(); clearFocus(); clearTree(); clearSite(); clearPlex(); clearProx();
  siteSel=g; g.classList.add("sel");
  card.classList.remove("collapsed");
  const key=(g.dataset.key||"").toLowerCase(); let n=0, first=null;
  cbody.querySelectorAll('[data-type="pass"]').forEach(el=>{
    if((el.dataset.search||"").includes(key)){ el.classList.add("sitehit"); if(!first)first=el; n++; }
  });
  const nm=card.querySelector(".nm")?card.querySelector(".nm").textContent:"card";
  setStatus(localized(`<b>${g.dataset.label}</b> — highlighted in the <b>${nm}</b> course/entrapment text (rest of the card kept for context). <span style="color:var(--ink-soft)">Click the dot again to clear.</span>`, `<b>${g.dataset.label}</b> — surligné dans le texte trajet/piégeage de <b>${nm}</b> (reste de la fiche conservé pour le contexte). <span style="color:var(--ink-soft)">Cliquez à nouveau le point pour effacer.</span>`));
  const reduce=(typeof matchMedia==="function")&&matchMedia("(prefers-reduced-motion:reduce)").matches;
  try{ (first||card).scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"}); }catch(e){}
}
function clearBraidHL(){
  const b=document.getElementById("braid"); if(b) b.classList.remove("rootlit");
  document.querySelectorAll(".braid .seg,.braid .node,.braid .branchbox,.braid .bconn")
    .forEach(n=>n.classList.remove("lvhit","lvdim"));
}
function braidByRoot(r){
  clearBraidHL();
  const b=document.getElementById("braid"); if(b) b.classList.add("rootlit");
  document.querySelectorAll(".braid .seg,.braid .node.small,.braid .node.term,.braid .branchbox,.braid .bconn").forEach(n=>{
    const lv=(n.dataset.lv||"").split(" ");
    n.classList.add(lv.includes(r)?"lvhit":"lvdim");
  });
  document.querySelectorAll(".braid .node.root").forEach(n=>{
    n.classList.add(n.dataset.root===r?"lvhit":"lvdim");
  });
}
function clearRoot(){
  activeRoot=null; body.classList.remove("rootmode");
  document.querySelectorAll(".rootchip,.rootcard").forEach(n=>n.classList.remove("on"));
  document.querySelectorAll(".item.hit").forEach(n=>n.classList.remove("hit"));
  document.querySelectorAll(".lvl.match").forEach(n=>n.classList.remove("match"));
  clearBraidHL();
}
function selectRoot(r){
  clearFocus(); clearTree(); clearSite(); clearPlex();
  if(activeRoot===r){clearRoot(); defaultStatus(); return;}
  clearRoot(); activeRoot=r; body.classList.add("rootmode");
  document.querySelectorAll(`.rootchip[data-root="${r}"],.rootcard[data-root="${r}"]`).forEach(n=>n.classList.add("on"));
  braidByRoot(r);
  let muscles=0; const nerves=new Set();
  document.querySelectorAll('#grid .item[data-levels]').forEach(it=>{
    const has=(it.dataset.levels||"").split(" ").includes(r);
    if(has){ it.classList.add("hit"); muscles++;
      it.querySelectorAll(`.lvl[data-lvl="${r}"]`).forEach(c=>c.classList.add("match"));
      const card=it.closest(".card"); if(card) nerves.add(card.querySelector(".nm").textContent);
    }
  });
  setStatus(localized(`<b class="key">${r}</b> pathway lit on the plexus · <b>${muscles}</b> muscles across <b>${nerves.size}</b> nerves highlighted below. <span style="color:var(--ink-soft)">Click ${r} again to clear.</span>`, `Trajet <b class="key">${r}</b> allumé sur le plexus · <b>${muscles}</b> muscles répartis sur <b>${nerves.size}</b> nerfs surlignés ci-dessous. <span style="color:var(--ink-soft)">Cliquez à nouveau ${r} pour effacer.</span>`));
}

function clearFocus(){
  focusNerve=null;
  document.querySelectorAll(".card").forEach(c=>c.classList.remove("focus","dimcard"));
  document.querySelectorAll(".braid .node,.braid .seg,.braid .branchbox,.braid .bconn").forEach(n=>n.classList.remove("dim","lit","sweep"));
}
function focusNerveFn(id){
  clearRoot(); clearTree(); clearSite(); clearPlex();
  if(focusNerve===id){clearFocus(); defaultStatus(); return;}
  clearFocus(); focusNerve=id;
  // cards
  document.querySelectorAll(".card").forEach(c=>{
    if(c.dataset.nerve===id) c.classList.add("focus"); else c.classList.add("dimcard");
  });
  // braid: light this nerve's FULL upstream path (root→trunk→division→cord→nerve), dim the rest
  document.querySelectorAll(".braid .node").forEach(n=>{
    const pn=(n.dataset.path||"").split(" ");
    if(!(n.dataset.path && pn.includes(id))) n.classList.add("dim");
  });
  document.querySelectorAll(".braid .branchbox,.braid .bconn").forEach(b=>b.classList.add("dim"));
  document.querySelectorAll(".braid .seg").forEach(seg=>{
    const pn=(seg.dataset.path||"").split(" ");
    if(seg.dataset.path && pn.includes(id)){
      seg.classList.add("lit");
      try{ const L=seg.getTotalLength(); seg.style.setProperty("--len",L); seg.classList.add("sweep"); }catch(e){}
    } else { seg.classList.add("dim"); }
  });
  const card=document.getElementById("card-"+id);
  const reduce = (typeof matchMedia==="function") && matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(card){ card.classList.remove("collapsed");
    if(typeof card.scrollIntoView==="function"){ try{ card.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"}); }catch(e){} } }
  setStatus(localized(`Focused <b>${NAME[id]||id}</b>. <span style="color:var(--ink-soft)">Click it again to clear.</span>`, `<b>${NAME[id]||id}</b> ciblé. <span style="color:var(--ink-soft)">Cliquez à nouveau pour effacer.</span>`));
}

function runSearch(qv){
  query=qv.trim().toLowerCase();
  document.getElementById("qx").style.display=query?"block":"none";
  const items=document.querySelectorAll("[data-search]");
  if(!query){ items.forEach(i=>{i.style.display="";unmark(i);}); applyTypeFilters(); defaultStatus(); return;}
  clearRoot(); clearFocus(); clearTree(); clearSite(); clearPlex();
  let hits=0;
  items.forEach(i=>{
    const match=i.dataset.search.includes(query);
    i.style.display=match?"":"none";
    if(match){hits++; mark(i);} else unmark(i);
  });
  // show/hide whole cards depending on whether they have visible items
  document.querySelectorAll(".card").forEach(c=>{
    const vis=c.querySelectorAll('[data-search]:not([style*="display: none"])').length;
    c.style.display=vis?"":"none";
  });
  applyTypeFilters();
  setStatus(localized(`Search “<b>${esc(qv)}</b>” — <b>${hits}</b> matches.`, `Recherche « <b>${esc(qv)}</b> » — <b>${hits}</b> résultat${hits===1?"":"s"}.`));
}
function mark(i){ const nm=i.querySelector(".mn")||i; if(nm.dataset.orig===undefined)nm.dataset.orig=nm.innerHTML;
  const re=new RegExp("("+query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
  nm.innerHTML=nm.dataset.orig.replace(re,"<mark>$1</mark>"); }
function unmark(i){ const nm=i.querySelector(".mn")||i; if(nm&&nm.dataset.orig!==undefined){nm.innerHTML=nm.dataset.orig;} }

function defaultStatus(){ setStatus(localized(`Tip: click a root level, a nerve in the plexus, or search a muscle. <span style="color:var(--ink-soft)">Nothing selected.</span>`, `Astuce : cliquez une racine, un nerf du plexus, ou recherchez un muscle. <span style="color:var(--ink-soft)">Rien de sélectionné.</span>`)); }

/* wire events */
document.querySelectorAll(".rootchip").forEach(b=>b.onclick=()=>selectRoot(b.dataset.root));
document.querySelectorAll(".rootcard").forEach(b=>b.onclick=()=>selectRoot(b.dataset.root));
document.querySelectorAll(".braid .node.term").forEach(n=>n.onclick=()=>focusNerveFn(n.dataset.nerve));
document.querySelectorAll(".braid .node.root").forEach(n=>n.onclick=()=>selectRoot(n.dataset.root));
document.querySelectorAll(".braid .plexel").forEach(g=>g.onclick=()=>plexClick(g.dataset.elself));
document.querySelectorAll(".chead").forEach(h=>h.onclick=()=>h.closest(".card").classList.toggle("collapsed"));
document.querySelectorAll(".tnode.tn-on").forEach(g=>g.addEventListener("click",()=>treeClick(g)));
document.querySelectorAll("#cmap .csite").forEach(g=>g.addEventListener("click",()=>{ if(g.dataset.prox) proxClick(g.dataset.prox,g); else siteClick(g); }));
document.querySelectorAll(".tg").forEach(t=>t.onclick=()=>{
  const k=t.dataset.t; if(typeOff.has(k)){typeOff.delete(k);t.classList.remove("off");}else{typeOff.add(k);t.classList.add("off");}
  applyTypeFilters();
});
const q=document.getElementById("q");
q.addEventListener("input",e=>runSearch(e.target.value));
document.getElementById("qx").onclick=()=>{q.value="";runSearch("");q.focus();};
document.getElementById("printbtn").onclick=()=>{ clearRoot();clearFocus();clearTree();clearSite();clearPlex();
  document.querySelectorAll(".card").forEach(c=>c.classList.remove("collapsed"));
  setTimeout(()=>{ try{window.print();}catch(e){} },60); };
if(typeof window!=="undefined") window.addEventListener("beforeprint",()=>{ clearRoot();clearFocus();clearTree();clearSite();clearPlex(); }, {signal});
document.getElementById("reset").onclick=()=>{
  clearRoot();clearFocus();clearTree();clearSite();clearLesion();clearPlex();clearAnom();clearProx();typeOff.clear();
  document.querySelectorAll(".tg").forEach(t=>t.classList.remove("off"));
  q.value="";runSearch("");
  document.querySelectorAll(".card").forEach(c=>{c.style.display="";c.classList.remove("collapsed");});
  defaultStatus();
};
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){document.getElementById("reset").click();q.blur();}
  if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();} }, {signal});
defaultStatus();

  // Restore selections and filters after rebuilding localized labels and diagrams.
  if(previous.root) selectRoot(previous.root);
  else if(previous.nerve) focusNerveFn(previous.nerve);
  else if(previous.plex) plexClick(previous.plex);
  else if(previous.treeIndex>=0) document.querySelectorAll('.tnode.tn-on')[previous.treeIndex]?.dispatchEvent(new MouseEvent('click'));
  else if(previous.siteIndex>=0) document.querySelectorAll('#cmap .csite')[previous.siteIndex]?.dispatchEvent(new MouseEvent('click'));
  if(previous.lesion) document.querySelector('[data-lid="'+previous.lesion+'"]')?.click();
  if(previous.anom) {
    const index=ANOM.findIndex(a=>a.id===previous.anom);
    if(index>=0)document.querySelectorAll('#anombar .lpill')[index]?.click();
  }
  for(const type of previous.types||[])document.querySelector('.tg[data-t="'+type+'"]')?.click();
  if(previous.search){q.value=previous.search;runSearch(previous.search);}
  for(const id of previous.collapsed||[])document.getElementById(id)?.classList.add('collapsed');
  document.getElementById('langBtn').onclick=()=>{
    const state={root:activeRoot,nerve:focusNerve,plex:plexSel,
      treeIndex:Array.from(document.querySelectorAll('.tnode.tn-on')).indexOf(treeSel),
      siteIndex:Array.from(document.querySelectorAll('#cmap .csite')).findIndex(n=>n===siteSel||n===proxSel),
      lesion:lesionSel,anom:anomSel,types:[...typeOff],search:q.value,
      collapsed:Array.from(document.querySelectorAll('.card.collapsed'),c=>c.id)};
    language=lang==='fr'?'en':'fr';
    try{localStorage.setItem('upperLimbLanguage',language);}catch{}
    try{const url=new URL(location.href);url.searchParams.set('lang',language);history.replaceState(null,'',url);}catch{}
    const position=window.scrollY;
    renderExplorer(language,state);
    window.scrollTo({top:position,behavior:'instant'});
    document.getElementById('langBtn').focus({preventScroll:true});
  };
}
renderExplorer(language);
